<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Player stats · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}th[data-k]{cursor:pointer;white-space:nowrap}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid #2a3a52;background:var(--bg3);color:var(--tx);font:600 14px var(--f);cursor:pointer}.tabs button.on{background:var(--c2);color:#000;border-color:var(--c2)}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Player stats</h1><p id="sub">Loading…</p></div><div class="card f"><select id="y"></select><select id="k"><option value="0">Regular season</option><option value="1">Playoffs</option></select><select id="t"><option value="">All teams</option></select></div><div class="tabs" id="tb"></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="faces.js"></script><script src="statsagg.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const ab=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid]));
$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');$('t').innerHTML+=teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');
const CATS=Object.keys(FBGMStatsAgg.CATS);let cat=CATS[0],rows=[],skip=new Set(),sortK=null,dir=-1,faces={};
$('tb').innerHTML=CATS.map(c=>`<button data-c="${c}">${c}</button>`).join('');
$('tb').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;sortK=null;dir=-1;draw()}};
async function load(){$('sub').textContent='Loading…';const y=+$('y').value;const [r,g]=await Promise.all([HubDB.idx('box','season',y),HubDB.idx('games','season',y)]);rows=r;skip=new Set(g.filter(x=>x.allStar).map(x=>x.gid));draw()}
async function draw(){const C=FBGMStatsAgg.CATS[cat],tid=$('t').value;Hub.setTitle($('y').value);document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
 let L=FBGMStatsAgg.playerTable(rows,cat,{playoffs:$('k').value==='1',skip,tid:tid===''?null:+tid});const key=sortK||C.sort;L=L.sort((a,b)=>(b[key]-a[key])*(dir<0?1:-1)).slice(0,100);
 const P=await Promise.all(L.map(e=>HubDB.get('players',e.pid)));faces={};P.forEach((p,i)=>{faces[L[i].pid]=p&&p.face});
 const fx=(k,v)=>['cmpPct','ypa','ypc','ypr','rating'].includes(k)?v.toFixed(1):v;
 $('sub').textContent=$('y').value+' · '+cat+' · '+L.length+' players shown';
 o.innerHTML=L.length?'<table><tr><th>#</th><th>Player</th><th>Team</th><th class="n" data-k="gp">GP</th>'+C.cols.map(([k,l])=>`<th class="n" data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+L.map((e,i)=>{const p=P[i]||{};return`<tr class="${e.tid===s.userTid?'me':''}"><td>${i+1}</td><td><span class="av" data-pid="${e.pid}"></span><a href="player.html?pid=${e.pid}">${((p.firstName||'')+' '+(p.lastName||'')).trim()||'#'+e.pid}</a></td><td>${Logo.t(e.tid,18)} ${ab[e.tid]??''}</td><td class="n">${e.gp}</td>`+C.cols.map(([k])=>`<td class="n ${k===key?'':''}">${k===key?'<b>'+fx(k,e[k])+'</b>':fx(k,e[k])}</td>`).join('')+'</tr>'}).join('')+'</table>':'<p>No data for this selection.</p>';
 o.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===sortK?-dir:-1;sortK=k;draw()});Faces.lazy(o,pid=>faces[pid])}
$('y').onchange=load;$('k').onchange=$('t').onchange=draw;load()})()</script></body></html>
