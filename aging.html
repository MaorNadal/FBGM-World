<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ageing · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.pb{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg3);min-width:120px}.pb i{background:var(--c2)}.pb b{background:var(--c1)}svg{width:100%;height:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>Models</small><h1>Ageing curves</h1><p id="sub">Loading…</p></div><div class="card"><select id="p"><option value="">All positions</option></select></div><div class="card" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sel=document.getElementById('p');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const P=await HubDB.scan('players',p=>(p.ratings||[]).length>1&&p.born);sel.innerHTML+=[...new Set(P.flatMap(p=>p.ratings.map(r=>r.pos)))].filter(Boolean).sort().map(x=>`<option>${x}</option>`).join('');
function draw(){const A=FBGMModels.aging(P,sel.value).filter(a=>a.n>=20);Hub.setTitle('Ageing');document.getElementById('sub').textContent=P.length.toLocaleString('en-US')+' players · average change in overall rating from one season to the next';
 if(!A.length){o.innerHTML='<p>Not enough data.</p>';return}const W=640,H=260,Q=36,mx=Math.max(1,...A.map(a=>Math.abs(a.mean)))*1.15,bw=(W-2*Q)/A.length,ys=v=>H/2-(v/mx)*(H/2-Q);
 o.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average rating change by age"><line x1="${Q}" x2="${W-Q}" y1="${H/2}" y2="${H/2}" stroke="#4a5d7a"/>${A.map((a,i)=>`<rect x="${Q+i*bw+2}" width="${bw-4}" y="${Math.min(ys(0),ys(a.mean))}" height="${Math.abs(ys(a.mean)-ys(0))}" fill="${a.mean>=0?'var(--c2)':'#ff5468'}"><title>Age ${a.age}: ${a.mean>=0?'+':''}${a.mean.toFixed(2)} (${a.n} player-seasons)</title></rect><text x="${Q+i*bw+bw/2}" y="${H-8}" fill="#8ea0b8" font-size="11" text-anchor="middle">${a.age}</text>`).join('')}</svg><p class="mu">Bars show the mean change in overall rating at that age; ages with fewer than 20 observations are hidden. Only consecutive seasons count. Best age to grow: <b>${A.reduce((b,a)=>a.mean>b.mean?a:b).age}</b>.</p>`}
sel.onchange=draw;draw()})()</script></body></html>
