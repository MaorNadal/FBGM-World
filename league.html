<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}tr.me{background:#ffffff12}.x{color:var(--mu)}.ch{display:inline-block;border-radius:99px;padding:0 8px;margin-left:3px;font-size:11px;font-weight:800;background:var(--bg3);color:var(--mu)}.ch.sd{background:var(--c2);color:#111}.ch.by{background:#27d17f33;color:var(--ok)}tr.cut td{border-bottom:2px dashed var(--c2)}.pos{color:var(--mu);width:34px}.vw{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.vw button{min-height:40px;padding:0 16px;border:1px solid #2a3a52;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.vw button.on{background:var(--c2);color:#000;border-color:var(--c2)}</style></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>Standings</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Season</h2><select id="ss" style="min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit"></select><div class="vw" id="vw"><button data-v="d" class="on">Divisions</button><button data-v="c">Conferences</button><button data-v="l">Whole league</button></div><p style="margin:10px 0 0"><label style="cursor:pointer"><input type="checkbox" id="mo"> Show detail: games behind, home, road, division, conference, points, streak, last ten</label></p></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="transform.js"></script><script src="standings.js"></script><script src="splits.js"></script><script src="tiebreak.js"></script><script src="standview.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sel=document.getElementById('ss');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a></div>';document.getElementById('sub').textContent='No data';return}
const [teams,ga]=await Promise.all([HubDB.all('teams'),HubDB.get('meta','gameAttributes')]),g=(ga&&ga.v)||{},A=FBGMTransform.attr;
Logo.init(teams);const seasons=[...new Set(teams.flatMap(t=>(t.seasons||[]).map(x=>x.season)))].sort((a,b)=>b-a);
sel.innerHTML=seasons.map(x=>`<option>${x}</option>`).join('');
let vw='d';const rec=(a,b,c)=>a+'-'+b+(c?'-'+c:''),pc=t=>t.pct.toFixed(3).replace(/^0/,'');
const SEL=new URLSearchParams(location.search);if(SEL.get('view'))vw=SEL.get('view');document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===vw));
const esc=x=>String(x).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function draw(){const y=+sel.value,c=A(g.confs,y),d=A(g.divs,y),more=document.getElementById('mo').checked,confs=Array.isArray(c)?c:[],divs=Array.isArray(d)?d:[];
 document.getElementById('sub').textContent=y+' season'+(y===s.season?' · in progress':'');Hub.setTitle(y);
 const G=await HubDB.idx('games','season',y);let X={};if(more){try{X=FBGMSplits.splits(G,teams,y)}catch(e){console.error(e)}}
 const r=(()=>{const v=A(g.numGamesPlayoffSeries,y);return Array.isArray(v)?v.length:null})(),b=+A(g.numPlayoffByes,y)||0,bc=A(g.playoffsByConf,y);
 let V;try{V=FBGMStandView.view(teams,G,y,{confs,divs,tiebreakers:A(g.tiebreakers,y),nPlayoff:r?Math.pow(2,r)-b:14,byes:b,byConf:bc===true})}catch(e){console.error(e);V=null}
 const S=FBGMStandings.standings(teams,y,confs,divs),ST={};S.forEach(cf=>cf.divisions.forEach(dv=>dv.teams.forEach(t=>ST[t.tid]=t)));
 const R=tid=>V&&V.row[tid]||{};
 const chips=(t,skip)=>{const x=R(t.tid),h=[];if(x.seed&&x.in)h.push(`<span class="ch ${x.bye?'by':'sd'}" title="Playoff seed${x.seedGroup&&x.seedGroup!=='League'?' in the '+esc(x.seedGroup):''}">${x.bye?'BYE · ':''}#${x.seed}</span>`);
  if(skip!=='l'&&x.league)h.push(`<span class="ch" title="Place in the whole league">L${x.league}</span>`);if(skip!=='c'&&x.conf&&confs.length)h.push(`<span class="ch" title="Place in the conference">C${x.conf}</span>`);if(skip!=='d'&&x.div&&divs.length)h.push(`<span class="ch" title="Place in the division">D${x.div}</span>`);return h.join('')};
 const table=(title,list,skip)=>{const lead=ST[list[0]];const nIn=V?list.filter(tid=>R(tid).in).length:0;
  return `<table><tr><th class="pos">#</th><th>${esc(title)}</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">PCT</th>${more?'<th class="n">GB</th><th class="n">Home</th><th class="n">Road</th><th class="n">Div</th><th class="n">Conf</th><th class="n">PF</th><th class="n">PA</th><th class="n">Diff</th><th class="n">Strk</th><th class="n">L10</th>':''}<th>Standing</th></tr>`+list.map((tid,i)=>{const t=ST[tid];if(!t)return'';const x=X[t.tid]||{},gb=lead?((lead.w-t.w)+(t.l-lead.l))/2:0,why=R(tid).why;
  return `<tr class="${t.tid===s.userTid?'me':''} ${(skip==='l'||(skip==='c'&&bc===true))&&nIn&&i+1===nIn?'cut':''}"><td class="pos n" title="${why?'Tiebreak: '+esc(why):''}">${i+1}${why?'*':''}</td><td>${Logo.t(t.tid,22,y)} <a href="team.html#${t.tid}">${esc(t.name)}</a></td><td class="n">${t.w}</td><td class="n">${t.l}</td><td class="n">${t.t}</td><td class="n">${pc(t)}</td>`+(more?`<td class="n x">${gb<=0?'–':gb}</td><td class="n">${x.home?rec(...x.home):''}</td><td class="n">${x.road?rec(...x.road):''}</td><td class="n">${x.div?rec(...x.div):''}</td><td class="n">${x.conf?rec(...x.conf):''}</td><td class="n">${x.pf??''}</td><td class="n">${x.pa??''}</td><td class="n ${x.pf-x.pa>=0?'ok':'bad'}">${x.pf==null?'':(x.pf-x.pa>0?'+':'')+(x.pf-x.pa)}</td><td class="n">${x.streak||''}</td><td class="n">${x.l10?rec(...x.l10):''}</td>`:'')+`<td>${chips(t,skip)}</td></tr>`}).join('')+'</table>'};
 const note='<p class="mu" style="margin:6px 4px 0">Order follows the league\'s tiebreaker list ('+(V?V.crit.join(', '):'win percentage only')+'). * = the tie was broken by a rule. Chips: #n playoff seed, L league place, C conference place, D division place.'+(bc===true?'':' This league seeds the playoffs across the whole league.')+'</p>';
 if(vw==='l'||(!confs.length&&vw!=='d')){const order=V?V.league:Object.keys(ST).map(Number);o.innerHTML='<div class="card sc"><h2>Whole league</h2>'+table('Team',order,'l')+'</div>'+note}
 else if(vw==='c'){o.innerHTML=confs.map(cf=>{const cg=V&&V.confs.find(x=>x.cid===cf.cid),order=cg?cg.order:S.filter(z=>z.name===cf.name).flatMap(z=>z.divisions.flatMap(dv=>dv.teams.map(t=>t.tid)));return `<div class="card sc"><h2>${esc(cf.name)}</h2>`+table('Team',order,'c')+'</div>'}).join('')+note}
 else{o.innerHTML=S.map(cf=>`<div class="card sc"><h2>${esc(cf.name)}</h2>`+cf.divisions.map(dv=>{const dg=V&&V.divs.find(x=>x.name===dv.name&&(cf.name===(confs.find(k=>k.cid===x.cid)||{}).name)),order=dg&&dg.order.length?dg.order:dv.teams.map(t=>t.tid);return table(dv.name,order,'d')}).join('')+'</div>').join('')+note}}
sel.onchange=draw;document.getElementById('mo').onchange=draw;document.getElementById('vw').onclick=e=>{const k=e.target.dataset.v;if(!k)return;vw=k;document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===k));draw()};draw()})()</script></body></html>
