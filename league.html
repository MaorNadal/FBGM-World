<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>Standings</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Season</h2><select id="ss" style="min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit"></select></div><div id="out"></div></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/transform.js"></script><script src="assets/js/standings.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sel=document.getElementById('ss');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a></div>';document.getElementById('sub').textContent='No data';return}
const [teams,ga]=await Promise.all([HubDB.all('teams'),HubDB.get('meta','gameAttributes')]),g=(ga&&ga.v)||{};
const seasons=[...new Set(teams.flatMap(t=>(t.seasons||[]).map(x=>x.season)))].sort((a,b)=>b-a);
sel.innerHTML=seasons.map(x=>`<option>${x}</option>`).join('');
function draw(){const y=+sel.value,c=FBGMTransform.attr(g.confs,y),d=FBGMTransform.attr(g.divs,y);
 document.getElementById('sub').textContent=y+' season'+(y===s.season?' · in progress':'');Hub.setTitle(y);
 o.innerHTML=FBGMStandings.standings(teams,y,Array.isArray(c)?c:[],Array.isArray(d)?d:[]).map(cf=>`<div class="card"><h2>${cf.name}</h2>`+cf.divisions.map(dv=>`<table><tr><th>${dv.name}</th><th>W</th><th>L</th><th>T</th><th>PCT</th><th style="width:30%"></th></tr>`+dv.teams.map(t=>`<tr${t.tid===s.userTid?' style="background:#ffffff12"':''}><td>${t.name}</td><td>${t.w}</td><td>${t.l}</td><td>${t.t}</td><td>${t.pct.toFixed(3).replace(/^0/,'')}</td><td><div class="bar"><i style="width:${t.pct*100}%"></i></div></td></tr>`).join('')+`</table>`).join('')+`</div>`).join('')}
sel.onchange=draw;draw()})()</script></body></html>
