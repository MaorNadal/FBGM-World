<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}tr.me{background:#ffffff12}.x{color:var(--mu)}</style></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>Standings</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Season</h2><select id="ss" style="min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit"></select><p style="margin:10px 0 0"><label style="cursor:pointer"><input type="checkbox" id="mo"> Show detail: games behind, home, road, division, conference, points, streak, last ten</label></p></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="transform.js"></script><script src="standings.js"></script><script src="splits.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sel=document.getElementById('ss');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a></div>';document.getElementById('sub').textContent='No data';return}
const [teams,ga]=await Promise.all([HubDB.all('teams'),HubDB.get('meta','gameAttributes')]),g=(ga&&ga.v)||{};
Logo.init(teams);const seasons=[...new Set(teams.flatMap(t=>(t.seasons||[]).map(x=>x.season)))].sort((a,b)=>b-a);
sel.innerHTML=seasons.map(x=>`<option>${x}</option>`).join('');
const rec=(a,b,c)=>a+'-'+b+(c?'-'+c:''),pc=t=>t.pct.toFixed(3).replace(/^0/,'');
async function draw(){const y=+sel.value,c=FBGMTransform.attr(g.confs,y),d=FBGMTransform.attr(g.divs,y),more=document.getElementById('mo').checked;
 document.getElementById('sub').textContent=y+' season'+(y===s.season?' · in progress':'');Hub.setTitle(y);
 let X={};if(more){try{X=FBGMSplits.splits(await HubDB.idx('games','season',y),teams,y)}catch(e){console.error(e)}}
 const S=FBGMStandings.standings(teams,y,Array.isArray(c)?c:[],Array.isArray(d)?d:[]);
 o.innerHTML=S.map(cf=>`<div class="card sc"><h2>${cf.name}</h2>`+cf.divisions.map(dv=>{const lead=dv.teams[0];
  return `<table><tr><th>${dv.name}</th><th class="n">W</th><th class="n">L</th><th class="n">T</th><th class="n">PCT</th>${more?'<th class="n">GB</th><th class="n">Home</th><th class="n">Road</th><th class="n">Div</th><th class="n">Conf</th><th class="n">PF</th><th class="n">PA</th><th class="n">Diff</th><th class="n">Strk</th><th class="n">L10</th>':'<th style="width:30%"></th>'}</tr>`+dv.teams.map(t=>{const x=X[t.tid]||{},gb=lead?((lead.w-t.w)+(t.l-lead.l))/2:0;
  return `<tr${t.tid===s.userTid?' class="me"':''}><td>${Logo.t(t.tid,22,y)} <a href="team.html#${t.tid}">${t.name}</a></td><td class="n">${t.w}</td><td class="n">${t.l}</td><td class="n">${t.t}</td><td class="n">${pc(t)}</td>`+(more?`<td class="n x">${gb<=0?'–':gb}</td><td class="n">${x.home?rec(...x.home):''}</td><td class="n">${x.road?rec(...x.road):''}</td><td class="n">${x.div?rec(...x.div):''}</td><td class="n">${x.conf?rec(...x.conf):''}</td><td class="n">${x.pf??''}</td><td class="n">${x.pa??''}</td><td class="n ${x.pf-x.pa>=0?'ok':'bad'}">${x.pf==null?'':(x.pf-x.pa>0?'+':'')+(x.pf-x.pa)}</td><td class="n">${x.streak||''}</td><td class="n">${x.l10?rec(...x.l10):''}</td>`:`<td><div class="bar"><i style="width:${t.pct*100}%"></i></div></td>`)+'</tr>'}).join('')+'</table>'}).join('')+'</div>').join('')}
sel.onchange=draw;document.getElementById('mo').onchange=draw;draw()})()</script></body></html>
