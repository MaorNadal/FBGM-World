<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Injuries · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n{text-align:right;font-variant-numeric:tabular-nums}.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Injury report</h1><p id="sub">Loading…</p></div><div class="card"><div class="seg" id="vw" style="margin-bottom:10px"><button data-v="n" class="on">Now</button><button data-v="h">History</button></div><div class="f" id="fb"><select id="t"><option value="">All teams</option></select><select id="o"><option value="g">Longest out</option><option value="r">Best rating</option></select><select id="hy" hidden></select></div></div><div class="card sc" id="out"></div><div id="hs"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script><script src="viz.js"></script><script src="injstats.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),nm=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid]));
$('t').innerHTML+=teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');
const R=(await HubDB.scan('players',p=>p.tid>=0&&p.injury&&p.injury.gamesRemaining>0)).map(p=>Object.assign(FBGMRoster.roster([p],p.tid,s.season)[0],{tid:p.tid,out:p.injury.gamesRemaining,kind:p.injury.type||'Injured'}));
function draw(){Hub.setTitle('Injuries');let d=R.filter(r=>!$('t').value||r.tid==$('t').value);d.sort($('o').value==='g'?(a,b)=>b.out-a.out:(a,b)=>(b.ovr||0)-(a.ovr||0));
 $('sub').textContent=d.length+' injured players';o.innerHTML=d.length?'<table><tr><th>Player</th><th>Team</th><th>Pos</th><th class="n">Ovr</th><th>Injury</th><th class="n">Games out</th></tr>'+d.map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${nm[r.tid]??''}</td><td>${r.pos}</td><td class="n">${r.ovr??''}</td><td>${r.kind}</td><td class="n"><b>${r.out}</b></td></tr>`).join('')+'</table>':'<p>No injuries.</p>'}
$('t').onchange=$('o').onchange=draw;draw();
/* 1.68: injury history of the whole league, from the injuries every player carries (FR-ST-11) */
let H=null,view='n';const E=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),tmo=Object.fromEntries(teams.map(t=>[t.tid,t]));Logo.init(teams);
async function hist(){const y=$('hy').value===''?null:+$('hy').value;if(!H){o.innerHTML='<p class="mu">Reading the injury records of every player…</p>';
  H=await HubDB.scanMap('players',p=>{const g={};for(const x of p.stats||[])if(!x.playoffs&&x.tid>=0)g[x.season+':'+x.tid]=(g[x.season+':'+x.tid]||0)+(x.gp||0);const tidOf=yr=>{let b=null,m=-1;for(const k in g){const [a,t]=k.split(':');if(+a===yr&&g[k]>m){m=g[k];b=+t}}return b};
   const rt=(p.ratings||[]).slice(-1)[0]||{};return{pid:p.pid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos:rt.pos||'',list:(p.injuries||[]).filter(Boolean).map(x=>({season:x.season,type:x.type,games:x.games!=null?x.games:x.gamesRemaining,tid:tidOf(x.season)}))}});
  const ys=[...new Set(H.flatMap(r=>r.list.map(x=>x.season)))].sort((a,b)=>b-a);$('hy').innerHTML='<option value="">All seasons</option>'+ys.map(v=>`<option>${v}</option>`).join('')}
 const A=FBGMInjStats.aggregate(H,y);$('sub').textContent=(y==null?'All seasons':y)+' · '+A.n.toLocaleString('en-US')+' injuries · '+A.games.toLocaleString('en-US')+' games missed · '+A.avg.toFixed(1)+' games per injury';
 o.innerHTML=A.n?'<h2>Injuries by type</h2><div id="ht"></div>':'<p class="mu">No injury records for this selection.';
 $('hs').innerHTML=A.n?'<div class="card"><h2>Injuries by team</h2><div id="hm"></div></div><div class="card"><h2>Injuries by season</h2><div id="hq"></div></div><div class="card sc"><h2>Longest injuries</h2><table><tr><th>Player</th><th>Pos</th><th>Season</th><th>Injury</th><th class="n">Games</th></tr>'+A.longest.map(x=>`<tr><td><a href="player.html?pid=${x.pid}">${E(x.name)}</a> ${tmo[x.tid]?Logo.t(x.tid,16,x.season):''}</td><td>${E(x.pos)}</td><td>${x.season}</td><td>${E(x.type)}</td><td class="n"><b>${x.games}</b></td></tr>`).join('')+'</table></div><div class="card sc"><h2>Most injured players</h2><table><tr><th>Player</th><th>Pos</th><th class="n">Injuries</th><th class="n">Games missed</th></tr>'+A.players.map(x=>`<tr><td><a href="player.html?pid=${x.k}">${E(x.name)}</a></td><td>${E(x.pos)}</td><td class="n">${x.n}</td><td class="n">${x.games}</td></tr>`).join('')+'</table></div>':'';
 if(A.n){Viz.bars($('ht'),A.type.map(t=>({id:t.k,label:t.k+' · '+t.games+' games',value:t.n})),{top:12,fmt:v=>v+(v===1?' injury':' injuries')});
  Viz.bars($('hm'),A.team.filter(t=>tmo[t.k]).map(t=>({id:+t.k,label:(tmo[t.k].region+' '+tmo[t.k].name).trim(),value:t.n,c1:(tmo[t.k].colors||[])[0],logo:Logo.t(+t.k,24),href:'team.html#'+t.k})),{top:10,fmt:v=>v+' injuries',mine:s.userTid});
  Viz.bars($('hq'),A.seasons.slice().reverse().map(z=>({id:z.season,label:z.season+' · '+z.games+' games missed',value:z.n})),{top:12,fmt:v=>v+' injuries'})}}
function mode(v){view=v;document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('hy').hidden=v!=='h';$('t').hidden=$('o').hidden=v==='h';$('hs').innerHTML='';v==='h'?hist().catch(e=>{o.innerHTML='<p class="mu">Could not read the history: '+E(e.message)+'</p>'}):draw()}
document.querySelectorAll('#vw button').forEach(b=>b.onclick=()=>mode(b.dataset.v));$('hy').onchange=()=>hist();})()</script></body></html>
