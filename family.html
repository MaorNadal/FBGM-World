<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Families · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.gen{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu)}.row{display:flex;flex-wrap:wrap;gap:10px}.pc{display:flex;gap:10px;align-items:center;background:var(--bg3);border-radius:14px;padding:10px 12px;border-top:3px solid var(--c2);min-width:230px}.pc.me{border-top-color:var(--c1);outline:2px solid var(--c2)}.pc b{display:block;line-height:1.2}.pc small{color:var(--mu)}.pc .av{flex:none}.rel{color:var(--c2);font-size:11px;text-transform:uppercase;letter-spacing:.08em}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1 id="h">Families</h1><p id="sub">Loading…</p></div>
<div class="card" id="tree" hidden></div>
<div class="card sc"><h2>Families in the league</h2><p class="mu" style="margin-top:0">Players linked by the relatives stored in the save (father, brother, son and so on), grouped into families. Click a name to open that family tree.</p><div id="all"></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),esc=Viz.esc,PI=FBGMPlayerInfo;const s=await HubDB.summary();
if(!s){$('all').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Families');
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 $('all').innerHTML='<p class="mu">Reading all players…</p>';
 const R=await HubDB.scanMap('players',p=>Array.isArray(p.relatives)&&p.relatives.some(x=>x&&x.pid!=null)?{pid:p.pid,tid:p.tid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),face:p.face,pos:PI.pos(p,s.season),ovr:PI.ovr(p,s.season),age:PI.age(p,s.season),born:p.born&&p.born.year,hof:!!p.hof,rel:p.relatives.filter(x=>x&&x.pid!=null).map(x=>({pid:x.pid,type:String(x.type||'relative'),name:x.name||''}))}:undefined);
 const M=Object.fromEntries(R.map(r=>[r.pid,r])),par={};const f=x=>par[x]===undefined||par[x]===x?(par[x]=x):(par[x]=f(par[x]));R.forEach(r=>{f(r.pid);r.rel.forEach(q=>{f(q.pid);par[f(q.pid)]=f(r.pid)})});
 const fam={};Object.keys(par).forEach(k=>{const root=f(+k);(fam[root]=fam[root]||[]).push(+k)});const fl=Object.values(fam).filter(a=>a.length>1).sort((a,b)=>b.length-a.length);
 const nm=pid=>M[pid]?M[pid].name:('Player '+pid),tn=t=>t>=0&&T[t]?T[t].abbrev:({'-1':'FA','-2':'Prospect','-3':'Retired'}[t]||'');
 $('sub').textContent=R.length.toLocaleString('en-US')+' players have relatives in the save · '+fl.length.toLocaleString('en-US')+' families';
 $('all').innerHTML=fl.length?'<table><tr><th>Family</th><th class="n">Players</th><th>Members</th></tr>'+fl.slice(0,60).map(a=>{const L=a.map(x=>M[x]).filter(Boolean),last=(L[0]?L[0].name.split(' ').slice(-1)[0]:'');return`<tr><td><b>${esc(last)}</b></td><td class="n">${a.length}</td><td style="white-space:normal">${a.map(x=>`<a href="family.html?pid=${x}">${esc(nm(x))}</a>`).join(', ')}</td></tr>`}).join('')+'</table>':'<p class="mu">No relatives are stored in this save (the relatives list of each player is empty). Open Tools / Player data check to confirm.</p>';
 const pid=+new URLSearchParams(location.search).get('pid');
 if(pid){const root=await HubDB.get('players',pid);if(root){const seen=new Map(),q=[[pid,0,'']];const UP=/father|mother|parent|grand/i,DOWN=/son|daughter|child|grandson/i;
  while(q.length&&seen.size<40){const [id,d,rel]=q.shift();if(seen.has(id)||d>3)continue;const p=id===pid?root:await HubDB.get('players',id);if(!p)continue;seen.set(id,{p,rel,d});for(const x of (p.relatives||[]))if(x&&x.pid!=null&&!seen.has(x.pid))q.push([x.pid,d+1,x.type||'relative'])}
  const gen=r=>UP.test(r)&&!/^(grandson)/i.test(r)?0:DOWN.test(r)?2:1,G=[[],[],[]];seen.forEach((v,id)=>{G[id===pid?1:gen(v.rel)].push([id,v])});
  const card=([id,v])=>{const x=PI.row(v.p,s.season),nn=((v.p.firstName||'')+' '+(v.p.lastName||'')).trim();return`<a class="pc ${id===pid?'me':''}" href="family.html?pid=${id}"><span class="av" data-pid="${id}"></span><div><span class="rel">${id===pid?'selected':esc(v.rel)}</span><b>${esc(nn)}</b><small>${esc(x.pos)} ${x.ovr==null?'':x.ovr} · age ${x.age==null?'?':x.age} · ${esc(tn(v.p.tid))}</small></div></a>`};
  const nn=((root.firstName||'')+' '+(root.lastName||'')).trim();$('h').textContent=nn;$('tree').hidden=false;
  $('tree').innerHTML=`<h2>Family tree of ${esc(nn)}</h2>${[['Parents and older generation',0],['Same generation',1],['Children and younger generation',2]].map(([t,i])=>G[i].length?`<div class="gen">${t}</div><div class="row">${G[i].map(card).join('')}</div>`:'').join('')}<p class="mu">Built from the relatives lists, up to three steps away and 40 people. The generation is read from the stored relation word (father, brother, son...); an unknown word is placed in the same generation.</p><p><a href="player.html?pid=${pid}">Open the player page ›</a></p>`;
  const P={};seen.forEach((v,id)=>P[id]=v.p);Faces.lazy($('tree'),id=>(P[id]||{}).face,id=>T[(P[id]||{}).tid])}}
}catch(e){$('all').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
