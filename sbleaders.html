<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Super Bowl leaders · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>
.sbh{border-radius:18px;padding:22px 20px;background:radial-gradient(500px 220px at 90% 0,#f4c54238,transparent),linear-gradient(160deg,#16110a,#0c0e16 65%);border:1px solid #f4c54255}.sbh small{letter-spacing:.3em;text-transform:uppercase;color:#f4c542}.sbh h1{margin:4px 0;font-size:clamp(30px,8vw,60px);line-height:1;text-transform:uppercase;background:linear-gradient(180deg,#ffe9a3,#f4c542 50%,#a8761a);-webkit-background-clip:text;background-clip:text;color:transparent}.sbh p{margin:0;color:#d9cfb3}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{min-height:40px;padding:0 16px;border:1px solid #f4c54255;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.tabs button.on{background:#f4c542;color:#000;border-color:#f4c542}
.gr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.cc{background:var(--bg2);border:1px solid #f4c54233;border-top:3px solid #f4c542;border-radius:14px;padding:12px}.cc h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#f4c542}
.ro{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #1e2b40}.ro:first-of-type{font-size:1.05em}.ro .n{color:var(--mu);text-align:center;font-size:12px}.ro .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}.ro small{display:block;color:var(--mu);font-size:11px}.ro .av{margin-right:6px;vertical-align:middle}
.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}.rg{color:#f4c542;letter-spacing:1px}</style></head><body>
<main class="wrap"><div class="sbh"><small>Player statistics in the championship game</small><h1>Super Bowl leaders</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="tabs" id="tb"><button data-k="c" class="on">Career</button><button data-k="s">Best single game</button><button data-k="g">One game</button><button data-k="r">Rings</button></div><div class="ctl" id="gc" style="margin-top:10px" hidden><div><label for="gs">Super Bowl</label><select id="gs"></select></div></div></div>
<div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaders.js"></script><script src="fantasy.js"></script><script src="finals.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),esc=Viz.esc,FI=FBGMFinals,LD=FBGMLeaders;const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Super Bowl leaders');
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 o.innerHTML='<div class="card"><p class="mu">Reading the finals…</p></div>';const G=await LeagueData.games(),FG=FI.finalGames(G,s.phase<4?s.season:null),gids=Object.keys(FG).map(Number).sort((a,b)=>FG[a].season-FG[b].season);
 if(!gids.length){$('sub').textContent='No championship game found';o.innerHTML='';return}
 const no={};gids.forEach((g,i)=>no[g]=FI.roman(i+1));let rows=[];for(const g of gids){const B=await HubDB.box(g);B.forEach(b=>{b.season=FG[g].season;rows.push(b)})}
 const P=await LeagueData.players(),byId=Object.fromEntries(P.map(p=>[p.pid,p])),nm=pid=>byId[pid]?((byId[pid].firstName||'')+' '+(byId[pid].lastName||'')).trim():'Player '+pid,ab=t=>T[t]?T[t].abbrev:'?';
 const CATS=LD.CATS.map(c=>[c[0],c[1]]);
 $('sub').textContent=gids.length+' Super Bowls · '+rows.length.toLocaleString('en-US')+' player lines · '+new Set(rows.map(r=>r.pid)).size.toLocaleString('en-US')+' players';
 $('gs').innerHTML=gids.slice().reverse().map(g=>`<option value="${g}">${no[g]} · ${FG[g].season} · ${esc(ab(FG[g].w))} ${FG[g].ws}–${FG[g].ls} ${esc(ab(FG[g].l))}</option>`).join('');
 const fmt=v=>Number.isInteger(v)?v.toLocaleString('en-US'):v.toFixed(1);
 const card=(title,L,kind)=>`<div class="cc"><h3>${esc(title)}</h3>${L.length?L.map((e,i)=>`<div class="ro"><span class="n">${i+1}</span><div><span class="av" data-pid="${e.pid}"></span><a href="player.html?pid=${e.pid}">${esc(nm(e.pid))}</a> ${Logo.t(e.tid,16,e.season)}<small>${kind==='c'?e.gp+' game'+(e.gp===1?'':'s')+' in Super Bowls':kind==='s'?'Super Bowl '+no[e.gid]+' · '+e.season+' · <a href="game.html?gid='+e.gid+'">box score</a>':esc(ab(e.tid))}</small></div><span class="v">${fmt(e.v)}</span></div>`).join(''):'<p class="mu">Nobody has a value.</p>'}</div>`;
 const fp=r=>FBGMFantasy.pts(r);
 let tab='c';
 function draw(){
  if(tab==='c'){o.innerHTML='<div class="gr">'+CATS.map(([t,f])=>card(t,LD.leaders(rows,f,10,'both',null),'c')).join('')+card('Fantasy points (standard)',(()=>{const m=new Map();rows.forEach(r=>{const v=fp(r);if(!v)return;const e=m.get(r.pid)||{pid:r.pid,v:0,tid:r.tid,g:new Set()};e.v+=v;e.tid=r.tid;e.g.add(r.gid);m.set(r.pid,e)});return[...m.values()].map(e=>({pid:e.pid,v:Math.round(e.v*10)/10,tid:e.tid,gp:e.g.size})).sort((a,b)=>b.v-a.v).slice(0,10)})(),'c')+'</div>'}
  else if(tab==='s'){o.innerHTML='<div class="gr">'+CATS.map(([t,f])=>card(t,FI.single(rows,f,10,FG),'s')).join('')+card('Fantasy points (standard)',rows.map(r=>({pid:r.pid,v:Math.round(fp(r)*10)/10,gid:r.gid,tid:r.tid,season:r.season})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,10),'s')+'</div>'}
  else if(tab==='g'){const g=+$('gs').value,R=rows.filter(r=>r.gid===g),f=FG[g];o.innerHTML=`<div class="card"><h2>Super Bowl ${no[g]} · ${f.season} · ${Logo.t(f.w,22,f.season)} ${esc(ab(f.w))} ${f.ws}–${f.ls} ${Logo.t(f.l,22,f.season)} ${esc(ab(f.l))} · <a href="game.html?gid=${g}" style="color:#f4c542">box score</a></h2></div><div class="gr">`+CATS.map(([t,fl])=>card(t,LD.leaders(R,fl,5,'both',null).map(e=>Object.assign(e,{season:f.season})),'g')).join('')+card('Fantasy points (standard)',R.map(r=>({pid:r.pid,v:Math.round(fp(r)*10)/10,tid:r.tid,season:f.season})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,5),'g')+'</div>'}
  else{const L=FI.players(rows,FG);o.innerHTML='<div class="card sc"><h2>Rings and appearances</h2><p class="mu" style="margin-top:0">Players who appear in the box score of a Super Bowl: wins (rings), losses and seasons.</p><table><tr><th>Player</th><th>Last team</th><th class="n">Wins</th><th class="n">Appearances</th><th class="n">Losses</th><th>Seasons</th></tr>'+L.slice(0,60).map(e=>`<tr><td><span class="av" data-pid="${e.pid}"></span><a href="player.html?pid=${e.pid}">${esc(nm(e.pid))}</a></td><td>${Logo.t(e.tid,18)} ${esc(ab(e.tid))}</td><td class="n"><b class="rg">${'🏆'.repeat(Math.min(e.wins,6))}</b> ${e.wins}</td><td class="n">${e.apps}</td><td class="n">${e.losses}</td><td>${e.years.join(', ')}</td></tr>`).join('')+'</table></div>'}
  $('gc').hidden=tab!=='g';Faces.lazy(o,pid=>(byId[pid]||{}).face,pid=>T[(byId[pid]||{}).tid])}
 $('tb').onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;$('tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw()};$('gs').onchange=draw;draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
