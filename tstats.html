<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team stats · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}th[data-k]{cursor:pointer;white-space:nowrap}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Team stats</h1><p id="sub">Loading…</p></div><div class="card f"><select id="y"></select><select id="k"><option value="0">Regular season</option><option value="1">Playoffs</option></select></div><div class="card" id="mp"></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="statsagg.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),V=Viz;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=await HubDB.all('teams');Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
let R=[],sortK='diff',dir=-1,chart=null;const C=[['w','W'],['l','L'],['ppg','PF/G'],['papg','PA/G'],['diff','Diff'],['ypg','Yds/G'],['pssYds','Pass yds'],['rusYds','Rush yds'],['td','TD'],['to','TO'],['sk','Sacks']];
async function load(){$('sub').textContent='Loading…';const y=+$('y').value;const [g,b]=await Promise.all([HubDB.idx('games','season',y),HubDB.idx('box','season',y)]);R=FBGMStatsAgg.teamTable(g,b,y,$('k').value==='1');Hub.setTitle(y);map();draw()}
const rank=(k,id,low)=>{const me=R.find(e=>e.tid===id)[k];const beat=R.filter(e=>low?e[k]<me:e[k]>me).length;return{rank:beat+1,of:R.length,pct:R.length>1?(1-beat/(R.length-1))*100:100}};
function card(e){const t=T[e.tid]||{},c=t.colors||[],pf=rank('ppg',e.tid),pa=rank('papg',e.tid,true),mk=(l,k,low,fmt)=>{const q=rank(k,e.tid,low);return{label:l,value:fmt?fmt(e[k]):e[k],rank:q.rank,pct:q.pct}};
 return V.card({title:((t.region||'')+' '+(t.name||'')).trim(),sub:e.w+'-'+e.l+(e.t?'-'+e.t:'')+' · '+(e.diff>=0?'+':'')+e.diff+' points',c1:c[0],c2:c[1],logo:Logo.t(e.tid,42,+$('y').value),
  big:[{label:'Points scored / game',value:e.ppg.toFixed(1),rank:pf.rank,of:pf.of},{label:'Points allowed / game',value:e.papg.toFixed(1),rank:pa.rank,of:pa.of}],
  rows:[mk('Yards per game','ypg',false,v=>v.toFixed(0)),mk('Passing yards','pssYds'),mk('Rushing yards','rusYds'),mk('Turnovers','to',true),mk('Sacks made','sk')],href:'schedule.html?tid='+e.tid,hrefLabel:'Team schedule'})}
function map(){if(R.length<3){$('mp').innerHTML='';chart=null;return}
 $('mp').innerHTML='<h2>Offence against defence</h2><div id="mapbox"></div><p class="mu">Each logo is a team. Right = scores more, up = allows fewer points (the vertical axis is flipped so up is better). Hover or tap a logo for the team card. <a href="charts.html#d=t&x=ppg&yk=papg" style="text-decoration:underline">Make your own chart in the Chart lab</a> · <a href="#" id="mpng" style="text-decoration:underline">save as image</a></p>';
 chart=V.scatter($('mapbox'),{points:R.map(e=>({id:e.tid,x:e.ppg,y:e.papg,label:((T[e.tid]||{}).region||'')+' '+((T[e.tid]||{}).name||''),short:(T[e.tid]||{}).abbrev,color:((T[e.tid]||{}).colors||[])[0],row:e})),xl:'Points scored per game',yl:'Points allowed per game',yNote:'lower is better',flipY:true,quad:{tr:'Strong offence, strong defence',bl:'Weak on both'},size:34,labels:true,
  marker:(p,z)=>Logo.t(p.id,z,+$('y').value),crest:p=>T[p.id]?Logo.crest(T[p.id],40):'',card:p=>card(p.row),title:'Points scored against points allowed per game'});
 $('mpng').onclick=async e=>{e.preventDefault();try{await V.savePng(chart.svgString(),'team-offence-defence.png')}catch(x){alert(x.message)}}}
function draw(){const L=[...R].sort((a,b)=>(a[sortK]-b[sortK])*(dir<0?-1:1));$('sub').textContent=$('y').value+' · '+R.length+' teams';const mx=Math.max(1,...R.map(e=>Math.abs(e.diff)));
 o.innerHTML='<table><tr><th>#</th><th>Team</th>'+C.map(([k,l])=>`<th class="n" data-k="${k}">${l}${k===sortK?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+L.map((e,i)=>{const t=T[e.tid]||{};return`<tr class="${e.tid===s.userTid?'me':''}"><td>${i+1}</td><td>${Logo.t(e.tid,22)} <a href="team.html#${e.tid}">${(t.region||'')+' '+(t.name||'')}</a></td>`+C.map(([k])=>{const v=e[k],f=['ppg','papg','ypg'].includes(k)?v.toFixed(1):v;return`<td class="n ${k==='diff'?(v>=0?'ok':'bad'):''}">${k==='diff'&&v>0?'+':''}${f}</td>`}).join('')+'</tr>'}).join('')+'</table><p><button class="btn ghost" id="tcsv">Export CSV</button></p>';
 o.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===sortK?-dir:-1;sortK=k;draw()});
 $('tcsv').onclick=()=>V.csv('team-stats-'+$('y').value+'.csv',['Team'].concat(C.map(c=>c[1])),L.map(e=>[((T[e.tid]||{}).region||'')+' '+((T[e.tid]||{}).name||'')].concat(C.map(c=>e[c[0]]))))}
$('y').onchange=$('k').onchange=load;load()})()</script></body></html>
