<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team stats · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}th[data-k]{cursor:pointer;white-space:nowrap}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid #2a3a52;background:var(--bg3);color:var(--tx);font:600 14px var(--f);cursor:pointer}.tabs button.on{background:var(--c2);color:#000;border-color:var(--c2)}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Team stats</h1><p id="sub">Loading…</p></div><div class="card f"><select id="y"></select><select id="k"><option value="0">Regular season</option><option value="1">Playoffs</option></select></div><div class="card" id="mp"></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="faces.js"></script><script src="statsagg.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=await HubDB.all('teams');Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
let R=[],sortK='diff',dir=-1;const C=[['w','W'],['l','L'],['ppg','PF/G'],['papg','PA/G'],['diff','Diff'],['ypg','Yds/G'],['pssYds','Pass yds'],['rusYds','Rush yds'],['td','TD'],['to','TO'],['sk','Sacks']];
async function load(){$('sub').textContent='Loading…';const y=+$('y').value;const [g,b]=await Promise.all([HubDB.idx('games','season',y),HubDB.idx('box','season',y)]);R=FBGMStatsAgg.teamTable(g,b,y,$('k').value==='1');Hub.setTitle(y);draw()}
function map(){if(R.length<3){$('mp').innerHTML='';return}const W=640,H=330,P=44,xs=R.map(e=>e.ppg),ys=R.map(e=>e.papg),ax=Math.min(...xs)-2,bx=Math.max(...xs)+2,ay=Math.min(...ys)-2,by=Math.max(...ys)+2,X=v=>P+(v-ax)/(bx-ax)*(W-2*P),Y=v=>P+(v-ay)/(by-ay)*(H-2*P),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
 $('mp').innerHTML=`<h2>Offence against defence</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Points scored against points allowed per game"><line x1="${X(mx)}" x2="${X(mx)}" y1="${P-12}" y2="${H-P+8}" stroke="#34465f" stroke-dasharray="5 4"/><line x1="${P-8}" x2="${W-P+10}" y1="${Y(my)}" y2="${Y(my)}" stroke="#34465f" stroke-dasharray="5 4"/><text x="${W-P}" y="${P-18}" fill="#27d17f" font-size="11" text-anchor="end">Best corner: scores more, allows fewer</text><text x="${P}" y="${H-P+26}" fill="#ff5468" font-size="11">Worst corner: scores less, allows more</text><text x="${W/2}" y="${H-6}" fill="#8ea0b8" font-size="11" text-anchor="middle">Points scored per game →</text>${R.map(e=>{const t=T[e.tid]||{},c=(t.colors||['#1b3a6b','#ffb81c']);return`<a href="schedule.html?tid=${e.tid}"><circle cx="${X(e.ppg).toFixed(1)}" cy="${Y(e.papg).toFixed(1)}" r="14" fill="${c[0]}" stroke="${c[1]}" stroke-width="3"/><text x="${X(e.ppg).toFixed(1)}" y="${(Y(e.papg)+3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${Hub.ink(c[0])}">${t.abbrev||''}</text><title>${(t.region||'')+' '+(t.name||'')}: ${e.ppg.toFixed(1)} scored, ${e.papg.toFixed(1)} allowed</title></a>`}).join('')}</svg><p class="mu">Each circle is a team. Right = scores more, up = allows fewer (up is better). Dashed lines are the league averages.</p>`}
function draw(){const L=[...R].sort((a,b)=>(a[sortK]-b[sortK])*(dir<0?-1:1));$('sub').textContent=$('y').value+' · '+R.length+' teams';map();const mx=Math.max(1,...R.map(e=>Math.abs(e.diff)));
 o.innerHTML='<table><tr><th>#</th><th>Team</th>'+C.map(([k,l])=>`<th class="n" data-k="${k}">${l}${k===sortK?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+L.map((e,i)=>{const t=T[e.tid]||{};return`<tr class="${e.tid===s.userTid?'me':''}"><td>${i+1}</td><td>${Logo.t(e.tid,22)} <a href="schedule.html?tid=${e.tid}">${(t.region||'')+' '+(t.name||'')}</a></td>`+C.map(([k])=>{const v=e[k],f=['ppg','papg','ypg'].includes(k)?v.toFixed(1):v;return`<td class="n ${k==='diff'?(v>=0?'ok':'bad'):''}">${k==='diff'&&v>0?'+':''}${f}</td>`}).join('')+'</tr>'}).join('')+'</table>';
 o.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===sortK?-dir:-1;sortK=k;draw()})}
$('y').onchange=$('k').onchange=load;load()})()</script></body></html>
