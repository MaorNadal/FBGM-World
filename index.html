<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FBGM Hub</title><link rel="stylesheet" href="hub.css"></head><body>
<main class="wrap" id="app"><div class="hero"><small>FBGM League Hub</small><h1>Your league. Your broadcast.</h1><p>Import your save once and everything here is built from it.</p></div><div class="card"><h2>Getting started</h2><p>No league imported on this device yet.</p><a class="btn" href="import.html">Import league file</a></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="schedule.js"></script><script src="elo.js"></script>
<script>(async()=>{const s=await HubDB.summary();if(!s)return;const [teams,np,ng,nb]=await Promise.all([HubDB.all('teams'),HubDB.count('players'),HubDB.count('games'),HubDB.count('box')]);
Logo.init(teams);const T=teams.find(t=>t.tid===s.userTid),nm=t=>t?((t.region||'')+' '+(t.name||'')).trim():'—';
if(T&&T.colors){localStorage.setItem(Hub.KEY+'theme',JSON.stringify([T.colors[0],T.colors[1]]));document.documentElement.style.setProperty('--c1',T.colors[0]);document.documentElement.style.setProperty('--c2',T.colors[1])}
const ph={'-3':'Fantasy draft','-2':'Expansion draft','-1':'Pre-draft',0:'Preseason',1:'Regular season',2:'After trade deadline',3:'Playoffs',4:'Before draft',5:'Draft',6:'After draft',7:'Re-sign players',8:'Free agency'}[s.phase]||'Phase '+s.phase;
const n=x=>Number(x).toLocaleString('en-US'),d=new Date(s.importedAt).toLocaleString('en-GB');
Hub.setTitle(s.season+' season');
let nx='';try{const R=FBGMSchedule.schedule(await HubDB.idx('games','season',s.season),(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v),s.userTid,s.season),nmv=t=>(teams.find(x=>x.tid===t)||{}).abbrev||t,pl=R.filter(r=>r.played),up=R.filter(r=>!r.played).slice(0,3),ln=r=>`<tr><td>${r.day??''}</td><td class="mu">${r.home?'vs':'@'}</td><td>${Logo.t(r.opp,20)} ${nmv(r.opp)}</td><td class="${r.res==='W'?'ok':r.res==='L'?'bad':''}">${r.played?`<a href="game.html?gid=${r.gid}">${r.res} ${r.pf}–${r.pa}</a>`:''}</td></tr>`;
if(R.length)nx=`<div class="card"><h2>Your team · ${pl.length?(pl[pl.length-1].rec||''):'0-0'}</h2><table>${pl.slice(-3).map(ln).join('')}${up.map(ln).join('')}</table><a href="schedule.html" style="text-decoration:underline" class="mu">Full schedule</a></div>`;
 const EM=FBGMModels.run(await HubDB.all('games')),me=s.userTid,mine=EM.games.filter(g=>g.season===s.season&&(g.home===me||g.away===me)).map(g=>{const h=g.home===me;return{d:g.day,r:h?g.rhA:g.raA,opp:h?g.away:g.home,home:h,sc:(h?g.hp:g.ap)+'–'+(h?g.ap:g.hp),w:g.res!==.5&&(g.res===1)===h}}),nxt=up[0],rt=t=>EM.rating[t]??1500;
 let gz='';if(nxt){const ph=FBGMModels.P(rt(nxt.home?me:nxt.opp),rt(nxt.home?nxt.opp:me),EM.opts.H),p=nxt.home?ph:1-ph,th=Math.PI*p,ex=70-60*Math.cos(th),ey=70-60*Math.sin(th);
  gz=`<div class="card"><h2>Next game · win chance</h2><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><svg viewBox="0 0 140 84" style="width:190px" role="img" aria-label="Win chance ${(p*100).toFixed(0)} percent"><path d="M10,70 A60,60 0 0 1 130,70" fill="none" stroke="#1e2b40" stroke-width="12" stroke-linecap="round"/><path d="M10,70 A60,60 0 0 1 ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="var(--c2)" stroke-width="12" stroke-linecap="round"/><text x="70" y="66" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">${(p*100).toFixed(0)}%</text></svg><div>${nxt.home?'vs':'at'} ${Logo.t(nxt.opp,28)} <b>${nmv(nxt.opp)}</b><br><span class="mu">Day ${nxt.day??''} · own Elo model</span></div></div></div>`}
 let tz='';if(mine.length>1){const W=640,H=190,Pd=34,lo=Math.min(1500,...mine.map(x=>x.r))-20,hi=Math.max(1500,...mine.map(x=>x.r))+20,X=i=>Pd+i/(mine.length-1)*(W-2*Pd),Y=v=>H-Pd-(v-lo)/(hi-lo)*(H-2*Pd);
  tz=`<div class="card"><h2>Team strength this season (Elo)</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Elo rating after each game"><line x1="${Pd}" x2="${W-Pd}" y1="${Y(1500)}" y2="${Y(1500)}" stroke="#34465f" stroke-dasharray="5 4"/><text x="4" y="${Y(1500)+4}" fill="#8ea0b8" font-size="10">1500</text><path d="${mine.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x.r).toFixed(1)).join(' ')}" fill="none" stroke="var(--c2)" stroke-width="3"/>${mine.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.r).toFixed(1)}" r="5" fill="${x.w?'#27d17f':'#ff5468'}"><title>Day ${x.d}: ${x.w?'W':'L'} ${x.sc} ${x.home?'vs':'at'} ${nmv(x.opp)} · Elo ${x.r.toFixed(0)}</title></circle>`).join('')}</svg><p class="mu">Green: win · red: loss · hover or tap a dot for the game</p></div>`}
 nx+=gz+tz}catch(e){}
document.getElementById('app').innerHTML=`<div class="hero"><small>${s.leagueName||'League'} · ${s.season}</small><h1>${Logo.html(T,64)}${nm(T)}</h1><p>${ph}</p></div>
<div class="grid"><div class="tile"><b>${n(teams.length)}</b><span>Teams</span></div><div class="tile"><b>${n(np)}</b><span>Players</span></div><div class="tile"><b>${n(ng)}</b><span>Games</span></div><div class="tile"><b>${n(nb)}</b><span>Box-score rows</span></div></div>
${nx}<div class="card"><h2>League history</h2><table><tr><th>Season</th><th>Games stored</th></tr>${Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(k=>`<tr><td>${k}</td><td>${n(s.seasonGames[k])}</td></tr>`).join('')}</table></div>
<p class="mu">Imported ${d}. <a href="import.html" style="text-decoration:underline">Re-import or back up</a></p>`;Hub.countUp(document.getElementById('app'))})()</script></body></html>
