<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Fantasy points</h1><p id="sub">Loading…</p></div><div class="card f"><select id="y"></select><select id="k"><option value="0">Regular season</option><option value="1">Playoffs</option><option value="2">Regular season + playoffs</option></select><select id="v"><option value="s">Season leaders</option><option value="g">Best single games</option><option value="w">Weekly leaders</option></select><select id="d" hidden></select></div><div class="card sc" id="out"></div><p class="mu">Standard scoring: 0.04 per passing yard, 4 per passing TD, −2 per interception, 0.1 per rushing or receiving yard, 6 per rushing or receiving TD, −2 per fumble lost.</p></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="fantasy.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,t.abbrev||t.tid]));$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
let rows,dayOf,skip,names={};
const nm=async id=>{if(!(id in names)){const p=await HubDB.get('players',id)||{};names[id]=((p.firstName||'')+' '+(p.lastName||'')).trim()||'#'+id}return names[id]};
async function load(){$('sub').textContent='Loading…';const y=+$('y').value;const [r,g]=await Promise.all([HubDB.idx('box','season',y),HubDB.idx('games','season',y)]);rows=r;dayOf={};g.forEach(x=>dayOf[x.gid]=x.day);skip=new Set(g.filter(x=>x.allStar).map(x=>x.gid));draw()}
async function draw(){const po=({'0':false,'1':true,'2':'both'})[$('k').value],v=$('v').value;$('d').hidden=v!=='w';Hub.setTitle($('y').value);let h='';
 if(v==='s'){const L=FBGMFantasy.season(rows,po,skip).slice(0,30);const N=await Promise.all(L.map(e=>nm(e.pid)));h='<table><tr><th>#</th><th>Player</th><th>Team</th><th class="n">Pts</th><th class="n">GP</th><th class="n">Per game</th><th class="n">Best</th></tr>'+L.map((e,i)=>`<tr><td>${i+1}</td><td><a href="player.html?pid=${e.pid}">${N[i]}</a></td><td>${teams[e.tid]??''}</td><td class="n"><b>${e.pts.toFixed(1)}</b></td><td class="n">${e.gp}</td><td class="n">${e.ppg.toFixed(1)}</td><td class="n">${e.best.toFixed(1)}</td></tr>`).join('')+'</table>'}
 else{const all=FBGMFantasy.games(rows,dayOf,po,skip);let L=all;if(v==='w'){const ds=[...new Set(all.map(x=>x.day))].sort((a,b)=>b-a),cur=$('d').value;if($('d').dataset.y!==$('y').value+po){$('d').innerHTML=ds.map(x=>`<option>${x}</option>`).join('');$('d').dataset.y=$('y').value+po}L=all.filter(x=>String(x.day)===$('d').value)}
  L=L.slice(0,25);const N=await Promise.all(L.map(e=>nm(e.pid)));h='<table><tr><th>#</th><th>Player</th><th>Team</th><th class="n">Day</th><th class="n">Pts</th></tr>'+L.map((e,i)=>`<tr><td>${i+1}</td><td><a href="player.html?pid=${e.pid}">${N[i]}</a></td><td>${teams[e.tid]??''}</td><td class="n">${e.day??''}</td><td class="n"><b>${e.pts.toFixed(1)}</b></td></tr>`).join('')+'</table>'}
 $('sub').textContent=$('y').value+' · '+rows.length.toLocaleString('en-US')+' box rows';o.innerHTML=h||'<p>No data.</p>'}
$('y').onchange=load;$('k').onchange=$('v').onchange=$('d').onchange=draw;load()})()</script></body></html>
