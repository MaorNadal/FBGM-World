<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Greatest of all time · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.wg{display:grid;gap:8px 14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}.wg label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mu)}.wg input,input[type=search]{min-height:40px;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit;width:100%}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.gx{border-bottom:1px solid #1e2b40}.gx summary{list-style:none;cursor:pointer}.gx summary::-webkit-details-marker{display:none}.gr{display:grid;grid-template-columns:34px 40px 1fr auto;gap:10px;align-items:center;padding:8px 0}.gr .av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bg3)}.gr small{display:block;color:var(--mu)}.gr b.s{font-size:20px;font-variant-numeric:tabular-nums}.sk{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#1e2b40;margin-top:5px}.sk i{display:block;height:100%}.lg2{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:6px}.lg2 span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--c)}.rk{color:var(--mu);text-align:center}.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.tt{width:100%;font-size:13px;margin:0 0 10px}.tt td,.tt th{padding:3px 6px}.tt td.n,.tt th.n{text-align:right;font-variant-numeric:tabular-nums}.tt tr.g th{color:var(--c2);text-align:left;padding-top:8px}.tt .neg{color:var(--bad)}.gx:first-child .gr{padding-top:0}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>Greatest of all time</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="seg" id="tabs"><button data-v="c" class="on">GOAT · the game's formula</button><button data-v="s">Season GOAT</button><button data-v="h">Honours score (ours)</button></div>
<div class="f" style="margin-top:12px"><div id="wst"><label for="st">Statistics counted</label><select id="st"><option value="0">Regular season (the formula as given)</option><option value="1">Regular season + playoffs</option></select></div><div><label for="ac">Players</label><select id="ac"><option value="">All players</option><option value="1">Active only</option><option value="0">Retired only</option></select></div><div><label for="ps">Position</label><select id="ps"></select></div><div><label for="q">Name</label><input type="search" id="q" placeholder="Search a player"></div></div>
<p class="mu" id="gf" style="margin-bottom:0"></p><p style="margin:10px 0 0"><button class="btn ghost" id="shr" style="min-height:38px;padding:0 14px">Share top 10 as image</button> <span class="mu" id="shm"></span></p></div>
<div class="card" id="wc" hidden><h2>The honours score and its weights</h2><p class="mu" style="margin-top:0">Our own score, kept from before: weight × count for each part, added. Change a weight and the list re-ranks at once; your weights are kept on this device.</p><div class="wg" id="wg"></div><p><button class="btn ghost" id="rs">Reset weights</button></p></div>
<div class="card"><div class="lg2" id="lg"></div><div id="out"></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="world.js"></script><script src="viz.js"></script><script src="goat.js"></script><script src="goatf.js"></script><script src="share.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),GH=FBGMGoat,GF=FBGMGoatF,esc=Viz.esc;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Greatest of all time');
try{o.innerHTML='<p class="mu">Reading all players (a few seconds)…</p>';const teams=await HubDB.all('teams');Logo.init(teams);const TM=Object.fromEntries(teams.map(t=>[t.tid,t])),P=await HubDB.scanMap('players',GF.slim),byId=Object.fromEntries(P.map(p=>[p.pid,p]));
 const ga=((await HubDB.get('meta','gameAttributes'))||{}).v||{};
 const COL=['#4fc3f7','#ffd54f','#ff7a59','#ba68c8','#9ccc65','#f06292','#4db6ac','#90a4ae','#ffb81c','#e0e0e0'];
 let cur=null,tab='c',W=Object.assign(GH.W0(),World.get('goatw',{})),LIM=100;
 const POS=[...new Set(P.map(p=>p.pos).filter(Boolean))].sort();$('ps').innerHTML='<option value="">All positions</option>'+POS.map(x=>`<option>${x}</option>`).join('');
 $('wg').innerHTML=GH.PARTS.map(x=>`<label>${esc(x.label)}<input type="number" step="0.5" min="0" data-k="${x.k}" value="${W[x.k]}"></label>`).join('');
 const nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim()||('Player '+p.pid),lastTid=(p,y)=>{let b=null,m=-1;for(const x of p.stats)if(x.tid>=0&&!x.playoffs&&(y==null||x.season===y)&&(x.gp||0)>=m){m=x.gp||0;b=x.tid}return b};
 const seasonsOf=p=>{const ys=p.stats.map(x=>x.season);return ys.length?[Math.min(...ys),Math.max(...ys)]:['','']};
 const f3=v=>v.toFixed(v>=100?1:v>=10?2:3);
 const tbl=r=>{let h='<table class="tt"><tr><th>Term</th><th class="n">Count</th><th class="n">× weight</th><th class="n">Adds</th></tr>';for(const g of GF.GROUPS){const T=GF.TERMS.filter(t=>t[2]===g&&((r.v[t[0]]||0)!==0));if(!T.length)continue;h+=`<tr class="g"><th colspan="4">${g} · ${f3(r.groups[g]||0)}</th></tr>`+T.map(t=>`<tr><td>${esc(t[1])}</td><td class="n">${Math.round(r.v[t[0]]*100)/100}</td><td class="n">${t[3]}</td><td class="n${r.parts[t[0]]<0?' neg':''}">${f3(r.parts[t[0]])}</td></tr>`).join('')}return h+'</table><p class="mu" style="margin:0">Total = 0.00007 × the sum of every term.</p>'};
 function filt(){const ac=$('ac').value,ps=$('ps').value,q=$('q').value.trim().toLowerCase();return p=>(ac===''||(ac==='1')===(p.tid>=0))&&(ps===''||p.pos===ps)&&(!q||nm(p).toLowerCase().includes(q))}
 function show(rows,mk,legend){const dr=rows.slice(0,LIM);o.innerHTML=(rows.length?dr.map(mk).join('')+(rows.length>LIM?'<p><button class="btn ghost" id="more">Show 100 more</button></p>':''):'<p class="mu">Nobody scores with this filter.</p>');
  const mb=$('more');if(mb)mb.onclick=()=>{LIM+=100;draw()};
  Faces.lazy(o,pid=>(byId[pid]||{}).face,pid=>{const p=byId[pid];return p.tid>=0?TM[p.tid]:TM[lastTid(p)]})}
 function draw(){const F=filt(),po=$('st').value==='1';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));$('wc').hidden=tab!=='h';$('wst').hidden=tab==='h';
  if(tab==='h'){const rk=GH.rank(P.filter(F),W);$('sub').textContent=P.length.toLocaleString('en-US')+' players scored · top '+Math.min(LIM,rk.length)+' of '+rk.length;
   $('gf').textContent='Our own score, built from approximate value and honours. It is not the game\'s formula; see the first two tabs for that.';$('lg').innerHTML=GH.PARTS.map((x,i)=>`<span style="--c:${COL[i]}">${esc(x.label)}</span>`).join('');const mx=rk.length?rk[0].total:1;cur={title:'Greatest of all time · honours score',list:rk.slice(0,10).map(r=>({name:nm(byId[r.pid]),sub:byId[r.pid].pos+' · '+seasonsOf(byId[r.pid]).join('–'),val:Math.round(r.total).toLocaleString('en-US')}))};
   show(rk,(r,i)=>{const p=byId[r.pid],[y0,y1]=seasonsOf(p),tid=lastTid(p),c=r.c,bits=[c.mvp&&c.mvp+' MVP',c.fmvp&&c.fmvp+' Finals MVP',c.poy&&c.poy+' POY',c.title&&c.title+' title'+(c.title>1?'s':''),(c.all1+c.allO)&&(c.all1+c.allO)+' All-League',c.allS&&c.allS+' All-Star',Math.round(c.av)+' AV',c.hof&&'Hall of Fame'].filter(Boolean).join(' · ');
    return `<div class="gx"><div class="gr"><span class="rk">${i+1}</span><span class="av" data-pid="${p.pid}"></span><span style="min-width:0"><a href="player.html?pid=${p.pid}">${esc(nm(p))}</a> <span class="mu">${esc(p.pos)} · ${y0}${y1!==y0?'–'+y1:''}</span>${TM[tid]?' '+Logo.t(tid,16):''}<small>${esc(bits)}</small><div class="sk" style="width:${Math.max(8,r.total/mx*100)}%">${GH.PARTS.map((x,k)=>r.parts[x.k]>0?`<i style="width:${r.parts[x.k]/r.total*100}%;background:${COL[k]}" title="${esc(x.label)}: ${Math.round(r.parts[x.k])}"></i>`:'').join('')}</div></span><b class="s">${Math.round(r.total).toLocaleString('en-US')}</b></div></div>`});return}
  const each=tab==='s',rk=GF.rank(P.filter(F),{season:each?'each':null,po}),mx=rk.length?rk[0].total:1;
  $('lg').innerHTML=GF.GROUPS.map((g,i)=>`<span style="--c:${COL[i]}">${g}</span>`).join('');
  $('gf').textContent=(each?'Season GOAT: the formula applied to one season of one player (that season\'s stat rows, that season\'s awards, one season played). ':'GOAT: the formula applied to a whole career. ')+(po?'Regular season and playoff rows are added together; the longest field goal is the longest of both.':'Regular season rows only, exactly as the formula is written.')+' Score = 0.00007 × (…). Open a row to see every term.'+(typeof ga.goatFormula==='string'&&ga.goatFormula?' The save also holds its own formula text; it is not evaluated here.':'');
  $('sub').textContent=(each?'Season GOAT':'GOAT')+(po?' with playoffs':'')+' · '+rk.length.toLocaleString('en-US')+' '+(each?'player-seasons':'players')+' scored · top '+Math.min(LIM,rk.length);
  cur={title:(each?'Season GOAT':'GOAT')+(po?' with playoffs':'')+' · the game formula',list:rk.slice(0,10).map(r=>({name:nm(byId[r.pid]),sub:byId[r.pid].pos+' · '+(each?r.season:seasonsOf(byId[r.pid]).join('–')),val:f3(r.total)}))};
  show(rk,(r,i)=>{const p=byId[r.pid],[y0,y1]=seasonsOf(p),tid=each?lastTid(p,r.season):lastTid(p),v=r.v,hon=[v.mvp&&v.mvp+' MVP',v.finalsMvp&&v.finalsMvp+' Finals MVP',v.dpoy&&v.dpoy+' DPOY',v.champ&&v.champ+' title'+(v.champ>1?'s':''),(v.allLeague1+v.allLeague2)&&(v.allLeague1+v.allLeague2)+' All-League',v.allStarMvp&&v.allStarMvp+' All-Star MVP',Math.round(v.av)+' AV',(!each&&p.hof)&&'Hall of Fame'].filter(Boolean).join(' · '),pos=GF.GROUPS.map(g=>Math.max(0,r.groups[g]||0)),tp=pos.reduce((a,b)=>a+b,0)||1;
   return `<details class="gx"><summary class="gr"><span class="rk">${i+1}</span><span class="av" data-pid="${p.pid}"></span><span style="min-width:0"><a href="player.html?pid=${p.pid}">${esc(nm(p))}</a> <span class="mu">${esc(p.pos)} · ${each?r.season:y0+(y1!==y0?'–'+y1:'')}</span>${TM[tid]?' '+Logo.t(tid,16,each?r.season:undefined):''}<small>${esc(hon)}</small><div class="sk" style="width:${Math.max(8,r.total/mx*100)}%">${pos.map((x,k)=>x>0?`<i style="width:${x/tp*100}%;background:${COL[k]}" title="${GF.GROUPS[k]}: ${f3(x)}"></i>`:'').join('')}</div></span><b class="s">${f3(r.total)}</b></summary>${tbl(r)}</details>`})}
 $('shr').onclick=async()=>{if(!cur||!cur.list.length)return;const b=$('shr');b.disabled=true;$('shm').textContent='Drawing…';try{const X=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),mx=parseFloat(String(cur.list[0].val).replace(/,/g,''))||1,rows=cur.list.map((x,i)=>`<text x="40" y="${150+i*62}" fill="#ffb81c" font-size="26" font-weight="800">${i+1}</text><text x="90" y="${146+i*62}" fill="#fff" font-size="26" font-weight="700">${X(x.name)}</text><text x="90" y="${166+i*62}" fill="#9db6cc" font-size="15">${X(x.sub)}</text><rect x="420" y="${134+i*62}" width="${Math.max(10,(parseFloat(String(x.val).replace(/,/g,''))||0)/mx*300)}" height="16" rx="8" fill="#f2b632"/><text x="740" y="${150+i*62}" fill="#fff" font-size="26" font-weight="800" text-anchor="end">${X(x.val)}</text>`).join(''),svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 ${190+cur.list.length*62}" font-family="Segoe UI,Arial,sans-serif"><rect width="780" height="${190+cur.list.length*62}" fill="#0e1f2e"/><rect width="780" height="8" fill="#f2b632"/><text x="40" y="58" fill="#fff" font-size="32" font-weight="800">${X(cur.title)}</text><text x="40" y="88" fill="#9db6cc" font-size="16">FBGM Hub · ${s.season}</text>${rows}</svg>`,r=await Share.image(svg,'fbgm-goat-top10','GOAT top 10');$('shm').textContent=r==='shared'?'Shared.':r==='saved'?'Saved as a PNG file.':'Saved as an SVG file.'}catch(e){$('shm').textContent='Could not make the image: '+e.message}b.disabled=false};
 $('tabs').onclick=e=>{const k=e.target.dataset.v;if(!k)return;tab=k;LIM=100;draw()};
 $('wg').oninput=e=>{const k=e.target.dataset.k;if(!k)return;W[k]=Math.max(0,+e.target.value||0);World.set('goatw',W);draw()};
 $('rs').onclick=()=>{W=GH.W0();World.set('goatw',W);$('wg').querySelectorAll('input').forEach(i=>i.value=W[i.dataset.k]);draw()};
 $('ac').onchange=$('ps').onchange=$('st').onchange=()=>{LIM=100;draw()};let tq;$('q').oninput=()=>{clearTimeout(tq);tq=setTimeout(()=>{LIM=100;draw()},250)};
 draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
