<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game log · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}.tg{display:inline-block;border-radius:99px;padding:0 9px;font-size:11px;font-weight:800;background:var(--bg3);color:var(--mu)}.tg.po{background:#ffb81c33;color:var(--c2)}.tg.as{background:#8f6bff33;color:#b9a2ff}.w{font-weight:800}.hv{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px;align-items:end;height:130px;margin-top:6px}.hv div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:11px;color:var(--mu)}.hv i{display:block;background:linear-gradient(0deg,var(--c1),var(--c2));border-radius:6px 6px 0 0;min-height:2px}.hv b{color:var(--tx);font-size:12px}.hv .ln{border-top:1px dashed #ffffff55;position:absolute}.hvw{position:relative}.pg{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Game log</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="y">Season</label><select id="y"></select></div><div><label for="t">Team</label><select id="t"></select></div><div><label for="k">Games</label><select id="k"><option value="r">Regular season</option><option value="p">Playoffs</option><option value="a">All-star</option><option value="">All</option></select></div><div><label for="o">Order</label><select id="o"><option value="d">Latest first</option><option value="e">Earliest first</option><option value="m">Biggest margin</option><option value="s">Most total points</option><option value="c">Closest</option></select></div></div></div>
<div class="grid" id="ti"></div>
<div class="card"><h2>Home teams winning, by season</h2><p class="mu" style="margin:0">Share of regular-season games won by the home team (first team in the stored header). The league setting for home advantage is read from the save and shown in the Settings page; this is the result it produced.</p><div class="hvw"><div class="hv" id="hv"></div></div></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),esc=Viz.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Game log');
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 $('out').innerHTML='<p class="mu">Reading games…</p>';const G=(await LeagueData.games()).filter(g=>g.teams&&g.teams.length===2&&g.teams[0].pts!=null&&g.teams[1].pts!=null);
 const ys=[...new Set(G.map(g=>g.season))].sort((a,b)=>b-a);$('y').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');
 $('t').innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option value="${t.tid}">${esc((t.region+' '+t.name).trim())}</option>`).join('');
 const q=new URLSearchParams(location.search);if(q.get('season'))$('y').value=q.get('season');if(q.get('tid'))$('t').value=q.get('tid');
 const ty=g=>g.allStar?'a':g.playoffs?'p':'r',nm=t=>t?(t.abbrev||t.name):'?';let page=0;const PS=100;
 /* home advantage per season, regular season only, drawn once */
 const hw={};G.filter(g=>ty(g)==='r').forEach(g=>{const e=hw[g.season]=hw[g.season]||[0,0];e[1]++;if(g.teams[0].pts>g.teams[1].pts)e[0]++;else if(g.teams[0].pts===g.teams[1].pts)e[0]+=.5});
 $('hv').innerHTML=Object.keys(hw).sort((a,b)=>a-b).map(y=>{const p=hw[y][0]/hw[y][1]*100;return`<div title="${y}: ${p.toFixed(1)}% of ${hw[y][1]} games"><b>${p.toFixed(0)}%</b><i style="height:${Math.max(2,p*1.0)}%"></i>${String(y).slice(2)}</div>`}).join('');
 function draw(){const y=+$('y').value,t=$('t').value,k=$('k').value,o=$('o').value;
  let L=G.filter(g=>g.season===y&&(!k||ty(g)===k)&&(!t||g.teams.some(x=>x.tid===+t)));
  const mg=g=>Math.abs(g.teams[0].pts-g.teams[1].pts),tot=g=>g.teams[0].pts+g.teams[1].pts;
  L.sort(o==='e'?(a,b)=>(a.day||0)-(b.day||0)||a.gid-b.gid:o==='m'?(a,b)=>mg(b)-mg(a):o==='s'?(a,b)=>tot(b)-tot(a):o==='c'?(a,b)=>mg(a)-mg(b)||b.gid-a.gid:(a,b)=>(b.day||0)-(a.day||0)||b.gid-a.gid);
  const n=L.length,hm=L.filter(g=>g.teams[0].pts>g.teams[1].pts).length,one=L.filter(g=>mg(g)<=8).length;
  $('sub').textContent=y+' · '+n.toLocaleString('en-US')+' games'+(t?' · '+esc(nm(T[t])):'');
  $('ti').innerHTML=[['Games',n],['Points per game',n?(L.reduce((a,g)=>a+tot(g),0)/n).toFixed(1):'–'],['Home wins',n?(hm/n*100).toFixed(1)+'%':'–'],['Average margin',n?(L.reduce((a,g)=>a+mg(g),0)/n).toFixed(1):'–'],['Decided by 8 or less',n?(one/n*100).toFixed(0)+'%':'–']].map(x=>`<div class="tile"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
  const maxp=Math.max(0,Math.ceil(n/PS)-1);if(page>maxp)page=maxp;const R=L.slice(page*PS,page*PS+PS);
  $('out').innerHTML='<table><tr><th>Day</th><th>Away</th><th class="n">Score</th><th>Home</th><th class="n">Margin</th><th class="n">Total</th><th></th><th></th></tr>'+R.map(g=>{const [h,a]=g.teams,hw=h.pts>a.pts,aw=a.pts>h.pts;return`<tr><td>${g.day!=null?g.day:''}</td><td class="${aw?'w':''}">${Logo.t(a.tid,18,g.season)} <a href="team.html#${a.tid}">${esc(nm(T[a.tid]))}</a></td><td class="n"><b>${a.pts}–${h.pts}</b></td><td class="${hw?'w':''}">${Logo.t(h.tid,18,g.season)} <a href="team.html#${h.tid}">${esc(nm(T[h.tid]))}</a></td><td class="n">${mg(g)}</td><td class="n">${tot(g)}</td><td>${ty(g)==='p'?'<span class="tg po">playoffs</span>':ty(g)==='a'?'<span class="tg as">all-star</span>':''}${g.overtimes?' <span class="tg">OT</span>':''}</td><td><a class="btn ghost" style="min-height:32px;padding:0 12px" href="game.html?gid=${g.gid}">Box score</a></td></tr>`}).join('')+'</table>'+
   (maxp?`<div class="pg"><button class="btn ghost" id="pv" ${page?'':'disabled'}>‹</button><span class="mu">Page ${page+1} of ${maxp+1}</span><button class="btn ghost" id="nx" ${page<maxp?'':'disabled'}>›</button></div>`:'')+'<p><button class="btn ghost" id="cv">Export CSV (all '+n+' rows)</button></p>';
  if($('pv'))$('pv').onclick=()=>{page--;draw()};if($('nx'))$('nx').onclick=()=>{page++;draw()};
  $('cv').onclick=()=>Viz.csv('game-log-'+y+'.csv',['Season','Day','Away','Away pts','Home','Home pts','Type'],L.map(g=>[g.season,g.day,nm(T[g.teams[1].tid]),g.teams[1].pts,nm(T[g.teams[0].tid]),g.teams[0].pts,ty(g)]))}
 $('y').onchange=$('t').onchange=$('k').onchange=$('o').onchange=()=>{page=0;draw()};draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
