<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Milestone watch · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.pg{display:inline-block;width:90px;height:8px;background:var(--bg3);border-radius:9px;overflow:hidden;vertical-align:middle}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}.bd{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;font-weight:800;background:#27d17f33;color:var(--ok)}.top{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.top a{display:block;background:var(--bg3);border-radius:14px;padding:12px;border-top:3px solid var(--c2)}.top span{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.top b{display:block;font-size:20px;line-height:1.15}.top .av{margin:0 8px 0 0}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>Milestone watch</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="k">Statistic</label><select id="k"></select></div><div><label for="g">Reached within</label><select id="g"><option value="10">10 games</option><option value="20">20 games</option><option value="40" selected>40 games</option><option value="80">80 games</option><option value="999">any time</option></select></div><div><label for="t">Team</label><select id="t"></select></div></div><p class="mu" style="margin-bottom:0">Career totals of active players against round numbers, at the pace of the last two seasons. The number of games is an estimate: it assumes he plays every game at that pace.</p></div>
<div class="card"><h2>Closest to a milestone</h2><div class="top" id="top"></div></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="careers.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,C=FBGMCareers,esc=V.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Milestones');
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 const ga=await LeagueData.attrs(),ng=+FBGMTransform_attr(ga.numGames,s.season)||0,rem={};
 const sched=(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v);sched.forEach(m=>{rem[m.homeTid]=(rem[m.homeTid]||0)+1;rem[m.awayTid]=(rem[m.awayTid]||0)+1});
 $('out').innerHTML='<p class="mu">Reading all players…</p>';const P=await LeagueData.players(),byId=Object.fromEntries(P.map(p=>[p.pid,p])),ALL=C.milestones(P,s.season,rem);
 $('k').innerHTML='<option value="">All statistics</option>'+Object.keys(C.LABEL).map(k=>`<option value="${k}">${C.LABEL[k]}</option>`).join('');$('t').innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');
 const fm=n=>Math.round(n).toLocaleString('en-US');
 function draw(){const k=$('k').value,g=+$('g').value,t=$('t').value,L=ALL.filter(m=>(!k||m.key===k)&&m.games<=g&&(!t||m.tid===+t));
  $('sub').textContent=s.season+' · '+L.length+' milestones within reach · '+L.filter(m=>m.thisSeason).length+' expected this season';
  $('top').innerHTML=L.slice(0,6).map(m=>`<a href="player.html?pid=${m.pid}"><span>${m.label} · ${fm(m.next)}</span><b><span class="av" data-pid="${m.pid}"></span>${esc(m.name)}</b>${Logo.t(m.tid,18)} ${(T[m.tid]||{}).abbrev||''} · needs ${fm(m.need)} · about ${m.games<1?'less than a game':m.games.toFixed(1)+' games'}${m.thisSeason?' <span class="bd">this season</span>':''}</a>`).join('')||'<p class="mu">Nothing within reach for this choice.</p>';
  $('out').innerHTML='<table><tr><th>Player</th><th>Team</th><th>Statistic</th><th class="n">Career</th><th class="n">Next</th><th>Progress</th><th class="n">Needs</th><th class="n">Pace / game</th><th class="n">Games</th><th></th></tr>'+L.slice(0,250).map(m=>`<tr><td><a href="player.html?pid=${m.pid}">${esc(m.name)}</a></td><td>${Logo.t(m.tid,18)} ${(T[m.tid]||{}).abbrev||''}</td><td>${m.label}</td><td class="n">${fm(m.total)}</td><td class="n"><b>${fm(m.next)}</b></td><td><span class="pg"><i style="width:${(m.pct*100).toFixed(0)}%"></i></span></td><td class="n">${fm(m.need)}</td><td class="n">${m.rate.toFixed(1)}</td><td class="n">${m.games.toFixed(1)}</td><td>${m.thisSeason?'<span class="bd">this season</span>':''}</td></tr>`).join('')+'</table><p><button class="btn ghost" id="cv">Export CSV</button></p>';
  $('cv').onclick=()=>V.csv('milestones.csv',['Player','Team','Statistic','Career','Next','Needs','Pace per game','Games'],L.map(m=>[m.name,(T[m.tid]||{}).abbrev,m.label,m.total,m.next,m.need,m.rate.toFixed(2),m.games.toFixed(1)]));
  Faces.lazy($('top'),pid=>(byId[pid]||{}).face,pid=>T[(byId[pid]||{}).tid])}
 $('k').onchange=$('g').onchange=$('t').onchange=draw;draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}
function FBGMTransform_attr(v,y){if(!Array.isArray(v)||!v.length||typeof v[0]!=='object'||v[0]===null||!('value' in v[0]))return v;let o=v[0].value;for(const e of v)if(e.start==null||e.start<=y)o=e.value;return o}})()</script></body></html>
