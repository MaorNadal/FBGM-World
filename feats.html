<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Statistical feats · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}.ln{display:flex;flex-wrap:wrap;gap:4px}.ln span{background:var(--bg3);border-radius:8px;padding:1px 8px;font-size:12px}.ln b{color:var(--c2)}.tg{display:inline-block;border-radius:99px;padding:0 9px;font-size:11px;font-weight:800;background:#ffb81c33;color:var(--c2)}.fc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.fc a{display:block;background:var(--bg3);border-radius:14px;padding:12px;border-top:3px solid var(--c2)}.fc span{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.fc b{display:block;font-size:18px;line-height:1.2}.fc .av{margin:0 8px 0 0}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Statistical feats</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="y">Season</label><select id="y"></select></div><div><label for="t">Team</label><select id="t"></select></div><div><label for="k">Kind</label><select id="k"><option value="">All kinds</option><option value="pass">Passing</option><option value="rush">Rushing</option><option value="rec">Receiving</option><option value="def">Defence</option></select></div><div><label for="p">Games</label><select id="p"><option value="">Regular season and playoffs</option><option value="r">Regular season</option><option value="p">Playoffs</option></select></div></div><p class="mu" style="margin-bottom:0">Notable single-game performances stored in the save (the game's own list). The score is the game's rating of the feat, shown as stored.</p></div>
<div class="card"><h2>Best feats</h2><div class="fc" id="top"></div></div>
<div class="card"><h2>Feats by team</h2><div id="bt"></div></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,esc=V.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Feats');
const LAB={pssCmp:'cmp',pss:'att',pssYds:'pass yds',pssTD:'pass TD',pssInt:'int',pssSk:'sacked',rus:'car',rusYds:'rush yds',rusTD:'rush TD',rec:'rec',recYds:'rec yds',recTD:'rec TD',tgt:'tgt',defTckSolo:'solo tkl',defTckAst:'ast tkl',defTck:'tkl',defSk:'sacks',defInt:'int',defFmbFrc:'forced fum',defFmbRec:'fum rec',fmbLost:'fum lost',defTckLoss:'TFL',defPssDef:'pass def',defSft:'safeties',defTD:'def TD',krYds:'kr yds',prYds:'pr yds',fgm:'fg',fga:'fg att',xpm:'xp',pnt:'punts',pntYds:'punt yds'};
const kind=st=>{const k=Object.keys(st||{}).filter(x=>st[x]);return k.some(x=>/^pss/.test(x)&&x!=='pssSk')?'pass':k.some(x=>/^rus/.test(x))?'rush':k.some(x=>/^rec|^tgt/.test(x))?'rec':k.some(x=>/^def/.test(x))?'def':''};
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 const F=(await HubDB.all('misc')).filter(r=>r.src==='playerFeats'&&r.v).map(r=>r.v);
 if(!F.length){$('sub').textContent='No feats in this save';$('out').innerHTML='<p class="mu">The save holds no statistical-feats records (the playerFeats collection is empty or missing).</p>';return}
 const pids=new Set(F.map(f=>f.pid).filter(x=>x!=null)),P={};(await HubDB.scan('players',p=>pids.has(p.pid))).forEach(p=>P[p.pid]=FBGMMetrics.slim(p));
 const nm=f=>f.name||(P[f.pid]?((P[f.pid].firstName||'')+' '+(P[f.pid].lastName||'')).trim():'Player '+f.pid);
 const ys=[...new Set(F.map(f=>f.season))].filter(x=>x!=null).sort((a,b)=>b-a);$('y').innerHTML='<option value="">All seasons</option>'+ys.map(y=>`<option>${y}</option>`).join('');
 $('t').innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option value="${t.tid}">${esc((t.region+' '+t.name).trim())}</option>`).join('');
 const line=st=>'<div class="ln">'+Object.keys(st||{}).filter(k=>st[k]).map(k=>`<span><b>${(+st[k]%1?(+st[k]).toFixed(1):st[k])}</b> ${esc(LAB[k]||k)}</span>`).join('')+'</div>';
 let L=[];
 function draw(){const y=$('y').value,t=$('t').value,k=$('k').value,p=$('p').value;
  L=F.filter(f=>(!y||f.season===+y)&&(!t||f.tid===+t)&&(!k||kind(f.stats)===k)&&(!p||(p==='p')===!!f.playoffs)).sort((a,b)=>(b.score||0)-(a.score||0)||(b.season||0)-(a.season||0));
  $('sub').textContent=F.length.toLocaleString('en-US')+' feats in the save · '+L.length.toLocaleString('en-US')+' shown';
  $('top').innerHTML=L.slice(0,6).map(f=>`<a href="${f.gid!=null?'game.html?gid='+f.gid:'player.html?pid='+f.pid}"><span>${f.season||''}${f.playoffs?' · playoffs':''} · score ${f.score!=null?(+f.score).toFixed(1):'–'}</span><b><span class="av" data-pid="${f.pid}"></span>${esc(nm(f))}</b>${Logo.t(f.tid,18,f.season)} ${esc((T[f.tid]||{}).abbrev||'')}${f.oppTid!=null?' vs '+esc((T[f.oppTid]||{}).abbrev||''):''}${line(f.stats)}</a>`).join('')||'<p class="mu">Nothing for this choice.</p>';
  const by={};L.forEach(f=>by[f.tid]=(by[f.tid]||0)+1);
  V.bars($('bt'),Object.keys(by).filter(x=>T[x]).map(x=>({id:+x,label:(T[x].region+' '+T[x].name).trim(),value:by[x],c1:(T[x].colors||[])[0],logo:Logo.t(+x,22),href:'team.html#'+x})),{top:12,fmt:v=>String(v)});
  $('out').innerHTML='<table><tr><th>Player</th><th>Team</th><th>Opponent</th><th class="n">Season</th><th>Stat line</th><th class="n">Score</th><th></th></tr>'+L.slice(0,300).map(f=>`<tr><td><a href="player.html?pid=${f.pid}">${esc(nm(f))}</a></td><td>${Logo.t(f.tid,18,f.season)} ${esc((T[f.tid]||{}).abbrev||'')}</td><td>${f.oppTid!=null?Logo.t(f.oppTid,18,f.season)+' '+esc((T[f.oppTid]||{}).abbrev||''):''}</td><td class="n">${f.season||''}</td><td>${line(f.stats)}</td><td class="n">${f.score!=null?(+f.score).toFixed(1):''}</td><td>${f.playoffs?'<span class="tg">playoffs</span> ':''}${f.gid!=null?`<a class="btn ghost" style="min-height:32px;padding:0 12px" href="game.html?gid=${f.gid}">Box score</a>`:''}</td></tr>`).join('')+'</table>'+(L.length>300?'<p class="mu">First 300 of '+L.length+'; the CSV has all of them.</p>':'')+'<p><button class="btn ghost" id="cv">Export CSV</button></p>';
  $('cv').onclick=()=>V.csv('feats.csv',['Player','Team','Opponent','Season','Playoffs','Score','Stat line'],L.map(f=>[nm(f),(T[f.tid]||{}).abbrev,(T[f.oppTid]||{}).abbrev,f.season,f.playoffs?1:0,f.score,Object.keys(f.stats||{}).filter(k=>f.stats[k]).map(k=>(LAB[k]||k)+' '+f.stats[k]).join('; ')]));
  Faces.lazy($('top'),pid=>(P[pid]||{}).face,pid=>T[(P[pid]||{}).tid])}
 $('y').onchange=$('t').onchange=$('k').onchange=$('p').onchange=draw;draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
