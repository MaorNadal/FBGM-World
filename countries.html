<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Countries and colleges · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tabs button{min-height:40px;padding:0 16px;border:1px solid #2a3a52;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.tabs button.on{background:var(--c2);color:#000;border-color:var(--c2)}tr.pick{cursor:pointer}tr.pick:hover td{background:#ffffff10}tr.sel td{background:color-mix(in srgb,var(--c1) 35%,transparent)}.pb{display:inline-block;width:110px;height:8px;border-radius:9px;background:var(--bg3);overflow:hidden;vertical-align:middle}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Countries and colleges</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="g">Players</label><select id="g"><option value="a">Active (on a team)</option><option value="*">Everyone in the save</option><option value="p">Draft prospects</option></select></div><div><label for="m">Order by</label><select id="m"><option value="n">Number of players</option><option value="o">Average overall</option><option value="b">Best overall</option></select></div></div></div>
<div class="card"><div class="tabs" id="tb"><button data-k="c" class="on">Countries</button><button data-k="s">US states</button><button data-k="u">Colleges</button></div><div class="sc" id="out"></div></div>
<div class="card"><h2 id="lh">Players</h2><div class="sc" id="pl"></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,esc=V.esc,PI=FBGMPlayerInfo;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Countries');
try{const teams=await LeagueData.teams();Logo.init(teams);const TM=Object.fromEntries(teams.map(t=>[t.tid,t]));
 $('out').innerHTML='<p class="mu">Reading all players…</p>';const P=await LeagueData.players();
 const all=P.map(p=>{const x=PI.row(p,s.season);return{pid:p.pid,tid:p.tid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos:x.pos,ovr:x.ovr,country:x.country,iso:x.iso,state:x.state,college:x.college,loc:x.loc,hof:!!p.hof}});
 let tab='c',sel=null;const K=r=>tab==='c'?(r.country?(r.iso?r.country:'? '+r.country):''):tab==='s'?r.state:r.college;
 function agg(L){const m={};for(const r of L){const k=K(r);if(!k)continue;const e=m[k]=m[k]||{k,n:0,sum:0,no:0,best:null,hof:0,iso:r.iso,team:{}};e.n++;if(r.ovr!=null){e.sum+=r.ovr;e.no++;if(!e.best||r.ovr>e.best.ovr)e.best=r}if(r.hof)e.hof++}return Object.values(m)}
 function pool(){const g=$('g').value;return all.filter(r=>g==='*'||(g==='a'?r.tid>=0:r.tid===-2))}
 function draw(){const L=pool(),A=agg(L),m=$('m').value,key={n:e=>e.n,o:e=>e.no?e.sum/e.no:-1,b:e=>e.best?e.best.ovr:-1}[m];A.sort((a,b)=>key(b)-key(a)||b.n-a.n);const mx=Math.max(1,...A.map(e=>e.n)),known=L.filter(r=>K(r)).length;
  $('sub').textContent=L.length.toLocaleString('en-US')+' players · '+known.toLocaleString('en-US')+' with a '+(tab==='c'?'country':tab==='s'?'US state':'college')+' · '+A.length.toLocaleString('en-US')+' different';
  $('out').innerHTML=A.length?'<table><tr><th>'+(tab==='c'?'Country':tab==='s'?'State':'College')+'</th><th class="n">Players</th><th></th><th class="n">Average overall</th><th>Best player</th><th class="n">Hall of Fame</th></tr>'+A.slice(0,60).map(e=>`<tr class="pick ${sel===e.k?'sel':''}" data-k="${esc(e.k)}"><td>${tab==='c'?PI.flag({iso:e.iso,name:e.k},14)+' ':tab==='s'?PI.flag({iso:'us',name:'USA'},14)+' ':''}${esc(e.k)}</td><td class="n">${e.n.toLocaleString('en-US')}</td><td><span class="pb"><i style="width:${(e.n/mx*100).toFixed(0)}%"></i></span></td><td class="n">${e.no?(e.sum/e.no).toFixed(1):''}</td><td>${e.best?`<a href="player.html?pid=${e.best.pid}">${esc(e.best.name)}</a> <span class="mu">${e.best.pos} ${e.best.ovr}</span>`:''}</td><td class="n">${e.hof||''}</td></tr>`).join('')+'</table>'+(A.length>60?'<p class="mu">First 60 of '+A.length+'.</p>':'')+'<p class="mu">Click a row to list its players below.</p>':'<p class="mu">'+(tab==='c'?'No birthplace with a recognised country':tab==='s'?'No US birthplace with a state':'No college')+' is stored for these players. Open Tools / Player data check to see which fields exist.</p>';
  $('out').querySelectorAll('tr.pick').forEach(t=>t.onclick=()=>{sel=t.dataset.k;draw()});
  const S=sel?L.filter(r=>K(r)===sel).sort((a,b)=>(b.ovr||0)-(a.ovr||0)):[];$('lh').textContent=sel?'Players · '+sel+' · '+S.length:'Players';
  $('pl').innerHTML=sel?'<table><tr><th>Player</th><th>Pos</th><th>Team</th><th>Birthplace</th><th>College</th><th class="n">Overall</th></tr>'+S.slice(0,80).map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${esc(r.name)}</a>${r.hof?' ★':''}</td><td>${r.pos}</td><td>${r.tid>=0&&TM[r.tid]?Logo.t(r.tid,18)+' '+TM[r.tid].abbrev:({'-1':'FA','-2':'Prospect','-3':'Retired'}[r.tid]||'')}</td><td>${esc(r.loc)}</td><td>${esc(r.college)}</td><td class="n"><b>${r.ovr??''}</b></td></tr>`).join('')+'</table>':'<p class="mu">Choose a row above.</p>'}
 $('tb').onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;sel=null;$('tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw()};$('g').onchange=$('m').onchange=()=>{sel=null;draw()};draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
