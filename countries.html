<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Countries and colleges · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tabs button{min-height:40px;padding:0 16px;border:1px solid #2a3a52;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.tabs button.on{background:var(--c2);color:#000;border-color:var(--c2)}tr.pick{cursor:pointer}tr.pick:hover td{background:#ffffff10}tr.sel td{background:color-mix(in srgb,var(--c1) 35%,transparent)}.pb{display:inline-block;width:110px;height:8px;border-radius:9px;background:var(--bg3);overflow:hidden;vertical-align:middle}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Countries and colleges</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="g">Players</label><select id="g"><option value="a">Active (on a team)</option><option value="*">Everyone in the save</option><option value="p">Draft prospects</option></select></div><div><label for="m">Order by</label><select id="m"><option value="n">Number of players</option><option value="o">Average overall</option><option value="b">Best overall</option><option value="g">Games played</option><option value="gp">Games per player</option><option value="v">Total AV</option><option value="vp">AV per player</option><option value="t">Championships</option><option value="f">Finals reached</option></select></div></div></div>
<div class="card"><div class="tabs" id="tb"><button data-k="c" class="on">Countries</button><button data-k="s">US states</button><button data-k="u">Colleges</button></div><div class="sc" id="out"></div></div>
<div class="card"><h2 id="lh">Players</h2><div class="sc" id="pl"></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script><script src="finals.js"></script><script src="pinfo.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,esc=V.esc,PI=FBGMPlayerInfo;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Countries');
try{const teams=await LeagueData.teams();Logo.init(teams);const TM=Object.fromEntries(teams.map(t=>[t.tid,t]));
 $('out').innerHTML='<p class="mu">Reading all players…</p>';const P=await LeagueData.players();
 /* finalists per season, from the stored championship games */
 const FIN={};try{const FG=FBGMFinals.finalGames(await LeagueData.games(),null);for(const g in FG){const f=FG[g];(FIN[f.season]=FIN[f.season]||new Set()).add(f.w);FIN[f.season].add(f.l)}}catch(e){}
 const all=P.map(p=>{const x=PI.row(p,s.season);let g=0,av=0,fin=new Set();for(const t of (p.stats||[])){if(t.playoffs)continue;g+=t.gp||0;av+=t.av||0;if((t.gp||0)>0&&FIN[t.season]&&FIN[t.season].has(t.tid))fin.add(t.season)}
  const ti=(p.awards||[]).filter(a=>/Won Championship/i.test(a.type)).length;
  return{pid:p.pid,tid:p.tid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos:x.pos,ovr:x.ovr,country:x.country,iso:x.iso,state:x.state,college:x.college,loc:x.loc,hof:!!p.hof,g,av,ti,fin:fin.size}});
 let tab='c',sel=null;const SN=c=>PI.stateName?PI.stateName(c):c;
 const K=r=>tab==='c'?(r.country?(r.iso?r.country:'? '+r.country):''):tab==='s'?(r.iso==='us'?(r.state||'Unknown state'):''):r.college;
 function agg(L){const m={};for(const r of L){const k=K(r);if(!k)continue;const e=m[k]=m[k]||{k,n:0,sum:0,no:0,best:null,bestAV:null,hof:0,iso:r.iso,g:0,av:0,ti:0,fin:0};e.n++;e.g+=r.g;e.av+=r.av;e.ti+=r.ti;e.fin+=r.fin;if(r.ovr!=null){e.sum+=r.ovr;e.no++;if(!e.best||r.ovr>e.best.ovr)e.best=r}if(r.av>0&&(!e.bestAV||r.av>e.bestAV.av))e.bestAV=r;if(r.hof)e.hof++}return Object.values(m)}
 function pool(){const g=$('g').value;return all.filter(r=>g==='*'||(g==='a'?r.tid>=0:r.tid===-2))}
 const KEYS={n:e=>e.n,o:e=>e.no?e.sum/e.no:-1,b:e=>e.best?e.best.ovr:-1,g:e=>e.g,gp:e=>e.n?e.g/e.n:0,v:e=>e.av,vp:e=>e.n?e.av/e.n:0,t:e=>e.ti,f:e=>e.fin};
 const nm=k=>tab==='s'&&k!=='Unknown state'?SN(k):k;
 function draw(){const L=pool(),A=agg(L),m=$('m').value,key=KEYS[m];A.sort((a,b)=>key(b)-key(a)||b.n-a.n);const mx=Math.max(1,...A.map(e=>e.n)),known=L.filter(r=>K(r)).length,unk=tab==='s'?L.filter(r=>r.iso==='us'&&!r.state).length:0;
  $('sub').textContent=L.length.toLocaleString('en-US')+' players · '+known.toLocaleString('en-US')+' with a '+(tab==='c'?'country':tab==='s'?'US state':'college')+' · '+A.length.toLocaleString('en-US')+' different';
  const f1=x=>x.toFixed(1);
  $('out').innerHTML=A.length?'<table><tr><th>'+(tab==='c'?'Country':tab==='s'?'State':'College')+'</th><th class="n">Players</th><th></th><th class="n">Games</th><th class="n">Games / player</th><th class="n">Total AV</th><th class="n">AV / player</th><th class="n">Avg overall</th><th>Best overall</th><th>Top AV</th><th class="n">Titles</th><th class="n">Finals</th><th class="n">HoF</th></tr>'+A.map(e=>`<tr class="pick ${sel===e.k?'sel':''}" data-k="${esc(e.k)}"><td>${tab==='c'?PI.flag({iso:e.iso,name:e.k},14)+' ':tab==='s'?PI.flag({iso:'us',name:'USA'},14)+' ':''}${esc(nm(e.k))}</td><td class="n">${e.n.toLocaleString('en-US')}</td><td><span class="pb"><i style="width:${(e.n/mx*100).toFixed(0)}%"></i></span></td><td class="n">${e.g.toLocaleString('en-US')}</td><td class="n">${f1(e.g/e.n)}</td><td class="n">${Math.round(e.av).toLocaleString('en-US')}</td><td class="n">${f1(e.av/e.n)}</td><td class="n">${e.no?f1(e.sum/e.no):''}</td><td>${e.best?`<a href="player.html?pid=${e.best.pid}">${esc(e.best.name)}</a> <span class="mu">${e.best.pos} ${e.best.ovr}</span>`:''}</td><td>${e.bestAV?`<a href="player.html?pid=${e.bestAV.pid}">${esc(e.bestAV.name)}</a> <span class="mu">${Math.round(e.bestAV.av)} AV</span>`:''}</td><td class="n">${e.ti||''}</td><td class="n">${e.fin||''}</td><td class="n">${e.hof||''}</td></tr>`).join('')+'</table>'+'<p class="mu">All '+A.length+' rows are shown. Games and AV are regular-season career totals. Titles: "Won Championship" awards of the players. Finals: seasons in which the player played for a team that reached the final.'+(unk?' '+unk.toLocaleString('en-US')+' US-born players have a birthplace city that is not in the built-in city list, so they have no state.':'')+'</p><p class="mu">Click a row to list its players below.</p>':'<p class="mu">'+(tab==='c'?'No birthplace with a recognised country':tab==='s'?'No US birthplace with a state':'No college')+' is stored for these players. Open Tools / Player data check to see which fields exist.</p>';
  $('out').querySelectorAll('tr.pick').forEach(t=>t.onclick=()=>{sel=t.dataset.k;draw()});
  const S=sel?L.filter(r=>K(r)===sel).sort((a,b)=>(b.ovr||0)-(a.ovr||0)):[];$('lh').textContent=sel?'Players · '+nm(sel)+' · '+S.length:'Players';
  $('pl').innerHTML=sel?'<table><tr><th>Player</th><th>Pos</th><th>Team</th><th>Birthplace</th><th>College</th><th class="n">Games</th><th class="n">AV</th><th class="n">Titles</th><th class="n">Overall</th></tr>'+S.slice(0,200).map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${esc(r.name)}</a>${r.hof?' ★':''}</td><td>${r.pos}</td><td>${r.tid>=0&&TM[r.tid]?Logo.t(r.tid,18)+' '+TM[r.tid].abbrev:({'-1':'FA','-2':'Prospect','-3':'Retired'}[r.tid]||'')}</td><td>${esc(r.loc)}</td><td>${esc(r.college)}</td><td class="n">${r.g}</td><td class="n">${Math.round(r.av)}</td><td class="n">${r.ti||''}</td><td class="n"><b>${r.ovr??''}</b></td></tr>`).join('')+'</table>'+(S.length>200?'<p class="mu">First 200 of '+S.length+'.</p>':''):'<p class="mu">Choose a row above.</p>'}
 $('tb').onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;sel=null;$('tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw()};$('g').onchange=$('m').onchange=()=>{sel=null;draw()};draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
