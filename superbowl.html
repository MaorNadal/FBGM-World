 /* ---- charts ---- */
 const mxm=Math.max(...rows.map(r=>r.margin)),mxt=Math.max(...rows.map(r=>r.total));
 $('sbm').innerHTML=rows.map(r=>`<div title="${r.no} (${r.season}): ${r.margin} points"><b>${r.margin}</b><i style="height:${Math.max(2,r.margin/mxm*100)}%"></i>${String(r.season).slice(2)}</div>`).join('');
 $('pb').innerHTML=rows.map(r=>`<div title="${r.no} (${r.season}): ${r.total} points"><b>${r.total}</b><i style="height:${Math.max(2,r.total/mxt*100)}%"></i>${String(r.season).slice(2)}</div>`).join('');
 /* ---- MVPs ---- */
 const mvr=rows.filter(r=>MV[r.season]);const cnt={},run={};mvr.slice().sort((a,b)=>a.season-b.season).forEach(r=>MV[r.season].forEach(p=>{cnt[p]=(cnt[p]||0)+1;run[r.season+'|'+p]=cnt[p]}));/* SB-1: the badge shows which MVP award this is for the player (x1 none, x2, x3 ...), not his total */
 $('mv').innerHTML=mvr.length?'<table><tr><th>Game</th><th class="n">Season</th><th>MVP</th><th>Champion</th></tr>'+mvr.slice().reverse().map(r=>`<tr><td>${r.no}</td><td class="n">${r.season}</td><td>${MV[r.season].map(p=>`<a href="player.html?pid=${p}">${esc(pn(p))}</a>${run[r.season+'|'+p]>1?' <span class="bg g">×'+run[r.season+'|'+p]+'</span>':''}`).join(', ')}</td><td>${tm(r.w,r.season)}</td></tr>`).join('')+'</table>':'<p class="mu">The save has no Super Bowl MVP award on any player (looked for an award whose name has finals or Super Bowl and MVP). The featured game shows the best performer instead.</p>';
 /* ---- table ---- */
 $('al').innerHTML='<table><tr><th>Game</th><th class="n">Season</th><th>Champion (seed, record)</th><th class="n">Score</th><th>Runner-up (seed, record)</th><th class="n">Margin</th><th class="n">Total</th><th>Notes</th></tr>'+rows.slice().reverse().map(r=>`<tr><td><b>${r.no}</b></td><td class="n">${r.season}</td><td>${tm(r.w,r.season)} ${sdc(r.season)}<span class="mu">${rc(r.wRec)}</span></td><td class="n"><a href="game.html?gid=${r.gid}"><b>${r.ws}–${r.ls}</b></a></td><td>${tm(r.l,r.season)} ${sdr(r.season)}<span class="mu">${rc(r.lRec)}</span></td><td class="n">${r.margin}</td><td class="n">${r.total}</td><td>${[r.first?'first title':'',r.repeat?'repeat':'',r.ot?'OT':'',r.wRank>=4?'upset':'',r.sameConf?'same conf.':''].filter(Boolean).join(', ')}</td></tr>`).join('')+'</table><p><button class="btn ghost" id="cv">Export CSV</button></p>';
 $('cv').onclick=()=>Viz.csv('super-bowls.csv',['Game','Season','Champion','Champion seed','Champion score','Runner-up','Runner-up seed','Runner-up score','Margin','Total'],rows.map(r=>[r.no,r.season,nm(r.w),(SD[r.season]||{}).w,r.ws,nm(r.l),(SD[r.season]||{}).l,r.ls,r.margin,r.total]));
 const h0=+location.hash.slice(1);show(by[h0]?h0:cur0.season)
}catch(e){$('sub').innerHTML='<span class="bad">Could not build the page: '+Viz.esc(e.message)+'</span>';console.error(e)}})()</script></body></html>
