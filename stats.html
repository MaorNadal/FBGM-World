<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stats · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.cs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.l{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:center;padding:5px 0}.l .bar{grid-column:2/4;height:6px}.l b{font-variant-numeric:tabular-nums}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>League leaders</h1><p id="sub">Loading…</p></div>
<div class="card f"><select id="y"></select><select id="k"><option value="0">Regular season</option><option value="1">Playoffs</option><option value="2">Regular season + playoffs</option></select></div><div class="cs" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="leaders.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,t.abbrev||t.tid])),ys=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a);
$('y').innerHTML=ys.map(x=>`<option>${x}</option>`).join('');
async function draw(){const y=+$('y').value;$('sub').textContent=y+' season · loading…';o.innerHTML='';Hub.setTitle(y);
 const [rows,games]=await Promise.all([HubDB.idx('box','season',y),HubDB.idx('games','season',y)]);
 const skip=new Set(games.filter(g=>g.allStar).map(g=>g.gid)),po=({'0':false,'1':true,'2':'both'})[$('k').value],out=[];
 for(const [name,f] of FBGMLeaders.CATS){const L=FBGMLeaders.leaders(rows,f,10,po,skip);if(!L.length)continue;
  const ps=await Promise.all(L.map(e=>HubDB.get('players',e.pid))),mx=L[0].v;
  out.push(`<div class="card"><h2>${name}</h2>`+L.map((e,i)=>{const p=ps[i]||{};return`<div class="l"><span class="mu">${i+1}</span><span><a href="player.html?pid=${e.pid}">${((p.firstName||'')+' '+(p.lastName||'')).trim()||('#'+e.pid)}</a> <span class="mu">${teams[e.tid]??''}</span></span><b>${e.v.toLocaleString('en-US')}</b><div class="bar"><i style="width:${e.v/mx*100}%"></i></div></div>`}).join('')+'</div>')}
 o.innerHTML=out.join('')||'<div class="card"><p>No stats found for this selection.</p></div>';$('sub').textContent=y+' season · '+rows.length.toLocaleString('en-US')+' box rows'}
$('y').onchange=$('k').onchange=draw;draw()})()</script></body></html>
