<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Draft · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Draft</h1><p id="sub">Loading…</p></div><div class="g"><div class="card sc"><h2>Prospects</h2><select id="o"><option value="pot">Best potential</option><option value="ovr">Best overall now</option></select><div id="pr"></div></div><div class="card sc"><h2>Draft order</h2><div id="or"></div></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i);const s=await HubDB.summary();
if(!s){$('pr').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=await HubDB.all('teams'),ab=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid])),R=FBGMRoster.roster(await HubDB.idx('players','tid',-2),-2,s.season);
$('sub').textContent=R.length+' prospects';Hub.setTitle('Draft');
function pro(){const k=$('o').value,d=[...R].sort((a,b)=>(b[k]||0)-(a[k]||0)).slice(0,100);$('pr').innerHTML='<table><tr><th>#</th><th>Player</th><th>Pos</th><th class="n">Age</th><th class="n">Ovr</th><th class="n">Pot</th></tr>'+d.map((r,i)=>`<tr><td>${i+1}</td><td><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${r.pos}</td><td class="n">${r.age??''}</td><td class="n">${r.ovr??''}</td><td class="n"><b>${r.pot??''}</b></td></tr>`).join('')+'</table>'}
$('o').onchange=pro;pro();
const dp=(await HubDB.all('misc')).filter(r=>r.src==='draftPicks').map(r=>r.v).filter(p=>p&&p.season!=null),ys=[...new Set(dp.map(p=>p.season))].sort((a,b)=>a-b),y=ys[0];
$('or').innerHTML=y==null?'<p class="mu">No draft picks stored.</p>':`<p class="mu">${y} draft, round 1</p><table><tr><th>Pick</th><th>Team</th><th>Via</th></tr>`+dp.filter(p=>p.season===y&&p.round===1).sort((a,b)=>(a.pick||0)-(b.pick||0)||a.dpid-b.dpid).map((p,i)=>`<tr><td>${p.pick||i+1}</td><td>${ab[p.tid]??p.tid}</td><td class="mu">${p.originalTid!==p.tid?ab[p.originalTid]??p.originalTid:''}</td></tr>`).join('')+'</table>'})()</script></body></html>
