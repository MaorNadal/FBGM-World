<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Album · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style><style>.pk{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pk svg{width:100%;height:auto;display:block}.ace{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.ac{--k1:#0b6cff;--k2:#f4c542;position:relative;border-radius:18px;padding:12px 8px 14px;text-align:center;background:linear-gradient(165deg,color-mix(in srgb,var(--k1) 72%,#0b1020),#0a0e19 88%);border:2px solid var(--k2);color:var(--tx);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.ac:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 18px 34px #000b,0 0 0 2px var(--k2)}
.ac .rb{position:absolute;left:-30px;top:13px;transform:rotate(-45deg);background:var(--k2);color:#111;font:900 10px system-ui;letter-spacing:.2em;padding:2px 34px;z-index:3}
.ac .po-fig{width:80%;height:auto;margin:0 auto;display:block;filter:drop-shadow(0 8px 8px #000b);animation:acebob 3.4s ease-in-out infinite;transform-origin:50% 100%;position:relative;z-index:2}
.ac b{display:block;font-size:15px;margin-top:2px;position:relative;z-index:2}.ac small{color:#cfd6e2;position:relative;z-index:2}.ac .ov{position:absolute;right:10px;top:8px;font:900 28px system-ui;color:var(--k2);z-index:3}
.ac .hs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;position:relative;z-index:2}.ac .hs i{font-style:normal;font-size:10.5px;font-weight:800;background:#0008;border:1px solid var(--k2);color:var(--k2);border-radius:99px;padding:1px 8px}
.ac:before{content:"";position:absolute;inset:0;background:radial-gradient(120px 90px at 50% 38%,color-mix(in srgb,var(--k2) 35%,transparent),transparent 70%),repeating-linear-gradient(115deg,transparent 0 16px,#ffffff08 16px 17px);pointer-events:none}
.ac.elite{border-width:3px;border-image:linear-gradient(135deg,#fff7c2,#f4c542,#c47cff,#5ad1ff,#fff7c2) 1;border-radius:0;background:linear-gradient(165deg,#1a1230,#0a0e19 70%)}
.ac.elite:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff40 48%,#ffd5ff55 52%,transparent 70%);background-size:300% 100%;animation:holo 3.6s linear infinite;mix-blend-mode:screen;pointer-events:none;z-index:4}
.ac.elite .rb{background:linear-gradient(90deg,#c47cff,#5ad1ff);color:#0a0e19}
.ac.award{background:radial-gradient(160px 140px at 50% 30%,#3a2a08,#120d02 80%);border-color:#f4c542;box-shadow:0 0 0 1px #f4c54255,0 0 24px #f4c54233}
.ac.award .rb{background:linear-gradient(90deg,#ffe9a3,#f4c542,#a8761a);color:#1a1100}
.ac.award:after{content:"";position:absolute;inset:6px;border:1px solid #f4c54266;border-radius:14px;pointer-events:none;z-index:1}
.ac .lw{position:absolute;left:50%;top:6px;width:86%;transform:translateX(-50%);opacity:.5;z-index:1;pointer-events:none}
@keyframes acebob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012)}}
@keyframes holo{0%{background-position:200% 0}100%{background-position:-100% 0}}
@media(prefers-reduced-motion:reduce){.ac .po-fig,.ac.elite:after{animation:none}}
</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Card album</h1><p id="sub">Loading…</p></div><div class="card f"><select id="t"><option value="">All tiers</option><option value="gold">Elite</option><option value="silver">Starter</option><option value="bronze">Role player</option><option value="base">Reserve</option></select></div><div class="card" id="ac" hidden><h2 style="margin-top:0">Ace cards</h2><p class="mu" style="margin-top:0">Full-figure cards for the elite players of your album: the figure is drawn in the team's colours with the jersey number; choose the pose and whether he wears the helmet or shows his face.</p><div class="ctl"><div><label for="po">Pose</label><select id="po"><option value="">A different one for each</option><option>stand</option><option>celebrate</option><option>throw</option><option>run</option><option>carry</option></select></div><div><label for="hm">Head</label><select id="hm"><option value="0">His own face</option><option value="1">Helmet</option></select></div></div><div class="ace" id="ag" style="margin-top:10px"></div></div><h2 style="margin:14px 0 8px">Basic cards</h2><div id="out" class="pk"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="player.js"></script><script src="world.js"></script><script src="faces.js"></script><script src="cards.js"></script><script src="pose.js"></script><script src="awardui.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,t])),ids=World.album(),C=[];
const PP={};for(const id of ids){const p=await HubDB.get('players',id);if(p){PP[id]=p;C.push(FBGMCards.cardData(p,teams[p.tid],FBGMPlayer))}}for(const c of C)c.faceSvg=await Faces.svgString(c.face,92,118,116,174);C.sort((a,b)=>b.ovr-a.ovr);Hub.setTitle('Album');
function draw(){const k=$('t').value,L=C.filter(c=>!k||FBGMCards.tier(c.ovr)===k);const n=t=>C.filter(c=>FBGMCards.tier(c.ovr)===t).length;
 $('sub').textContent=C.length+' cards · Elite '+n('gold')+' · Starter '+n('silver')+' · Role '+n('bronze')+' · Reserve '+n('base');
 o.innerHTML=L.length?L.map(c=>`<a href="player.html?pid=${c.pid}">${FBGMCards.svg(c)}</a>`).join(''):'<div class="card" style="grid-column:1/-1"><p>No cards yet. Open a pack on the Cards page.</p><a class="btn" href="cards.html">Open a pack</a></div>'}
const AUI=FBGMAwardUI,SK={};
const laurel='<svg class="lw" viewBox="0 0 200 120" aria-hidden="true"><g fill="none" stroke="#f4c542" stroke-width="3" stroke-linecap="round"><path d="M30 100 C8 70 12 36 40 14"/><path d="M170 100 C192 70 188 36 160 14"/></g><g fill="#f4c542">'+[[20,84],[16,66],[20,48],[30,32],[42,20],[180,84],[184,66],[180,48],[170,32],[158,20]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="9" ry="4.5" transform="rotate(${x<100?-30:30} ${x} ${y})"/>`).join('')+'</g></svg>';
async function aces(){const hel=$('hm').value==='1',pz=$('po').value,POS=FBGMPose.POSES,box=$('ag');
 const E=C.flatMap(c=>{const p=PP[c.pid],b=AUI.board([p])[0]||{major:0,mvp:0,allL:0},aw=(p.awards||[]).filter(a=>AUI.classify(a.type).group==='major'),o=[];
  /* every player has his basic card (the card list below); 75 and up also a special card (Ace 75 to 83, Elite 84 and up); a major award adds an Award winner card */
  if(c.ovr>=84)o.push({c,p,b,aw,kind:'elite'});else if(c.ovr>=75)o.push({c,p,b,aw,kind:'ace'});if(aw.length)o.push({c,p,b,aw,kind:'award'});return o}).sort((a,b)=>({award:0,elite:1,ace:2}[a.kind]-{award:0,elite:1,ace:2}[b.kind])||b.c.ovr-a.c.ovr).slice(0,60);
 $('ac').hidden=!E.length;if(!E.length)return;let h='';
 for(const x of E){const{c,p,kind}=x,t=teams[p.tid]||{},cs=t.colors||[],num=p.jerseyNumber||((p.stats||[]).slice(-1)[0]||{}).jerseyNumber||'',k2=/^#[0-9a-f]{6}$/i.test(cs[1]||'')&&cs[1]!=='#000000'?cs[1]:(/^#[0-9a-f]{6}$/i.test(cs[2]||'')?cs[2]:'#f4c542');let face='';
  if(!hel){const raw=await Faces.svgString(p.face,0,0,100,100,t);if(raw)face=raw.replace(/\sx="[^"]*"|\sy="[^"]*"|\swidth="[^"]*"|\sheight="[^"]*"/g,'').replace(/viewBox="[^"]*"/,'viewBox="50 14 300 310" preserveAspectRatio="xMidYMin meet"').replace(/^<svg/,'<svg x="52" y="16" width="96" height="100"')}
  SK[c.pid+kind]={c1:cs[0],c2:k2,number:num,helmet:hel||!face,face,skin:p.face&&p.face.body&&p.face.body.color,pose:pz||POS[c.pid%POS.length]};
  const ribbon=kind==='award'?'AWARD':kind==='elite'?'ELITE':'ACE',hs=kind==='award'?x.aw.slice(0,3).map(a=>`<i>${(a.type||'').replace(/Most Valuable Player/,'MVP').replace(/Offensive Player of the Year/,'OPOY').replace(/Defensive Player of the Year/,'DPOY').replace(/</g,'&lt;')} ${a.season}</i>`).join(''):kind==='elite'?`<i>${x.b.allL?x.b.allL+' All-League':'overall '+c.ovr}</i>`:'';
  h+=`<a class="ac ${kind}" data-pid="${c.pid}" data-k="${kind}" href="player.html?pid=${c.pid}" style="--k1:${/^#[0-9a-f]{6}$/i.test(cs[0])?cs[0]:'#0b6cff'};--k2:${k2}"><span class="rb">${ribbon}</span>${kind==='award'?laurel:''}<span class="ov">${c.ovr}</span><span class="fg">${FBGMPose.figure(SK[c.pid+kind])}</span><b>${(c.name||'').replace(/</g,'&lt;')}</b><small>${c.pos||''}${t.abbrev?' · '+t.abbrev:''}</small>${hs?'<div class="hs">'+hs+'</div>':''}</a>`}
 box.innerHTML=h;
 box.querySelectorAll('.ac').forEach(el=>{const pid=el.dataset.pid+el.dataset.k,next=ev=>{const o=SK[pid],i=(FBGMPose.POSES.indexOf(o.pose)+1)%FBGMPose.POSES.length;o.pose=FBGMPose.POSES[i];el.querySelector('.fg').innerHTML=FBGMPose.figure(o)};el.addEventListener('mouseenter',next);el.addEventListener('touchstart',next,{passive:true})})}
$('po').onchange=$('hm').onchange=aces;aces();
$('t').onchange=draw;draw()})()</script></body></html>
