<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>History cards · FBGM Hub</title><link rel="stylesheet" href="hub.css"><link rel="stylesheet" href="awardui.css"><style>.hc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}.hc>*{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;text-decoration:none;color:inherit;background:linear-gradient(150deg,color-mix(in srgb,var(--k1,#0b6cff) 55%,#0b1020),#0a0e19 85%);border:1px solid color-mix(in srgb,var(--k2,#ffb81c) 40%,transparent);border-radius:16px;padding:12px;min-width:0}.hc .yr{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}.hc .yr b{font-size:38px;color:var(--k2,#ffb81c)}.hc .yr small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.hc .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--k2,#ffb81c);font-weight:800}.hc p{margin:4px 0 0}.hc .lg{vertical-align:middle;margin-right:6px}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>History cards</h1><p id="sub">Loading…</p></div>
<div class="card"><label for="m">Show</label><select id="m"><option value="m">Anniversaries: 1, 5, 10, 15 ... years ago</option><option value="a">Every earlier season</option></select></div><div class="hc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="rivals.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="awardui.js"></script><script src="anniv.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('History cards');
try{const teams=await HubDB.all('teams');Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t])),AU=FBGMAwardUI,esc=x=>String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
 const info=FBGMRivals.seasonsInfo(teams,await HubDB.all('games'),s.season),nm=t=>T[t]?((T[t].region||'')+' '+(T[t].name||'')).trim():'#'+t;
 let aw=[];try{for(const p of await LeagueData.players())for(const a of p.awards||[])if(AU.classify(a.type).group==='major')aw.push({season:a.season,type:a.type,pid:p.pid,name:((p.firstName||'')+' '+(p.lastName||'')).trim()||'Player '+p.pid,tid:AU.season(p,a.season).tid})}catch(e){console.error(e)}
 const KL={title:'Champions',best:'Best record',award:'Award',joined:'New team',left:'Left the league',renamed:'New name'};
 function draw(){const L=FBGMAnniv.cards(info,aw,s.season,{name:nm,all:$('m').value==='a'}),pal=t=>AU.palette((T[t]||{}).colors);
  $('sub').textContent=s.season+' · '+L.length+' card'+(L.length===1?'':'s');
  o.innerHTML=L.length?L.map(c=>{const q=pal(c.tid),tag=c.pid?'a':'div',href=c.pid?' href="player.html?pid='+c.pid+'"':'';return `<${tag}${href} style="--k1:${q.k1};--k2:${q.k2}"><span class="yr"><b>${c.years}</b><small>${c.years===1?'year':'years'}</small></span><span><span class="k">${KL[c.kind]} · ${c.season}</span><p>${T[c.tid]?Logo.t(c.tid,22,c.season):''}${esc(c.text)}</p></span></${tag}>`}).join(''):'<div class="card"><p class="mu">No milestone season yet. Choose "Every earlier season".</p></div>'}
 $('m').onchange=draw;draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+e.message+'</p></div>';console.error(e)}})()</script></body></html>
