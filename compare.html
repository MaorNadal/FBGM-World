<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Compare · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.w{font-weight:800;color:var(--c2)}svg{width:100%;height:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Compare players</h1><p>Type part of a name, pick a player, in both boxes.</p></div>
<div class="card f"><div><input id="q1" type="text" placeholder="Player 1"><select id="s1" hidden></select></div><div><input id="q2" type="text" placeholder="Player 2"><select id="s2" hidden></select></div></div><div id="out"></div></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/player.js"></script><script src="assets/js/compare.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim(),P=[null,null],cache={},fresh=new URLSearchParams(location.search);
async function find(i){const q=$('q'+i).value.trim().toLowerCase(),sel=$('s'+i);if(q.length<2){sel.hidden=true;return}
 const r=await HubDB.scan('players',p=>nm(p).toLowerCase().includes(q),25);r.forEach(p=>cache[p.pid]=p);sel.hidden=false;sel.innerHTML='<option value="">Pick…</option>'+r.map(p=>{const sr=FBGMPlayer.series(p),l=sr[sr.length-1]||{};return`<option value="${p.pid}">${nm(p)} · ${l.pos||''} ${l.ovr??''}</option>`}).join('');
 sel.onchange=()=>{P[i-1]=cache[sel.value]||null;draw()}}
let t;[1,2].forEach(i=>$('q'+i).oninput=()=>{clearTimeout(t);t=setTimeout(()=>find(i),350)});
function chart(){const W=640,H=220,Q=34,all=P.flatMap(p=>FBGMPlayer.series(p));if(all.length<2)return'';const x0=Math.min(...all.map(r=>r.season)),x1=Math.max(...all.map(r=>r.season)),xs=v=>Q+(x1===x0?0:(v-x0)/(x1-x0))*(W-2*Q),ys=v=>H-Q-(v/100)*(H-2*Q),col=['var(--c2)','#4fd1ff'];
 return`<svg viewBox="0 0 ${W} ${H}">${[0,50,100].map(v=>`<line x1="${Q}" x2="${W-Q}" y1="${ys(v)}" y2="${ys(v)}" stroke="#223049"/><text x="4" y="${ys(v)+4}" fill="#8ea0b8" font-size="11">${v}</text>`).join('')}${P.map((p,k)=>{const sr=FBGMPlayer.series(p);return`<path d="${sr.map((r,i)=>(i?'L':'M')+xs(r.season).toFixed(1)+','+ys(r.ovr).toFixed(1)).join(' ')}" fill="none" stroke="${col[k]}" stroke-width="3"/>`}).join('')}<text x="${Q}" y="${H-8}" fill="#8ea0b8" font-size="11">${x0}</text><text x="${W-Q-28}" y="${H-8}" fill="#8ea0b8" font-size="11">${x1}</text></svg><p class="mu"><b style="color:${col[0]}">■</b> ${nm(P[0])} &nbsp; <b style="color:${col[1]}">■</b> ${nm(P[1])} (overall by season)</p>`}
function draw(){if(!P[0]||!P[1]){o.innerHTML='';return}const R=FBGMCompare.compare(P[0],P[1],FBGMPlayer);Hub.setTitle('Compare');
 o.innerHTML=`<div class="card sc"><table><tr><th></th><th class="n"><a href="player.html?pid=${P[0].pid}">${nm(P[0])}</a></th><th class="n"><a href="player.html?pid=${P[1].pid}">${nm(P[1])}</a></th></tr>${R.map(([l,a,b])=>{const num=typeof a==='number'&&typeof b==='number'&&a!==b;return`<tr><td>${l}</td><td class="n ${num&&a>b?'w':''}">${a??''}</td><td class="n ${num&&b>a?'w':''}">${b??''}</td></tr>`}).join('')}</table></div><div class="card"><h2>Rating history</h2>${chart()}</div>`}})()</script></body></html>
