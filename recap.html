<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Season recap · FBGM Hub</title><link rel="stylesheet" href="hub.css"><link rel="stylesheet" href="awardui.css"><style>
select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}
.ban{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-left:6px solid var(--c2);background:linear-gradient(110deg,color-mix(in srgb,var(--k,#0b6cff) 55%,var(--bg2)),var(--bg2) 75%)}.ban small{letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.ban .nm{font-size:clamp(24px,6vw,40px);font-weight:800;line-height:1.05}
.gr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}.pl{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #1e2b40}.pl:last-child{border:0}.pl .rk{width:18px;color:var(--mu);font-size:12px}.pl .av{margin:0}.pl div{flex:1;min-width:0}.pl b{font-variant-numeric:tabular-nums}.pl small{color:var(--mu);display:block}
.nt{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.nt div{background:var(--bg3);border-radius:14px;padding:10px 12px}.nt span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.nt b{font-size:18px;display:block;line-height:1.2}
@media print{.top,#dr,#sc,.bot,.ctl,button{display:none!important}body{padding:0;background:#fff;color:#000}}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>Season recap</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="y">Season</label><select id="y"></select></div></div><p style="margin:10px 0 0"><button class="btn ghost" id="pr">Print or save as PDF</button></p></div>
<div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script><script src="transform.js"></script><script src="tiebreak.js"></script><script src="honors.js"></script><script src="metrics.js"></script><script src="rivals.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script><script src="awardui.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,M=FBGMMetrics,esc=V.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Recap');$('pr').onclick=()=>print();
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t])),nm=t=>T[t]?(T[t].region+' '+T[t].name).trim():'Team '+t,games=await LeagueData.games(),I=FBGMRivals.seasonsInfo(teams,games,s.season),EL=await LeagueData.elo();
 $('y').innerHTML=I.slice().reverse().map(x=>`<option>${x.season}</option>`).join('');const h=location.hash.slice(1);if(h&&I.some(x=>x.season===+h))$('y').value=h;
 const P=await LeagueData.players(),byId=Object.fromEntries(P.map(p=>[p.pid,p]));
 const CATS=[['Passing yards','pssYds'],['Rushing yards','rusYds'],['Receiving yards','recYds'],['Sacks','sk'],['Total tackles','tck'],['Interceptions','dint'],['Approximate value','av'],['Fantasy points','fp']];
 async function draw(){const y=+$('y').value,po=false,x=I.find(q=>q.season===y);history.replaceState(0,'','#'+y);$('out').innerHTML='<div class="card"><p class="mu">Building the recap…</p></div>';
  const R=M.teamRows(teams,y,po,await LeagueData.ctx(y,po)),prevR=y>I[0].season?M.teamRows(teams,y-1,po,await LeagueData.ctx(y-1,po)):[],pr=M.playerRows(P,y,po),mean=(R_,k)=>{const v=R_.map(r=>r.v[k]).filter(q=>q!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const top=(k,low)=>R.filter(r=>r.v[k]!=null).sort((a,b)=>low?a.v[k]-b.v[k]:b.v[k]-a.v[k])[0],c=x&&x.champion,best=top('win'),off=top('ppg'),def=top('papg',true),mar=top('mpg');
  const tile=(l,r,k)=>r?`<div><span>${l}</span><b>${Logo.t(r.tid,20,y)} ${esc(r.name)}</b><span style="text-transform:none">${M.fmt(M.TEAM_BY[k],r.v[k])}</span></div>`:'';
  const pm=FBGMModels.pulse(EL.games,y),gm=g=>g?`${esc(nm(g.away))} ${g.ap} @ ${esc(nm(g.home))} ${g.hp}`:'–';
  const ppg=mean(R,'ppg'),pp=mean(prevR,'ppg'),yd=mean(R,'ypg'),pyd=mean(prevR,'ypg');
  const lists=CATS.map(([l,k])=>{const m=M.PLAYER_BY[k],L=pr.filter(r=>r.v[k]!=null&&r.v[k]>0).sort((a,b)=>b.v[k]-a.v[k]).slice(0,3);return L.length?`<div class="card"><h2>${l}</h2>${L.map((r,i)=>`<a class="pl" href="player.html?pid=${r.pid}"><span class="rk">${i+1}</span><span class="av" data-pid="${r.pid}"></span><div>${esc(r.name)}<small>${Logo.t(r.tid,14,y)} ${(T[r.tid]||{}).abbrev||''} · ${r.pos}</small></div><b>${M.fmt(m,r.v[k])}</b></a>`).join('')}</div>`:''}).join('');
  $('out').innerHTML=`<div class="card ban" style="--k:${c?(T[c.tid].colors||[])[0]:'#0b6cff'}">${c?Logo.t(c.tid,84,y):''}<div><small>${y} ${c?'champions':x&&x.current?'season in progress':'season'}</small><div class="nm">${c?esc(nm(c.tid)):'No champion yet'}</div>${c?`<a class="mu" href="game.html?gid=${c.gid}" style="text-decoration:underline">${c.score[0]}–${c.score[1]} over ${esc(nm(c.opp))}</a>`:''}</div></div>
  <div class="card"><h2>The season in numbers</h2><div class="nt">${tile('Best record',best,'win')}${tile('Best offence',off,'ppg')}${tile('Best defence',def,'papg')}${tile('Best point margin',mar,'mpg')}<div><span>Teams</span><b>${x?x.teams:R.length}${x&&x.added.length?' <span class="mu" style="font-size:12px">+'+x.added.length+' new</span>':''}</b></div><div><span>Points per team per game</span><b>${ppg==null?'–':ppg.toFixed(1)}</b><span style="text-transform:none">${pp==null?'':(ppg-pp>=0?'+':'')+(ppg-pp).toFixed(1)+' on '+(y-1)}</span></div><div><span>Yards per team per game</span><b>${yd==null?'–':yd.toFixed(0)}</b><span style="text-transform:none">${pyd==null?'':(yd-pyd>=0?'+':'')+(yd-pyd).toFixed(0)+' on '+(y-1)}</span></div>${x&&x.renamed.length?`<div><span>Renamed or moved</span><b>${x.renamed.map(r=>esc(r.to)).join(', ')}</b></div>`:''}</div></div>
  <div class="card"><h2>Games of the season</h2><div class="nt"><div><span>Biggest blowout</span><b>${pm.blowout?Math.abs(pm.blowout.hp-pm.blowout.ap)+' points':'–'}</b><span style="text-transform:none">${gm(pm.blowout)}</span></div><div><span>Highest scoring</span><b>${pm.shootout?(pm.shootout.hp+pm.shootout.ap)+' points':'–'}</b><span style="text-transform:none">${gm(pm.shootout)}</span></div><div><span>Biggest upset (own Elo model)</span><b>${pm.upset?(pm.upset.pw*100).toFixed(0)+'% chance':'–'}</b><span style="text-transform:none">${pm.upset?gm(pm.upset.g):''}</span></div><div><span>Longest winning streak</span><b>${pm.winStreak?pm.winStreak[1].bw+' games':'–'}</b><span style="text-transform:none">${pm.winStreak?esc(nm(pm.winStreak[0])):''}</span></div><div><span>Longest losing streak</span><b>${pm.loseStreak?pm.loseStreak[1].bl+' games':'–'}</b><span style="text-transform:none">${pm.loseStreak?esc(nm(pm.loseStreak[0])):''}</span></div></div></div>
  <div class="gr">${lists}</div>`;
  $('sub').textContent=y+' · '+(x?x.teams:R.length)+' teams · '+pr.length.toLocaleString('en-US')+' players with stats';
  try{const ga=await LeagueData.attrs(),A=FBGMTransform.attr,hh=FBGMHonors.season(games,teams,y,{confs:A(ga.confs,y)||[],divs:A(ga.divs,y)||[],tiebreakers:A(ga.tiebreakers,y)},y===s.season&&s.phase<4),tl=t=>Logo.t(t,20,y)+' '+esc(nm(t)),rc=r=>r[0]+'-'+r[1]+(r[2]?'-'+r[2]:'');
   const AU=FBGMAwardUI,tc=(label,tier,t,sub)=>{const q=AU.palette((T[t]||{}).colors);return `<a class="aw-t" style="--k1:${q.k1};--k2:${q.k2}" href="team.html#${t}">${Logo.t(t,52,y)}<div class="aw-tn"><small>${label}</small><b>${esc(nm(t))}</b><em>${sub}</em></div>${AU.trophy(tier,34)}</a>`};
   const cn=c=>((hh.conf.find(z=>z.cid===c)||{}).name)||'';
   $('out').insertAdjacentHTML('beforeend',`<div class="card"><h2>Conference and division winners</h2>${hh.conf.length?'<div class="aw-grid">'+hh.conf.map(c=>(c.playoff&&hh.champion?tc(esc(c.name)+' champion · playoffs','gold',c.playoff.tid,c.playoff.wins+' playoff win'+(c.playoff.wins===1?'':'s')):'')+(c.best?tc(esc(c.name)+' · best record','silver',c.best.tid,rc(c.best.rec)):'')).join('')+'</div>':'<p class="mu">No conferences are defined in this save.</p>'}<div class="aw-grid" style="margin-top:12px">${hh.division.map(d=>tc(esc(d.name||'Division '+d.did)+(cn(d.cid)?' · '+esc(cn(d.cid)):''),'bronze',d.tid,rc(d.rec))).join('')}</div><p class="mu">Conference champion by playoffs: the conference's team that went furthest (this league has one playoff pool). See Championships.</p></div>`);
   /* RC-1: individual awards of the season, from the awards stored on the players */
   const E={};for(const p of P)for(const a of p.awards||[])if(a.season===y){const c=AU.classify(a.type);if(c.group==='major'||(c.group==='allleague'&&c.rank===1)||(c.group==='allstar'&&c.tier==='gold'))(E[a.type]=E[a.type]||[]).push(p)}
   const ts=Object.keys(E).sort((a,b)=>AU.majorOrder(a)-AU.majorOrder(b)||a.localeCompare(b)),pc=(p,t)=>{const se=AU.season(p,y),r=AU.ratingAt(p,y)||{},tid=se.tid!=null?se.tid:p.tid,q=AU.palette((T[tid]||{}).colors),n=AU.nth(p,t,y);return `<a class="aw-c" style="--k1:${q.k1};--k2:${q.k2}" href="player.html?pid=${p.pid}"><div class="aw-h">${AU.trophy(AU.classify(t).tier,30)}<span class="aw-ty">${esc(t)}</span></div><div class="aw-b"><span class="av aw-f" data-pid="${p.pid}"></span><div class="aw-n"><b>${esc(((p.firstName||'')+' '+(p.lastName||'')).trim())}</b><small>${esc(r.pos||'')} · ${Logo.t(tid,16,y)} ${esc((T[tid]||{}).abbrev||'')}</small></div>${r.ovr!=null?`<div class="aw-o">${r.ovr}<small>ovr</small></div>`:''}</div><div class="aw-s">${AU.statLine(p,y).map(([v,l])=>`<span><b>${v}</b> ${esc(l)}</span>`).join('')}</div>${n>1?`<div class="aw-x">${AU.ord(n)} time winner</div>`:''}</a>`};
   if(ts.length){$('out').insertAdjacentHTML('beforeend',`<div class="card"><h2>Individual awards</h2><div class="aw-grid">${ts.flatMap(t=>E[t].slice(0,4).map(p=>pc(p,t))).join('')}</div><p class="mu" style="margin-bottom:0"><a href="awards.html" style="text-decoration:underline">All awards of every season</a></p></div>`);Faces.lazy($('out'),pid=>(byId[pid]||{}).face,pid=>T[(byId[pid]||{}).tid])}
   }catch(e){console.error(e)}
  Faces.lazy($('out'),pid=>(byId[pid]||{}).face,pid=>T[(byId[pid]||{}).tid])}
 $('y').onchange=draw;draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the recap.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
