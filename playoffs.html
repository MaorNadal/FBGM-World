<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Playoffs · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}th[data-k]{cursor:pointer;white-space:nowrap}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid #2a3a52;background:var(--bg3);color:var(--tx);font:600 14px var(--f);cursor:pointer}.tabs button.on{background:var(--c2);color:#000;border-color:var(--c2)}</style><style>.rd{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}.col{min-width:178px;flex:1;scroll-snap-align:start}.col h2{margin:8px 0;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}.mu2{display:block;background:var(--bg2);border:1px solid #1e2b40;border-radius:14px;padding:6px 10px;margin:0 0 12px;transition:transform .15s,border-color .15s}.mu2:hover{transform:translateY(-2px);border-color:var(--c2)}.tm{display:flex;align-items:center;gap:8px;padding:5px 0}.tm span{flex:1}.tm.l{opacity:.55}.tm.w b{color:var(--c2)}.tm+.tm{border-top:1px solid #1e2b40}</style></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>Playoff bracket</h1><p id="sub">Loading…</p></div><div class="card"><select id="y"></select></div><div id="ch"></div><div class="rd" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="faces.js"></script><script src="statsagg.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=await HubDB.all('teams');Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t])),nm=t=>(T[t].region+' '+T[t].name).trim(),G=await HubDB.all('games');
const ys=[...new Set(G.filter(g=>g.playoffs).map(g=>g.season))].sort((a,b)=>b-a);$('y').innerHTML=ys.map(x=>`<option>${x}</option>`).join('');
const rn=(i,n)=>n===1?'Final':i===n-1?'Final':i===n-2&&n>2?'Semifinals':i===n-3&&n>3?'Quarterfinals':'Round '+(i+1);
function draw(){const y=+$('y').value,R=FBGMStatsAgg.rounds(G,y);Hub.setTitle(y);$('sub').textContent=y+' · '+R.length+' rounds · '+R.reduce((a,r)=>a+r.length,0)+' games';
 const fin=R.length?R[R.length-1][0]:null,win=fin&&fin.teams[0].pts!==fin.teams[1].pts?(fin.teams[0].pts>fin.teams[1].pts?fin.teams[0].tid:fin.teams[1].tid):null;
 $('ch').innerHTML=win!=null?`<div class="card" style="display:flex;align-items:center;gap:16px;border-left:5px solid var(--c2)">${Logo.t(win,72)}<div><small class="mu" style="letter-spacing:.12em;text-transform:uppercase">${y} champions</small><div style="font-size:28px;font-weight:800">${nm(win)}</div></div></div>`:'';
 o.innerHTML=R.map((r,i)=>`<div class="col"><h2>${rn(i,R.length)}</h2>${r.map(g=>{const w=g.teams[0].pts>g.teams[1].pts?0:g.teams[1].pts>g.teams[0].pts?1:-1;return`<a class="mu2" href="game.html?gid=${g.gid}">${g.teams.map((x,k)=>`<div class="tm ${w===k?'w':w<0?'':'l'}">${Logo.t(x.tid,24)}<span>${T[x.tid].abbrev||x.tid}</span><b>${x.pts}</b></div>`).join('')}</a>`}).join('')}</div>`).join('')||'<div class="card"><p>No playoff games found for this season.</p></div>'}
$('y').onchange=draw;draw()})()</script></body></html>
