<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cap · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.pb{position:relative;height:14px;background:var(--bg3);border-radius:99px;min-width:140px}.pb i{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2))}.pb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff8}.pb.o i{background:var(--bad)}tr.me{background:#ffffff12}</style></head><body>
<main class="wrap"><div class="hero"><small>Team · Finances</small><h1>Cap and contracts</h1><p id="sub">Loading…</p></div><div class="card sc" id="out"></div><div class="card sc" id="ex"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="transform.js"></script><script src="cap.js"></script>
<script>(async()=>{const o=document.getElementById('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const ga=((await HubDB.get('meta','gameAttributes'))||{}).v||{},A=k=>FBGMTransform.attr(ga[k],s.season),lim={cap:A('salaryCap')||310000,min:A('minPayroll')||175000,lux:A('luxuryPayroll')||340000},teams=await HubDB.all('teams');Logo.init(teams);
const P=await HubDB.scan('players',p=>p.tid>=0&&p.contract),T=FBGMCap.capTable(P,teams,lim),M=lim.lux*1.12,m=v=>(v/1000).toFixed(1)+'M',pc=v=>Math.min(100,v/M*100);
document.getElementById('sub').textContent=`Cap ${m(lim.cap)} · minimum ${m(lim.min)} · luxury ${m(lim.lux)}`;Hub.setTitle(s.season);
o.innerHTML='<table><tr><th>Team</th><th class="n">Payroll</th><th class="n">Space</th><th class="n">Players</th><th style="width:34%"></th></tr>'+T.map(t=>`<tr class="${t.tid===s.userTid?'me':''}"><td><a href="cap.html#${t.tid}">${Logo.t(t.tid,22)} ${t.name}</a></td><td class="n">${m(t.pay)}</td><td class="n ${t.space<0?'bad':'ok'}">${m(t.space)}</td><td class="n">${t.n}</td><td><div class="pb ${t.over?'o':''}"><i style="width:${pc(t.pay)}%"></i><u style="left:${pc(lim.min)}%" title="minimum"></u><u style="left:${pc(lim.cap)}%" title="cap"></u><u style="left:${pc(lim.lux)}%" title="luxury"></u></div></td></tr>`).join('')+'</table><p class="mu">Lines: minimum payroll, cap, luxury tax.</p>';
function ex(){const tid=+(location.hash.slice(1)||s.userTid),t=teams.find(x=>x.tid===tid),L=FBGMCap.expiring(P,tid,s.season);
 document.getElementById('ex').innerHTML=`<h2>Contracts ending ${s.season} · ${t?(t.region+' '+t.name).trim():''}</h2>`+(L.length?'<table><tr><th>Player</th><th class="n">Amount</th><th class="n">Ends</th></tr>'+L.map(p=>`<tr><td><a href="player.html?pid=${p.pid}">${((p.firstName||'')+' '+(p.lastName||'')).trim()}</a></td><td class="n">${m(p.contract.amount)}</td><td class="n">${p.contract.exp}</td></tr>`).join('')+'</table>':'<p>None.</p>')}
ex();addEventListener('hashchange',ex)})()</script></body></html>
