<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pulse · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.pb{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg3);min-width:120px}.pb i{background:var(--c2)}.pb b{background:var(--c1)}svg{width:100%;height:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>League pulse</h1><p id="sub">Loading…</p></div><div class="card"><select id="y"></select></div><div id="out"></div></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/elo.js"></script>
<script>(async()=>{const o=document.getElementById('out'),y=document.getElementById('y');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams'),nm=Object.fromEntries(teams.map(t=>[t.tid,(t.region+' '+t.name).trim()])),M=FBGMModels.run(await HubDB.all('games'));
y.innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
const gm=g=>g?`${nm[g.away]} ${g.ap} @ ${nm[g.home]} ${g.hp} <span class="mu">(day ${g.day??''}${g.playoffs?', playoffs':''})</span>`:'—',card=(t,b,x)=>`<div class="tile"><span>${t}</span><b style="font-size:22px">${b}</b><span style="text-transform:none">${x}</span></div>`;
function draw(){const P=FBGMModels.pulse(M.games,+y.value);Hub.setTitle(y.value);document.getElementById('sub').textContent=y.value+' · '+P.games+' regular-season games';
 o.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${card('Biggest blowout',P.blowout?Math.abs(P.blowout.hp-P.blowout.ap)+' points':'—',gm(P.blowout))}${card('Highest scoring',P.shootout?(P.shootout.hp+P.shootout.ap)+' points':'—',gm(P.shootout))}${card('Biggest upset (by the model)',P.upset?(P.upset.pw*100).toFixed(0)+'% chance':'—',P.upset?gm(P.upset.g):'')}${card('Longest win streak',P.winStreak?P.winStreak[1].bw+' games':'—',P.winStreak?nm[P.winStreak[0]]:'')}${card('Longest losing streak',P.loseStreak?P.loseStreak[1].bl+' games':'—',P.loseStreak?nm[P.loseStreak[0]]:'')}</div>`+(P.active.length?`<div class="card"><h2>Streaks at the end of the data</h2><table>${P.active.slice(0,12).map(a=>`<tr><td>${nm[a.tid]}</td><td class="${a.w?'ok':'bad'}">${a.w?a.w+' wins':a.l+' losses'} in a row</td></tr>`).join('')}</table></div>`:'')}
y.onchange=draw;draw()})()</script></body></html>
