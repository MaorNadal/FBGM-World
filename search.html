<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search · FBGM Hub</title><link rel="stylesheet" href="hub.css"></head><body>
<main class="wrap"><div class="hero"><small>Tools</small><h1>Search</h1><p>Players and teams in one box.</p></div><div class="card"><input id="q" type="text" placeholder="Type at least 2 letters" autofocus></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams'),ab=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid])),nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim();let t;
$('q').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const q=$('q').value.trim().toLowerCase();if(q.length<2){o.innerHTML='';return}
 const T=teams.filter(x=>(x.region+' '+x.name).toLowerCase().includes(q)||String(x.abbrev||'').toLowerCase()===q),P=(await HubDB.scan('players',p=>nm(p).toLowerCase().includes(q),40)).map(p=>Object.assign(FBGMRoster.roster([p],p.tid,s.season)[0],{tid:p.tid}));
 o.innerHTML=(T.length?`<div class="card"><h2>Teams</h2>${T.map(x=>`<p><b>${(x.region+' '+x.name).trim()}</b> · <a href="team.html#${x.tid}">Roster</a> · <a href="schedule.html?tid=${x.tid}">Schedule</a> · <a href="teamhist.html#${x.tid}">History</a> · <a href="cap.html#${x.tid}">Cap</a></p>`).join('')}</div>`:'')+(P.length?`<div class="card"><h2>Players</h2><table>${P.map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${r.pos}</td><td>${r.tid>=0?ab[r.tid]:({'-1':'FA','-2':'Prospect','-3':'Retired'}[r.tid]||'')}</td><td><b>${r.ovr??''}</b></td></tr>`).join('')}</table></div>`:'')||'<div class="card"><p>Nothing found.</p></div>'},300)}})()</script></body></html>
