<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search · FBGM Hub</title><link rel="stylesheet" href="hub.css"></head><body>
<main class="wrap"><div class="hero"><small>Tools</small><h1>Search</h1><p>Players and teams in one box.</p></div><div class="card"><input id="q" type="text" placeholder="Type at least 2 letters" autofocus></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams'),ab=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid])),nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim();let t;
$('q').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const q=$('q').value.trim().toLowerCase();if(q.length<2){o.innerHTML='';return}
 const T=teams.filter(x=>(x.region+' '+x.name).toLowerCase().includes(q)||String(x.abbrev||'').toLowerCase()===q),P=(await HubDB.scan('players',p=>nm(p).toLowerCase().includes(q),40)).map(p=>Object.assign(FBGMRoster.roster([p],p.tid,s.season)[0],{tid:p.tid}));
/* 1.71 (FR-NAV-4): seasons, games and news too. A 4-digit number that is a stored season gives links for it; team names or codes with "vs" or a season give that team's games; the news is searched by its text. */
 const E=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),ys=Object.keys(s.seasonGames||{}).map(Number).sort((a,b)=>b-a),ym=q.match(/\b(\d{4})\b/),yr=ym&&ys.includes(+ym[1])?+ym[1]:null,rest=q.replace(/\b\d{4}\b/,' ').replace(/\bvs?\.?\b|\bat\b/g,' ').replace(/\s+/g,' ').trim();
 const tk=x=>{const rs=[];for(const w of rest.split(' ').filter(Boolean)){const m=teams.filter(t=>String(t.abbrev||'').toLowerCase()===w||(t.region+' '+t.name).toLowerCase()===w||String(t.region).toLowerCase()===w||String(t.name).toLowerCase()===w);if(m.length===1&&!rs.includes(m[0]))rs.push(m[0])}return rs};
 const TT=tk(),SE=yr?`<div class="card"><h2>Season ${yr}</h2><p><a href="league.html?y=${yr}">Standings</a> · <a href="picture.html">Playoff picture</a> · <a href="awards.html">Awards</a> · <a href="leagueschedule.html">League schedule</a> · <a href="stats.html">Leaders</a> · <a href="draft.html">Draft</a> · <a href="recap.html">Season recap</a></p></div>`:'';
 let GM='';if(TT.length&&TT.length<=2){const G=await HubDB.scan('games',g=>!g.allStar&&g.teams&&g.teams.length===2&&TT.every(t=>g.teams.some(z=>z.tid===t.tid))&&(yr==null||g.season===yr),400),L=G.sort((a,b)=>b.season-a.season||(b.day||0)-(a.day||0)).slice(0,25);
  if(L.length)GM=`<div class="card"><h2>Games${TT.length===2?': '+E(TT[0].abbrev)+' and '+E(TT[1].abbrev):': '+E(TT[0].abbrev)}${yr?' in '+yr:''}</h2><table>${L.map(g=>`<tr><td>${g.season}${g.playoffs?' ★':''}</td><td>${E(ab[g.teams[1].tid])} at ${E(ab[g.teams[0].tid])}</td><td><a href="game.html?gid=${g.gid}"><b>${g.teams[1].pts}–${g.teams[0].pts}</b></a></td></tr>`).join('')}</table></div>`}
 let EV='';if(rest.length>=3){let ev=[];try{ev=await HubDB.scan('events',e=>e.text&&e.type!=='injured'&&e.type!=='healed'&&String(e.text).toLowerCase().includes(rest)&&(yr==null||e.season===yr),30)}catch(e){}
  if(ev.length)EV=`<div class="card"><h2>News</h2><table>${ev.sort((a,b)=>b.season-a.season||b.eid-a.eid).map(e=>`<tr><td>${e.season}</td><td class="mu">${E(e.type||'')}</td><td style="white-space:normal">${String(e.text).replace(/<[^>]*>/g,'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</td></tr>`).join('')}</table></div>`}
 o.innerHTML=SE+GM+(T.length?`<div class="card"><h2>Teams</h2>${T.map(x=>`<p><b>${(x.region+' '+x.name).trim()}</b> · <a href="team.html#${x.tid}">Roster</a> · <a href="schedule.html?tid=${x.tid}">Schedule</a> · <a href="teamhist.html#${x.tid}">History</a> · <a href="cap.html#${x.tid}">Cap</a></p>`).join('')}</div>`:'')+(P.length?`<div class="card"><h2>Players</h2><table>${P.map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${r.pos}</td><td>${r.tid>=0?ab[r.tid]:({'-1':'FA','-2':'Prospect','-3':'Retired'}[r.tid]||'')}</td><td><b>${r.ovr??''}</b></td></tr>`).join('')}</table></div>`:'')+EV||'<div class="card"><p>Nothing found.</p></div>'},300)}})()</script></body></html>
