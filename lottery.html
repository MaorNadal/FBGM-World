<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Draft lottery · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.pb{display:inline-block;width:110px;height:8px;border-radius:9px;background:var(--bg3);overflow:hidden;vertical-align:middle}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}.up{color:var(--ok);font-weight:800}.dn{color:var(--bad);font-weight:800}pre{background:var(--bg3);border-radius:10px;padding:10px;overflow:auto;max-height:260px;font-size:12px}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Draft lottery</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="y">Season</label><select id="y"></select></div></div><p class="mu" style="margin-bottom:0">The stored result of the lottery of each draft: the pick each team got, the team the pick originally belonged to, the stored chance, and how far the draw moved the pick against the order by chance. Read-only.</p></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),esc=Viz.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Lottery');
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 const L=(await HubDB.all('misc')).filter(r=>r.src==='draftLotteryResults'&&r.v).map(r=>r.v).sort((a,b)=>(b.season||0)-(a.season||0));
 if(!L.length){$('sub').textContent='No lottery results in this save';$('out').innerHTML='<p class="mu">The save holds no lottery results (the draftLotteryResults collection is empty or missing).</p>';return}
 $('y').innerHTML=L.map(l=>`<option>${l.season}</option>`).join('');const nm=t=>T[t]?(T[t].region+' '+T[t].name).trim():'Team '+t;
 function draw(){const l=L.find(x=>x.season===+$('y').value)||L[0],R=Array.isArray(l.result)?l.result:Array.isArray(l.results)?l.results:[];$('sub').textContent=L.length+' lotteries · '+l.season+' · '+R.length+' teams in the draw'+(l.draftType?' · type '+esc(l.draftType):'');
  if(!R.length){$('out').innerHTML='<p class="mu">This record has no list of teams. Raw content:</p><pre>'+esc(JSON.stringify(l,null,1).slice(0,2500))+'</pre>';return}
  const byCh=R.map((r,i)=>({r,i,c:+r.chances||0})).sort((a,b)=>b.c-a.c||a.i-b.i),exp={};byCh.forEach((x,k)=>exp[x.i]=k+1);const tot=R.reduce((a,r)=>a+(+r.chances||0),0)||1,hasP=R.some(r=>r.pick!=null);
  const rows=R.map((r,i)=>({tid:r.tid,orig:r.originalTid,ch:+r.chances||0,pick:hasP?r.pick:i+1,exp:exp[i]}));rows.sort((a,b)=>a.pick-b.pick);
  $('out').innerHTML='<table><tr><th class="n">Pick</th><th>Team</th><th>Pick from</th><th class="n">Chance of the top pick</th><th></th><th class="n">Order by chance</th><th class="n">Moved</th></tr>'+rows.map(r=>{const m=r.exp-r.pick;return`<tr><td class="n"><b>${r.pick}</b></td><td>${Logo.t(r.tid,20,l.season)} <a href="team.html#${r.tid}">${esc(nm(r.tid))}</a></td><td>${r.orig!=null&&r.orig!==r.tid?Logo.t(r.orig,18,l.season)+' '+esc((T[r.orig]||{}).abbrev||''):''}</td><td class="n">${(r.ch/tot*100).toFixed(1)}%</td><td><span class="pb"><i style="width:${Math.min(100,r.ch/tot*400)}%"></i></span></td><td class="n">${r.exp}</td><td class="n ${m>0?'up':m<0?'dn':''}">${m>0?'▲'+m:m<0?'▼'+(-m):'–'}</td></tr>`}).join('')+'</table><p class="mu">Moved: positions gained (▲) or lost (▼) against the order of the stored chances. Chances are shown as a share of the total of all teams.</p>'}
 $('y').onchange=draw;draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
