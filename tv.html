<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TV · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Media</small><h1>Broadcast schedule</h1><p id="sub">Loading…</p></div><div class="card f"><select id="y"></select><select id="d"></select></div><div id="out"></div><p class="mu">SIMULATED. The save has no kickoff times or networks, so slots and channels are generated: the strongest and closest matchups get primetime, the rest split into Sunday early and late windows. Win chances come from this app's Elo model.</p></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/elo.js"></script><script src="assets/js/tv.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams'),ab=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid])),col=Object.fromEntries(teams.map(t=>[t.tid,t.colors||['#1b3a6b','#ffb81c']])),M=FBGMModels.run(await HubDB.all('games')),rem=(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v);
$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
const pl=y=>M.games.filter(g=>g.season===y&&!g.playoffs),days=y=>[...new Set(pl(y).map(g=>g.day).concat(y===s.season?rem.map(m=>m.day):[]).filter(x=>x!=null))].sort((a,b)=>a-b);
function fill(){const ds=days(+$('y').value),nx=+$('y').value===s.season?(rem.length?Math.min(...rem.map(m=>m.day)):ds[ds.length-1]):ds[ds.length-1];$('d').innerHTML=ds.map(x=>`<option>${x}</option>`).join('');$('d').value=nx;draw()}
const bug=(g,x)=>{const a=col[g.away],h=col[g.home],done=x!=null;return`<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch;margin:8px 0"><div style="color:${Hub.ink(a[0])};background:${a[0]};border-right:4px solid ${a[1]};padding:8px 12px;border-radius:10px 0 0 10px;transform:skewX(-8deg)"><b>${ab[g.away]}</b> <span style="float:right;font-size:20px;font-weight:800">${done?g.ap:''}</span></div><div style="align-self:center;font-size:11px;color:var(--mu)">${done?'FINAL':'@'}</div><div style="color:${Hub.ink(h[0])};background:${h[0]};border-left:4px solid ${h[1]};padding:8px 12px;border-radius:0 10px 10px 0;transform:skewX(-8deg)"><span style="font-size:20px;font-weight:800">${done?g.hp:''}</span> <b style="float:right">${ab[g.home]}</b></div></div>`};
function draw(){const y=+$('y').value,d=+$('d').value;Hub.setTitle(y);const P=pl(y).filter(g=>g.day===d).map(g=>Object.assign({},g,{done:true}));
 const R=y===s.season?rem.filter(m=>m.day===d).map(m=>({gid:m.gid,home:m.homeTid,away:m.awayTid,day:d,p:FBGMModels.P(M.rating[m.homeTid]??1500,M.rating[m.awayTid]??1500,M.opts.H)})):[];
 const S=FBGMTV.slate(P.concat(R),M.rating,M.opts.H);$('sub').textContent=y+' · day '+d+' · '+S.length+' games';
 o.innerHTML=FBGMTV.SLOTS.map(sl=>{const L=S.filter(g=>g.slot===sl);if(!L.length)return'';return`<div class="card"><h2>${sl} <span style="float:right;color:var(--c2)">${L[0].channel}</span></h2>${L.map(g=>bug(g,g.done?1:null)+(g.featured?'<small style="color:var(--c2)">FEATURED</small> ':'')+(g.done?'':`<small class="mu">${ab[g.away]} ${((1-g.p)*100).toFixed(0)}% · ${ab[g.home]} ${(g.p*100).toFixed(0)}%</small>`)).join('')}</div>`}).join('')||'<div class="card"><p>No games on this day.</p></div>'}
$('y').onchange=fill;$('d').onchange=draw;fill()})()</script></body></html>
