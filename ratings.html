<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Player ratings · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}th{cursor:pointer;white-space:nowrap}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;min-width:38px}.pg{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Player ratings</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="y">Season</label><select id="y"></select></div><div><label for="g">Who</label><select id="g"><option value="*">Everyone with a rating that season</option><option value="a">On a team that season</option><option value="t">One team…</option></select></div><div id="wt" hidden><label for="t">Team</label><select id="t"></select></div><div><label for="p">Position</label><select id="p"></select></div><div><label for="q">Name</label><input id="q" type="text" placeholder="Part of a name"></div><div><label for="mn">Overall at least</label><input id="mn" type="number" min="0" max="100"></div></div><p class="mu" style="margin-bottom:0">The 21 skill ratings of every player for the chosen season, with the overall and potential of that season, read from the full player records (the first load of a season takes a few seconds). Colour: darker green is higher.</p></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),V=Viz,esc=V.esc,PI=FBGMPlayerInfo;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Ratings');
const RL={hgt:'Hgt',stre:'Str',spd:'Spd',endu:'End',thv:'Thv',thp:'Thp',tha:'Tha',bsc:'Bsc',elu:'Elu',rtr:'Rtr',hnd:'Hnd',rbk:'Rbk',pbk:'Pbk',pcv:'Pcv',tck:'Tck',prs:'Prs',rns:'Rns',kpw:'Kpw',kac:'Kac',ppw:'Ppw',pac:'Pac'},KS=Object.keys(RL);
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),TM=Object.fromEntries(teams.map(t=>[t.tid,t]));Logo.init(teams);
 $('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${esc((t.region+' '+t.name).trim())}</option>`).join('');$('t').value=s.userTid;
 const ys=[];for(let y=s.season;y>=s.season-30;y--)ys.push(y);$('y').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');
 const cache={};let rows=[],key='ovr',dir=-1,page=0;const PS=100,tn=t=>t>=0&&TM[t]?TM[t].abbrev:({'-1':'FA','-2':'Prospect','-3':'Retired'}[t]||'');
 async function load(){const y=+$('y').value;o.innerHTML='<p class="mu">Reading all players for '+y+'…</p>';
  if(!cache[y])cache[y]=await HubDB.scanMap('players',p=>{const R=p.ratings||[],r=R.find(x=>x.season===y);if(!r)return;let tid=null;for(const t of p.stats||[])if(t.season===y&&!t.playoffs)tid=t.tid;if(tid==null&&y===s.season)tid=p.tid;
   const x={pid:p.pid,tid:tid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos:PI.pos(p,y,r),age:PI.age(p,y),ovr:PI.ovr(p,y,r),pot:PI.pot(p,y,r),face:p.face};for(const k of KS)if(typeof r[k]==='number')x[k]=r[k];return x});
  rows=cache[y];$('p').innerHTML='<option value="">All positions</option>'+[...new Set(rows.map(r=>r.pos))].filter(Boolean).sort().map(v=>`<option>${v}</option>`).join('');page=0;draw()}
 const heat=v=>v==null?'':`background:rgba(39,209,127,${(Math.max(0,Math.min(100,v))/100*.6).toFixed(2)})`;
 function draw(){const g=$('g').value,q=$('q').value.trim().toLowerCase(),pos=$('p').value,mn=$('mn').value===''?null:+$('mn').value;$('wt').hidden=g!=='t';
  let L=rows.filter(r=>(g==='*'||(g==='a'?r.tid!=null&&r.tid>=0:r.tid===+$('t').value))&&(!pos||r.pos===pos)&&(!q||r.name.toLowerCase().includes(q))&&(mn==null||(r.ovr!=null&&r.ovr>=mn)));
  L.sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'||typeof y==='string'?String(x==null?'':x).localeCompare(String(y==null?'':y)):(x==null)-(y==null)||x-y)*dir});
  const n=L.length,mx=Math.max(0,Math.ceil(n/PS)-1);if(page>mx)page=mx;const d=L.slice(page*PS,page*PS+PS);
  $('sub').textContent=$('y').value+' · '+n.toLocaleString('en-US')+' players';
  const C=[['name','Player'],['pos','Pos'],['tid','Team'],['age','Age'],['ovr','Ovr'],['pot','Pot']].concat(KS.map(k=>[k,RL[k]]));
  o.innerHTML=d.length?'<table><tr>'+C.map(([k,l])=>`<th data-k="${k}" ${RL[k]?'title="'+k+'"':''}>${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+d.map(r=>`<tr><td><span class="av" data-pid="${r.pid}"></span><a href="player.html?pid=${r.pid}">${esc(r.name)}</a></td><td>${r.pos}</td><td>${r.tid!=null&&r.tid>=0?Logo.t(r.tid,18)+' ':''}${r.tid==null?'':tn(r.tid)}</td><td class="n">${r.age??''}</td><td class="h" style="${heat(r.ovr)}">${r.ovr??''}</td><td class="h" style="${heat(r.pot)}">${r.pot??''}</td>${KS.map(k=>`<td class="h" style="${heat(r[k])}">${r[k]??''}</td>`).join('')}</tr>`).join('')+'</table>'+(mx?`<div class="pg"><button class="btn ghost" id="pv" ${page?'':'disabled'}>‹</button><span class="mu">Page ${page+1} of ${mx+1}</span><button class="btn ghost" id="nx" ${page<mx?'':'disabled'}>›</button></div>`:'')+'<p><button class="btn ghost" id="cv">Export CSV (all '+n+' rows)</button></p>':'<p>Nobody matches.</p>';
  o.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(['name','pos'].includes(k)?1:-1);key=k;page=0;draw()});
  if($('pv'))$('pv').onclick=()=>{page--;draw()};if($('nx'))$('nx').onclick=()=>{page++;draw()};
  const cv=$('cv');if(cv)cv.onclick=()=>V.csv('player-ratings-'+$('y').value+'.csv',C.map(c=>c[1]),L.map(r=>C.map(([k])=>k==='tid'?tn(r.tid):r[k])));
  Faces.lazy(o,pid=>(d.find(r=>r.pid==pid)||{}).face,pid=>TM[(d.find(r=>r.pid==pid)||{}).tid])}
 $('y').onchange=load;['g','t','p'].forEach(i=>$(i).onchange=()=>{page=0;draw()});$('q').oninput=$('mn').oninput=()=>{page=0;draw()};await load()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
