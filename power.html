<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Power · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>Power rankings</h1><p id="sub">Loading…</p></div><div class="card"><select id="y"></select></div><div class="card sc" id="out"></div><p class="mu">Index = 60% points margin per game + 40% win percentage (regular season, scaled to average 50). It is this app's own measure, not the game's power rankings.</p></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/power.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=await HubDB.all('teams');$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
async function draw(){const y=+$('y').value;Hub.setTitle(y);const R=FBGMPower.power(await HubDB.idx('games','season',y),teams,y);$('sub').textContent=y+' · '+R.length+' teams';
 o.innerHTML='<table><tr><th>#</th><th>Team</th><th class="n">Index</th><th class="n">W-L</th><th class="n">PF</th><th class="n">PA</th><th class="n">Margin/G</th></tr>'+R.map((e,i)=>`<tr class="${e.tid===s.userTid?'me':''}"><td>${i+1}</td><td><a href="schedule.html?tid=${e.tid}">${e.name}</a></td><td class="n"><b>${e.power.toFixed(1)}</b></td><td class="n">${e.w}-${e.l}${e.t?'-'+e.t:''}</td><td class="n">${e.pf}</td><td class="n">${e.pa}</td><td class="n ${e.mpg>=0?'ok':'bad'}">${e.mpg>=0?'+':''}${e.mpg.toFixed(1)}</td></tr>`).join('')+'</table>'}
$('y').onchange=draw;draw()})()</script></body></html>
