<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>News · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.e{padding:10px 0;border-bottom:1px solid #1e2b40}.e small{color:var(--c2);text-transform:uppercase;letter-spacing:.08em}</style></head><body>
<main class="wrap"><div class="hero"><small>League</small><h1>News and transactions</h1><p id="sub">Loading…</p></div>
<div class="card f"><select id="y"></select><select id="k"><option value="">All types</option></select><input id="q" type="text" placeholder="Search text"></div><div class="card" id="out"></div></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,t.abbrev||t.tid])),esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),MAX=150;
$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');let ev=[];
async function load(){$('sub').textContent='Loading…';const y=+$('y').value;try{ev=await HubDB.idx('events','season',y)}catch(e){ev=(await HubDB.all('events')).filter(x=>x.season===y)}
 ev.sort((a,b)=>(b.eid||0)-(a.eid||0));const ts=[...new Set(ev.map(e=>e.type).filter(Boolean))].sort();$('k').innerHTML='<option value="">All types</option>'+ts.map(t=>`<option>${t}</option>`).join('');draw()}
function draw(){const k=$('k').value,q=$('q').value.toLowerCase();Hub.setTitle($('y').value);
 const d=ev.filter(e=>(!k||e.type===k)&&(!q||String(e.text||'').toLowerCase().includes(q)));
 $('sub').textContent=$('y').value+' · '+d.length.toLocaleString('en-US')+' events'+(d.length>MAX?' (newest '+MAX+' shown)':'');
 o.innerHTML=d.slice(0,MAX).map(e=>`<div class="e"><small>${esc(e.type||'event')}${(e.tids||[]).length?' · '+e.tids.map(t=>teams[t]??t).join(', '):''}</small><div>${e.text?e.text.replace(/<[^>]*>/g,''):'<span class="mu">(no text; fields only)</span>'}</div></div>`).join('')||'<p>No events.</p>'}
$('y').onchange=load;$('k').onchange=$('q').oninput=draw;load()})()</script></body></html>
