<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Box score · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.sb .t{display:flex;flex-direction:column;align-items:center;gap:6px}.sb .s{font-size:clamp(40px,12vw,72px);font-weight:800;line-height:1}.sb .w{color:var(--c2)}.sb .l{opacity:.6}.bf{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;align-items:center;margin:12px 0;font-variant-numeric:tabular-nums}.bf .m{grid-column:1/3;display:flex;justify-content:space-between;align-items:baseline}.bf .a,.bf .h{height:12px;background:var(--bg3);border-radius:99px;overflow:hidden;display:flex}.bf .a{justify-content:flex-end}.bf i{display:block;height:100%}.bf b{font-size:15px}.bf .m span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}</style></head><body>
<main class="wrap"><div class="hero"><small>Box score</small><h1>Game</h1><p id="sub">Loading…</p></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),gid=+new URLSearchParams(location.search).get('gid');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const g=await HubDB.get('games',gid);if(!g||!g.teams||g.teams.length<2){o.innerHTML='<div class="card"><p>Game not found.</p><a class="btn ghost" href="schedule.html">Schedule</a></div>';$('sub').textContent='';return}
const teams=await HubDB.all('teams');Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t])),nm=t=>(T[t].region+' '+T[t].name).trim(),rows=await HubDB.box(gid),M=FBGMModels.run(await HubDB.all('games')),e=M.games.find(x=>x.gid===gid);
const Hm=g.teams[0],Aw=g.teams[1],col=t=>(T[t].colors||['#1b3a6b','#ffb81c']);
const names={};await Promise.all([...new Set(rows.map(r=>r.pid))].map(async id=>{const p=await HubDB.get('players',id);names[id]=p?((p.firstName||'')+' '+(p.lastName||'')).trim():''}));
const N=r=>`<a href="player.html?pid=${r.pid}">${names[r.pid]||r.name||'#'+r.pid}</a> <span class="mu">${r.pos||''}</span>`;
const sum=(tid,k)=>rows.filter(r=>r.tid===tid).reduce((a,r)=>a+(+r[k]||0),0);
const win=Hm.pts>Aw.pts?Hm.tid:Aw.pts>Hm.pts?Aw.tid:null;
$('sub').textContent='Season '+g.season+' · day '+(g.day??'')+(g.playoffs?' · playoffs':'');Hub.setTitle('Box score');document.querySelector('.hero small').textContent='Box score';
document.querySelector('.hero h1').innerHTML=nm(Aw.tid)+' at '+nm(Hm.tid);
const side=(x)=>`<div class="t">${Logo.t(x.tid,64)}<a href="team.html#${x.tid}"><b>${nm(x.tid)}</b></a></div>`;
let h=`<div class="card"><div class="sb">${side(Aw)}<div><span class="s ${win===Aw.tid?'w':win?'l':''}">${Aw.pts}</span> <span class="mu">–</span> <span class="s ${win===Hm.tid?'w':win?'l':''}">${Hm.pts}</span><div class="mu">FINAL</div></div>${side(Hm)}</div>`;
if(Array.isArray(Aw.ptsQtrs)&&Array.isArray(Hm.ptsQtrs)){const n=Math.max(Aw.ptsQtrs.length,Hm.ptsQtrs.length);h+=`<table style="margin-top:12px"><tr><th></th>${Array.from({length:n},(_,i)=>`<th class="n">${i<4?'Q'+(i+1):'OT'}</th>`).join('')}<th class="n">T</th></tr>${[Aw,Hm].map(x=>`<tr><td>${T[x.tid].abbrev}</td>${Array.from({length:n},(_,i)=>`<td class="n">${x.ptsQtrs[i]??''}</td>`).join('')}<td class="n"><b>${x.pts}</b></td></tr>`).join('')}</table>`}
if(e){const pa=1-e.p,right=(e.res===1&&e.p>.5)||(e.res===0&&e.p<.5);h+=`<p class="mu" style="margin-top:10px">Before kickoff the model gave ${T[Aw.tid].abbrev} ${(pa*100).toFixed(0)}% and ${T[Hm.tid].abbrev} ${(e.p*100).toFixed(0)}%${e.res===.5?'.':right?' — it called the winner.':' — an upset.'}</p>`}h+='</div>';
const ST=[['Passing yards',t=>sum(t,'pssYds')],['Rushing yards',t=>sum(t,'rusYds')],['Total yards',t=>sum(t,'pssYds')+sum(t,'rusYds')],['Touchdowns',t=>sum(t,'pssTD')+sum(t,'rusTD')],['Turnovers',t=>sum(t,'pssInt')+sum(t,'fmbLost')],['Sacks made',t=>sum(t,'defSk')],['Tackles',t=>sum(t,'defTck')]].map(([l,f])=>[l,f(Aw.tid),f(Hm.tid)]).filter(x=>x[1]||x[2]);
const ca=col(Aw.tid)[0],ch=col(Hm.tid)[0];
if(ST.length)h+=`<div class="card"><h2>Team comparison</h2>${ST.map(([l,a,b])=>{const t=a+b||1;return`<div class="bf"><div class="m"><b>${Math.round(a)}</b><span>${l}</span><b>${Math.round(b)}</b></div><div class="a"><i style="width:${a/t*100}%;background:${ca}"></i></div><div class="h"><i style="width:${b/t*100}%;background:${ch}"></i></div></div>`}).join('')}</div>`;
const TB=(tid)=>{const R=rows.filter(r=>r.tid===tid),sec=(title,cols,f,srt)=>{const L=R.filter(f).sort((a,b)=>(b[srt]||0)-(a[srt]||0));return L.length?`<h2 style="margin-top:14px">${title}</h2><table><tr><th>Player</th>${cols.map(c=>`<th class="n">${c[1]}</th>`).join('')}</tr>${L.map(r=>`<tr><td>${N(r)}</td>${cols.map(c=>`<td class="n">${r[c[0]]||0}</td>`).join('')}</tr>`).join('')}</table>`:''};
 return`<div class="card sc"><h2 style="color:var(--tx);display:flex;gap:10px;align-items:center">${Logo.t(tid,28)} ${nm(tid)}</h2>`+sec('Passing',[['pssCmp','Cmp'],['pss','Att'],['pssYds','Yds'],['pssTD','TD'],['pssInt','Int']],r=>r.pss||r.pssYds,'pssYds')+sec('Rushing',[['rus','Car'],['rusYds','Yds'],['rusTD','TD']],r=>r.rus||r.rusYds,'rusYds')+sec('Receiving',[['rec','Rec'],['recYds','Yds'],['recTD','TD']],r=>r.rec||r.recYds,'recYds')+sec('Defense',[['defTck','Tck'],['defSk','Sck'],['defInt','Int']],r=>r.defTck||r.defSk||r.defInt,'defTck')+'</div>'};
h+=`<div class="two">${TB(Aw.tid)}${TB(Hm.tid)}</div>`;if(!rows.length)h+='<div class="card"><p class="mu">No player stat lines stored for this game.</p></div>';o.innerHTML=h})()</script></body></html>
