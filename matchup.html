<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Matchup · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>
select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px}.vs .t b{font-size:clamp(16px,4vw,24px);line-height:1.1}.vs .x{font-size:28px;color:var(--mu);font-weight:800}
.wp{height:26px;border-radius:99px;overflow:hidden;display:flex;background:var(--bg3);margin:12px 0 4px}.wp i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;color:#000;transition:width .4s}
.cmp{display:grid;grid-template-columns:1fr 130px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #1e2b40}.cmp .m{text-align:center;color:var(--mu);font-size:12px}.cmp .a,.cmp .b{display:flex;align-items:center;gap:8px}.cmp .a{flex-direction:row-reverse}.cmp .bar{flex:1;height:8px;background:var(--bg3);border-radius:9px;overflow:hidden;display:flex}.cmp .a .bar{justify-content:flex-end}.cmp .bar i{display:block;height:100%}.cmp b{font-variant-numeric:tabular-nums;min-width:52px}.cmp .a b{text-align:right}.cmp .w{color:var(--ok)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}.pl{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e2b40;gap:8px}.pl small{color:var(--mu)}</style></head><body>
<main class="wrap"><div class="hero"><small>Team · Scouting</small><h1>Matchup</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="a">Team</label><select id="a"></select></div><div><label for="b">Opponent</label><select id="b"></select></div><div><label for="h">Where</label><select id="h"><option value="a">Team plays at home</option><option value="b">Opponent plays at home</option><option value="n">Neutral site</option></select></div></div><p style="margin:10px 0 0"><button class="btn ghost" id="sw">⇄ Swap teams</button></p></div>
<div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script><script src="elo.js"></script><script src="metrics.js"></script><script src="teamdash.js"></script><script src="rivals.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,M=FBGMMetrics,D=FBGMTeamDash,esc=V.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Matchup');
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t])),nm=t=>(T[t].region+' '+T[t].name).trim(),col=t=>(T[t].colors||[])[0]||'#0b6cff';
 const O=teams.map(t=>`<option value="${t.tid}">${nm(t.tid)}</option>`).join('');$('a').innerHTML=O;$('b').innerHTML=O;
 const sched=(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v).sort((x,y)=>(x.day||0)-(y.day||0)),nx=sched.find(m=>m.homeTid===s.userTid||m.awayTid===s.userTid);
 $('a').value=s.userTid;$('b').value=nx?(nx.homeTid===s.userTid?nx.awayTid:nx.homeTid):(teams.find(t=>t.tid!==s.userTid)||{}).tid;if(nx)$('h').value=nx.homeTid===s.userTid?'a':'b';
 const hs=new URLSearchParams(location.hash.slice(1));if(hs.has('a'))$('a').value=hs.get('a');if(hs.has('b'))$('b').value=hs.get('b');if(hs.has('h'))$('h').value=hs.get('h');
 const EL=await LeagueData.elo(),P=await LeagueData.players(),R=M.teamRows(teams,s.season,false,await LeagueData.ctx(s.season,false,{roster:true})),U=D.unitStrength(P,s.season),PR=FBGMRivals.pairs(await LeagueData.games());
 const PROF=['ppg','papg','ypp','nya','rya','tog','sc','tod','yd','ptd2','elo','top','age'];
 function draw(){const a=+$('a').value,b=+$('b').value,w=$('h').value;history.replaceState(0,'','#a='+a+'&b='+b+'&h='+w);
  if(a===b){$('out').innerHTML='<div class="card"><p class="mu">Pick two different teams.</p></div>';return}
  const ra=R.find(r=>r.id===a),rb=R.find(r=>r.id===b),ea=EL.rating[a]??1500,eb=EL.rating[b]??1500,H=w==='n'?0:EL.opts.H,pa=w==='b'?1-FBGMModels.P(eb,ea,H):FBGMModels.P(ea,eb,H),pct=(pa*100);
  const vs=PR[Math.min(a,b)+'-'+Math.max(a,b)],hv=vs?FBGMRivals.view(vs,a):null;
  $('sub').textContent=nm(a)+' against '+nm(b)+' · '+s.season;
  const rowsHTML=PROF.map(k=>{const m=M.TEAM_BY[k],x=ra&&ra.v[k],y=rb&&rb.v[k];if(x==null||y==null)return'';const hi=m.better!=='low',aw=m.better&&(hi?x>y:x<y),bw=m.better&&(hi?y>x:y<x),mx=Math.max(Math.abs(x),Math.abs(y),1e-9),qa=M.standing(R,k,a,m.better),qb=M.standing(R,k,b,m.better);
   return `<div class="cmp"><div class="a"><b class="${aw?'w':''}">${M.fmt(m,x)}</b><div class="bar"><i style="width:${Math.abs(x)/mx*100}%;background:${col(a)}"></i></div></div><div class="m">${esc(m.label)}<br><span style="font-size:10px">${qa?V.ord(qa.rank):''} · ${qb?V.ord(qb.rank):''}</span></div><div class="b"><div class="bar"><i style="width:${Math.abs(y)/mx*100}%;background:${col(b)}"></i></div><b class="${bw?'w':''}">${M.fmt(m,y)}</b></div></div>`}).join('');
  const ua=U[a],ub=U[b],unit=D.UNITS.map(([u])=>{const x=ua&&ua[u].v,y=ub&&ub[u].v;if(x==null||y==null)return'';return `<div class="cmp"><div class="a"><b class="${x>y?'w':''}">${x.toFixed(0)}</b><div class="bar"><i style="width:${x}%;background:${col(a)}"></i></div></div><div class="m">${u}<br><span style="font-size:10px">${ua[u].rank?V.ord(ua[u].rank):''} · ${ub[u].rank?V.ord(ub[u].rank):''}</span></div><div class="b"><div class="bar"><i style="width:${y}%;background:${col(b)}"></i></div><b class="${y>x?'w':''}">${y.toFixed(0)}</b></div></div>`}).join('');
  const key=t=>{const r=D.rosterOf(P,t,s.season);return['QB','RB','WR','TE','DL','LB','CB','S'].map(pos=>{const q=r.filter(x=>x.pos===pos).sort((x,y)=>(y.ovr||0)-(x.ovr||0))[0];return q?`<div class="pl"><span><a href="player.html?pid=${q.pid}">${esc(q.name)}</a> <small>${pos}</small>${q.hurt?' <span class="bad">✚</span>':''}</span><b>${q.ovr}</b></div>`:''}).join('')};
  const hurt=t=>D.rosterOf(P,t,s.season).filter(x=>x.hurt).sort((x,y)=>(y.ovr||0)-(x.ovr||0)).slice(0,5).map(x=>`<div class="pl"><span><a href="player.html?pid=${x.pid}">${esc(x.name)}</a> <small>${x.pos} ${x.ovr}</small></span><small>${esc(x.injury)}</small></div>`).join('')||'<p class="mu">No injuries.</p>';
  $('out').innerHTML=`<div class="card"><div class="vs"><div class="t">${Logo.t(a,80,s.season)}<b>${esc(nm(a))}</b><small class="mu">Elo ${ea.toFixed(0)}</small></div><div class="x">${w==='n'?'vs':w==='a'?'vs':'@'}</div><div class="t">${Logo.t(b,80,s.season)}<b>${esc(nm(b))}</b><small class="mu">Elo ${eb.toFixed(0)}</small></div></div><div class="wp"><i style="width:${pct}%;background:${col(a)};color:${Hub.ink(col(a))}">${pct.toFixed(0)}%</i><i style="width:${100-pct}%;background:${col(b)};color:${Hub.ink(col(b))}">${(100-pct).toFixed(0)}%</i></div><p class="mu" style="margin:0;text-align:center">Win chance from this app's own Elo model (${w==='n'?'neutral site':'home edge '+EL.opts.H+' points'}), not the game's.</p></div>
  <div class="card"><h2>Head to head, all seasons</h2>${hv?`<p style="margin:0"><b>${esc(nm(a))} ${hv.w}-${hv.l}${hv.t?'-'+hv.t:''}</b> in ${hv.g} games · points ${hv.pf}-${hv.pa} · average margin ${hv.close.toFixed(1)}${hv.po?' · '+hv.po+' in the playoffs':''}</p><p style="margin:6px 0 0">${hv.recent.map(r=>`<a href="game.html?gid=${r.gid}" class="chip ${r.res==='W'?'w':r.res==='L'?'l':''}">${r.season} ${r.res} ${r.pf}-${r.pa}</a>`).join('')}</p>`:'<p class="mu">They have not met in the stored games.</p>'}</div>
  <div class="card"><h2>Team statistics ${s.season} <span class="mu" style="font-size:11px;text-transform:none;letter-spacing:0">(ranks: team · opponent)</span></h2>${rowsHTML}</div>
  <div class="card"><h2>Strength by unit</h2>${unit}</div>
  <div class="two"><div class="card"><h2>${esc(nm(a))}: best at each position</h2>${key(a)}<h2 style="margin-top:14px">Injured</h2>${hurt(a)}</div><div class="card"><h2>${esc(nm(b))}: best at each position</h2>${key(b)}<h2 style="margin-top:14px">Injured</h2>${hurt(b)}</div></div>`}
 $('a').onchange=$('b').onchange=$('h').onchange=draw;$('sw').onclick=()=>{const t=$('a').value;$('a').value=$('b').value;$('b').value=t;if($('h').value!=='n')$('h').value=$('h').value==='a'?'b':'a';draw()};draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the matchup.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
