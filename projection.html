<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Projection · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.pb{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg3);min-width:120px}.pb i{background:var(--c2)}.pb b{background:var(--c1)}svg{width:100%;height:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>Models</small><h1>Season projection</h1><p id="sub">Loading…</p></div><div class="card"><select id="k"></select></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script>
<script>(async()=>{const o=document.getElementById('out'),k=document.getElementById('k');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams'),ga=((await HubDB.get('meta','gameAttributes'))||{}).v||{},M=FBGMModels.run(await HubDB.all('games')),rem=(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v);
const T=teams.map(t=>{const x=(t.seasons||[]).find(z=>z.season===s.season)||{};return{tid:t.tid,name:(t.region+' '+t.name).trim(),w:x.won||0,l:x.lost||0,t:x.tied||0,cid:x.cid??t.cid,did:x.did??t.did}}),cn=[...new Set(T.map(t=>t.cid))].length||1;
k.innerHTML=[4,5,6,7,8,10,12].map(n=>`<option value="${n}" ${n===Math.round(14/cn)?'selected':''}>Playoff spots per conference: ${n}</option>`).join('');
const pr=(h,a)=>FBGMModels.P(M.rating[h]??1500,M.rating[a]??1500,M.opts.H),pc=v=>(v*100).toFixed(0)+'%';
function draw(){const S=FBGMModels.simulate(T,rem,pr,3000,Math.random,+k.value),by=Object.fromEntries(S.map(x=>[x.tid,x]));Hub.setTitle(s.season);
 document.getElementById('sub').textContent=s.season+' · '+rem.length+' games left · 3,000 simulations';
 const conf=[...new Set(T.map(t=>t.cid))].sort();o.innerHTML=conf.map(c=>`<div class="card sc"><h2>Conference ${c}</h2><table><tr><th>Team</th><th class="n">Now</th><th class="n">Proj. wins</th><th class="n">Division</th><th class="n">Playoffs</th><th style="width:22%"></th></tr>${T.filter(t=>t.cid===c).sort((a,b)=>by[b.tid].top-by[a.tid].top||by[b.tid].ew-by[a.tid].ew).map(t=>`<tr class="${t.tid===s.userTid?'me':''}"><td>${t.name}</td><td class="n">${t.w}-${t.l}${t.t?'-'+t.t:''}</td><td class="n">${by[t.tid].ew.toFixed(1)}</td><td class="n">${pc(by[t.tid].div)}</td><td class="n"><b>${pc(by[t.tid].top)}</b></td><td><div class="bar"><i style="width:${by[t.tid].top*100}%"></i></div></td></tr>`).join('')}</table></div>`).join('')+'<p class="mu">Uses the Elo model of Predictions. Ties in wins are broken at random; the game\'s real tiebreakers are not applied, so close races are approximate.</p>'}
k.onchange=draw;draw()})()</script></body></html>
