document.querySelectorAll('#dset button').forEach(b=>b.onclick=()=>{st.d=b.dataset.v;st.c='s';st.sk='';st.x=st.d==='t'?'ppg':'ypa';st.yk=st.d==='t'?'papg':'pssTD';fillControls();draw()});
document.querySelectorAll('#ctype button').forEach(b=>b.onclick=()=>{st.c=b.dataset.v;fillControls();draw()});
$('pre').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;Object.assign(st,{sk:'',pos:''},PRE[st.d][+i][1]);st.c='s';fillControls();draw()};
const bind=(id,k)=>$(id).onchange=()=>{st[k]=$(id).value;draw()};[['pf','pf'],['tm2','tm2'],['tm3','tm3'],['cu','cu'],['y','y'],['po','po'],['x','x'],['yk','yk'],['sk','sk'],['tm','tm'],['pos','pos'],['gp','gp'],['nn','nn']].forEach(a=>bind(...a));

/* saved charts live in world data (synced by the cloud sync, kept across re-imports) */
const saved=()=>World.get('charts',[]);
function showSaved(){$('saved').innerHTML=saved().map((c,i)=>`<button data-i="${i}">★ ${V.esc(c.name)}</button><button data-d="${i}" title="Delete" style="border-style:solid;padding:0 10px">✕</button>`).join('')}
$('saved').onclick=e=>{const L=saved(),i=e.target.dataset.i,d=e.target.dataset.d;if(d!=null){L.splice(+d,1);World.set('charts',L);showSaved();return}if(i==null)return;const h=new URLSearchParams(L[+i].h);for(const k of Object.keys(st))if(h.has(k))st[k]=h.get(k);fillControls();draw()};
$('sv').onclick=()=>{const name=prompt('Name for this chart',(label(st.d==='t'?M.TEAM:M.PLAYER,st.yk).label+' vs '+label(st.d==='t'?M.TEAM:M.PLAYER,st.x).label).slice(0,50));if(!name)return;const L=saved();L.push({name,h:location.hash.slice(1)});World.set('charts',L);showSaved();$('msg').textContent='Saved. It is stored with your world data.'};
showSaved();
$('q').oninput=()=>st.c==='d'?draw():find();
$('sw').onclick=()=>{[st.x,st.yk]=[st.yk,st.x];fillControls();draw()};
$('png').onclick=async()=>{if(!chart){$('msg').textContent='Only the scatter chart can be saved as an image.';return}try{await V.savePng(chart.svgString(),'fbgm-chart-'+st.x+'-'+st.yk+'.png');$('msg').textContent='Saved. Markers are drawn as crests in the image.'}catch(e){$('msg').textContent=e.message}};
$('csv').onclick=()=>{const {rows,L}=cur;if(!rows||!rows.length)return;V.csv('fbgm-'+(st.d==='t'?'teams':'players')+'-'+st.y+'.csv',['Name',st.d==='t'?'Abbrev':'Pos'].concat(L.map(m=>m.label)),rows.map(r=>[r.name,r.abbrev||r.pos].concat(L.map(m=>r.v[m.k]==null?'':+r.v[m.k].toFixed(3)))));$('msg').textContent='Exported '+rows.length+' rows.'};
$('lk').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('msg').textContent='Link copied.'}catch(e){$('msg').textContent='Copy the address from the browser bar.'}}})()</script></body></html>
