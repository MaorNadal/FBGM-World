<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Awards · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.sc{overflow-x:auto}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.ln{display:flex;gap:10px;margin:8px 0;cursor:pointer}.ln.b{flex-direction:row-reverse}.ln i{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:var(--c1);border:2px solid var(--c2)}.ln span{background:var(--bg3);padding:8px 12px;border-radius:14px;max-width:80%}.ln.on span{background:var(--c1);outline:2px solid var(--c2)}.ln small{display:block;color:var(--mu);font-size:11px}</style></head><body>
<main class="wrap"><div class="hero"><small>Records</small><h1>Awards</h1><p id="sub">Loading…</p></div><div class="card"><select id="y"></select></div><div id="out"></div></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/player.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,t.abbrev||t.tid]));Hub.setTitle('Awards');$('sub').textContent='Loading…';
const P=await HubDB.scan('players',p=>(p.awards||[]).length),by={};
for(const p of P)for(const a of p.awards){const e=by[a.season]=by[a.season]||{};(e[a.type]=e[a.type]||[]).push(p)}
const ys=Object.keys(by).sort((a,b)=>b-a);$('y').innerHTML=ys.map(x=>`<option>${x}</option>`).join('');const nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim();
function draw(){const e=by[$('y').value]||{},ts=Object.keys(e).sort((a,b)=>(/mvp|most valuable/i.test(b)?1:0)-(/mvp|most valuable/i.test(a)?1:0)||e[a].length-e[b].length||a.localeCompare(b));$('sub').textContent=P.length.toLocaleString('en-US')+' players with awards · '+ys.length+' seasons';
 o.innerHTML=ts.length?ts.map(t=>`<div class="card"><h2>${t.replace(/</g,'&lt;')} <span class="mu">· ${e[t].length}</span></h2>${e[t].slice(0,40).map(p=>{const sr=FBGMPlayer.series(p),l=sr[sr.length-1]||{};return`<a href="player.html?pid=${p.pid}" class="chip" style="display:inline-block;background:var(--bg3);border-radius:99px;padding:4px 12px;margin:3px">${nm(p)} <span class="mu">${l.pos||''}</span></a>`}).join('')}</div>`).join(''):'<div class="card"><p>No awards stored for this season (field name: awards[].type, season).</p></div>'}
$('y').onchange=draw;draw()})()</script></body></html>
