<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Awards · FBGM Hub</title><link rel="stylesheet" href="hub.css"><link rel="stylesheet" href="awardui.css"><style>select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.aw-chips{display:flex;flex-wrap:wrap;gap:6px}.aw-chips a{background:var(--bg3);border-radius:99px;padding:3px 12px;font-size:13px}.aw-chips small{color:var(--mu)}details>summary{cursor:pointer;font-weight:700;margin:6px 0}</style></head><body>
<main class="wrap"><div class="hero"><small>Records</small><h1>Awards</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="y">Season</label><select id="y"></select></div></div><div class="aw-tabs" id="tb"><button data-k="s" class="on">Season</button><button data-k="a">All-time board</button></div></div>
<div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script><script src="awardui.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),AU=FBGMAwardUI,esc=Viz.esc;const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Awards');
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 o.innerHTML='<div class="card"><p class="mu">Reading all players…</p></div>';
 const ALL=await LeagueData.players(),P=ALL.filter(p=>(p.awards||[]).length),byId=Object.fromEntries(P.map(p=>[p.pid,p])),by={};
 for(const p of P)for(const a of p.awards){const e=by[a.season]=by[a.season]||{};(e[a.type]=e[a.type]||[]).push(p)}
 const ys=Object.keys(by).map(Number).sort((a,b)=>b-a);
 if(!ys.length){o.innerHTML='<div class="card"><p>No awards stored in this save (field name: awards[].type, season).</p></div>';$('sub').textContent='No awards';return}
 const hasMajor=y=>Object.keys(by[y]).some(t=>AU.classify(t).group==='major');const first=ys.find(hasMajor)||ys[0];
 $('y').innerHTML=ys.map(x=>`<option>${x}</option>`).join('');$('y').value=first;
 const hex=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:null,nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim()||('Player '+p.pid),FT={};
 const col=tid=>{const q=AU.palette((T[tid]||{}).colors);return `--k1:${q.k1};--k2:${q.k2}`};
 const info=(p,y)=>{const se=AU.season(p,y),r=AU.ratingAt(p,y)||{},tid=se.tid!=null?se.tid:p.tid;if(FT[p.pid]===undefined&&T[tid])FT[p.pid]=T[tid];return{tid,r,t:T[tid]||{}}};
 const stat=(p,y)=>AU.statLine(p,y).map(([v,l])=>`<span><b>${v}</b> ${esc(l)}</span>`).join('');
 const card=(p,type,y)=>{const c=AU.classify(type),I=info(p,y),n=AU.nth(p,type,y);
  return `<a class="aw-c" style="${col(I.tid)}" href="player.html?pid=${p.pid}">${nb(p,type,y)}<div class="aw-h">${AU.trophy(c.tier,30)}<span class="aw-ty">${esc(type)}</span></div><div class="aw-b"><span class="av aw-f" data-pid="${p.pid}"></span><div class="aw-n"><b>${esc(nm(p))}</b><small>${esc(I.r.pos||'')} · ${Logo.t(I.tid,16,y)} ${esc(I.t.abbrev||'')}</small></div>${I.r.ovr!=null?`<div class="aw-o">${I.r.ovr}<small>ovr</small></div>`:''}</div><div class="aw-s">${stat(p,y)}</div>${n>1?`<div class="aw-x">${AU.ord(n)} time winner</div>`:''}</a>`};
 const mini=(p,label,y,type)=>{const I=info(p,y);return `<a class="aw-m" style="${col(I.tid)}" href="player.html?pid=${p.pid}">${nb(p,type,y)}<span class="av aw-f" data-pid="${p.pid}"></span><b>${esc(nm(p))}</b><small>${esc(I.r.pos||'')} · ${esc(I.t.abbrev||'')}${I.r.ovr!=null?' · '+I.r.ovr:''}</small>${label?`<i>${esc(label)}</i>`:''}</a>`};
 const big=(p,type,y)=>{const I=info(p,y),c=AU.classify(type),n=AU.nth(p,type,y),mj=(p.awards||[]).filter(a=>AU.classify(a.type).group==='major').length;
  return `<a class="aw-big" style="${col(I.tid)};text-decoration:none" href="player.html?pid=${p.pid}">${AU.trophy(c.tier,64)}${nb(p,type,y).replace('aw-nb','aw-nb big')}<span class="av aw-bf" data-pid="${p.pid}"></span><div><small class="k">${y} · ${esc(type)}</small><h2>${esc(nm(p))}</h2><div style="margin:2px 0 10px">${esc(I.r.pos||'')} · ${Logo.t(I.tid,22,y)} ${esc((I.t.region||'')+' '+(I.t.name||''))}${I.r.ovr!=null?' · overall '+I.r.ovr:''}</div><div class="aw-s">${stat(p,y)}</div><div class="aw-x" style="margin-top:10px">${n>1?AU.ord(n)+' '+esc(type)+' · ':''}${mj} major award${mj===1?'':'s'} in his career</div></div></a>`};
 const nb=(p,type,y)=>{const n=type?AU.nth(p,type,y):0;return n>0?`<span class="aw-nb" title="${AU.ord(n)} time he won this">★ ${AU.ord(n)}</span>`:''};
 const faces=root=>Faces.lazy(root,pid=>(byId[pid]||{}).face,pid=>FT[pid]);
 function season(){const y=+$('y').value,e=by[y]||{},ty=Object.keys(e),G={major:[],allleague:[],allstar:[],leader:[],champ:[],other:[]};
  ty.forEach(t=>G[AU.classify(t).group].push(t));
  const majors=G.major.concat(G.allstar.filter(t=>/mvp/i.test(t))).sort((a,b)=>AU.majorOrder(a)-AU.majorOrder(b)||a.localeCompare(b)),
   spot=majors.find(t=>/^most valuable player$/i.test(t))||majors[0];
  $('sub').textContent=y+' · '+ty.length+' award types · '+ty.reduce((a,t)=>a+e[t].length,0).toLocaleString('en-US')+' honours';
  let h='';
  if(spot)h+=big(e[spot][0],spot,y)+(e[spot].length>1?'<p class="mu">Shared: '+e[spot].slice(1).map(p=>esc(nm(p))).join(', ')+'</p>':'');
  const rest=majors.filter(t=>!(t===spot)).concat(spot&&e[spot].length>1?[]:[]);
  const cards=[];majors.forEach(t=>e[t].forEach((p,i)=>{if(t===spot&&i===0)return;cards.push(card(p,t,y))}));
  if(cards.length)h+='<div class="card"><h2>Major awards</h2><div class="aw-grid">'+cards.join('')+'</div></div>';
  if(G.allleague.length){const T2=G.allleague.sort((a,b)=>(AU.classify(a).rookie?1:0)-(AU.classify(b).rookie?1:0)||AU.classify(a).rank-AU.classify(b).rank);
   h+='<div class="card"><h2>All-League teams</h2>'+T2.map(t=>{const L=e[t].slice().sort((a,b)=>AU.POS.indexOf((AU.ratingAt(a,y)||{}).pos)-AU.POS.indexOf((AU.ratingAt(b,y)||{}).pos)||nm(a).localeCompare(nm(b)));return `<div class="aw-lab">${AU.trophy(AU.classify(t).tier,18)} ${esc(t)} · ${L.length}</div><div class="aw-tm">${L.map(p=>mini(p,'',y,t)).join('')}</div>`}).join('')+'</div>'}
  if(G.leader.length)h+='<div class="card"><h2>League leaders</h2><div class="aw-tm">'+G.leader.sort().flatMap(t=>e[t].map(p=>mini(p,t.replace(/^League\s+/i,'').replace(/\s+Leader$/i,' leader'),y,t))).join('')+'</div></div>';
  const st=G.allstar.filter(t=>!/mvp/i.test(t));
  if(st.length)h+='<div class="card"><h2>All-Stars</h2><details><summary>'+st.reduce((a,t)=>a+e[t].length,0)+' players</summary><div class="aw-tm" style="margin-top:8px">'+st.flatMap(t=>e[t]).map(p=>mini(p,'',y)).join('')+'</div></details></div>';
  if(G.champ.length)h+='<div class="card"><h2>Champions roster</h2><details><summary>'+G.champ.reduce((a,t)=>a+e[t].length,0)+' players won the title</summary><div class="aw-tm" style="margin-top:8px">'+G.champ.flatMap(t=>e[t]).map(p=>mini(p,'',y)).join('')+'</div></details></div>';
  if(G.other.length)h+='<div class="card"><h2>Other honours</h2>'+G.other.map(t=>`<div class="aw-lab">${esc(t)} · ${e[t].length}</div><div class="aw-chips">${e[t].slice(0,60).map(p=>`<a href="player.html?pid=${p.pid}">${esc(nm(p))}</a>`).join('')}</div>`).join('')+'</div>';
  o.innerHTML=h||'<div class="card"><p>No awards stored for this season.</p></div>';faces(o)}
 function board(){const B=AU.board(P).slice(0,25),mx=Math.max(1,...B.map(b=>b.major));$('sub').textContent='All-time board · '+P.length.toLocaleString('en-US')+' players with awards';
  o.innerHTML='<div class="card"><h2>Most decorated players</h2><p class="mu" style="margin-top:0">Counted by major awards (MVP, Finals MVP, Player and Rookie of the Year); All-League selections break ties.</p><div class="aw-bd">'+B.map((b,i)=>{const p=byId[b.pid],I=info(p,s.season);return `<div class="aw-r" style="${col(p.tid)}"><span class="rk">${i+1}</span><span class="av aw-f" data-pid="${p.pid}"></span><span class="nm"><a href="player.html?pid=${p.pid}">${esc(nm(p))}</a><small>${b.mvp?b.mvp+' MVP · ':''}${b.allL} All-League · ${b.allS} All-Star · ${b.champ} title${b.champ===1?'':'s'}</small></span><span class="bar"><i style="width:${Math.max(6,b.major/mx*120)}px"></i><b>${b.major}</b></span></div>`}).join('')+'</div></div>';faces(o)}
 let mode='s';const go=()=>{$('y').disabled=mode==='a';mode==='s'?season():board()};
 $('y').onchange=go;$('tb').onclick=e=>{const k=e.target.dataset.k;if(!k)return;mode=k;$('tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));go()};go()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
