<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team history · FBGM Hub</title><link rel="stylesheet" href="hub.css"><link rel="stylesheet" href="awardui.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}select,input[type=search]{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}
.gold{color:#f4c542;font-weight:800}tr.ch td{background:linear-gradient(90deg,#f4c54224,transparent)}.hb{display:inline-block;border-radius:99px;padding:0 8px;font-size:11px;font-weight:800;margin-right:3px;white-space:nowrap}.hb.d{background:#27d17f33;color:var(--ok)}.hb.c{background:#8f6bff33;color:#b9a2ff}.hb.p{background:#ffb81c33;color:var(--c2)}.hb.g{background:#f4c542;color:#111}.hb.s{background:#b9c2d044;color:#dfe5ee}
.th-c{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}.th-c>div{background:var(--bg3);border-radius:14px;padding:12px;border-top:3px solid var(--c2);min-width:0}.th-c .k{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.th-c b{display:block;font-size:30px;line-height:1.1}.th-c em{display:block;font-style:normal;font-size:12px;color:var(--mu);margin-top:2px;overflow-wrap:anywhere}.th-c .gd b{color:#f4c542}
.th-r{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}.th-r details{--k1:#0b6cff;--k2:#ffb81c;background:linear-gradient(150deg,color-mix(in srgb,var(--k1) 60%,#0b1020),#0a0e19 80%);border:1px solid color-mix(in srgb,var(--k2) 45%,transparent);border-radius:16px;padding:12px;min-width:0}.th-r summary{cursor:pointer;list-style:none}.th-r summary::-webkit-details-marker{display:none}.th-r .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--k2);font-weight:800}.th-r .th-top{display:flex;align-items:center;gap:10px;margin-top:6px}.th-r .th-top .av{width:50px;height:66px;margin:0;border:2px solid var(--k2);border-radius:10px}.th-r .th-top b{display:block;font-size:15px;overflow-wrap:anywhere}.th-r .th-top .v{margin-left:auto;font:800 26px/1 system-ui;color:var(--k2)}.th-r ol{margin:10px 0 0;padding-left:22px;font-size:13px}.th-r li{display:flex;gap:8px;padding:2px 0}.th-r li a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.th-r li span{color:var(--k2);font-weight:700}
</style></head><body>
<main class="wrap"><div class="hero"><small>Team · History</small><h1 id="tn">History</h1><p id="sub">Loading…</p></div><div class="card"><label for="t">Team</label><select id="t"></select></div>
<div class="card"><h2>Trophy cabinet</h2><div class="th-c" id="cab"></div></div>
<div class="card sc"><h2>Season by season</h2><div id="out"></div></div>
<div class="card"><h2>Franchise record holders</h2><p class="mu" style="margin-top:0">Career totals with this team, regular season. Open a card for the top ten; names open the player page.</p><div class="th-r" id="rec"></div><p class="mu" style="margin-bottom:0">League-wide leaderboards: <a href="alltime.html" style="text-decoration:underline">All-time records</a>.</p></div>
<div class="card sc"><h2>Every player who played for the team</h2><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px"><input type="search" id="q" placeholder="Search a player" style="flex:1;min-width:180px" aria-label="Search a player"></div><div id="pl"></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="history.js"></script><script src="transform.js"></script><script src="tiebreak.js"></script><script src="honors.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script><script src="awardui.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),AU=FBGMAwardUI,esc=Viz.esc;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Team history');
try{const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),H=FBGMHistory.history(teams,s.season);Logo.init(teams);
 let HO={};try{const ga=((await HubDB.get('meta','gameAttributes'))||{}).v||{},A=FBGMTransform.attr,G=await LeagueData.games(),ys=[...new Set(G.filter(g=>!g.allStar&&!g.playoffs).map(g=>g.season))].sort((a,b)=>a-b);HO=Object.fromEntries(FBGMHonors.all(G,teams,ys,y=>({confs:A(ga.confs,y)||[],divs:A(ga.divs,y)||[],tiebreakers:A(ga.tiebreakers,y)}),s.phase<4?s.season:null).map(h=>[h.season,h]))}catch(e){console.error(e)}
 const champ=Object.fromEntries(H.seasons.filter(x=>x.champ).map(x=>[x.season,x.champ.tid]));/* TH-1: the final game decides the champion; the team-season field is only the fallback */for(const y in HO)if(HO[y].champion)champ[y]=HO[y].champion.tid;const TM=Object.fromEntries(teams.map(t=>[t.tid,t]));
 $('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${esc((t.region+' '+t.name).trim())}</option>`).join('');
 const h0=+location.hash.slice(1);$('t').value=TM[h0]?h0:(TM[s.userTid]?s.userTid:teams[0].tid);
 const lostFinal=(y,tid)=>HO[y]&&HO[y].champion&&HO[y].champion.opp===tid;
 const confP=(y,tid)=>HO[y]&&HO[y].champion&&HO[y].conf.some(c=>c.playoff&&c.playoff.tid===tid),confR=(y,tid)=>HO[y]&&HO[y].conf.some(c=>c.best&&c.best.tid===tid&&!(HO[y].current&&!HO[y].played)),divW=(y,tid)=>HO[y]&&HO[y].division.some(d=>d.tid===tid&&!(HO[y].current&&!HO[y].played));
 const hon=(y,tid)=>{const o=[];if(divW(y,tid))o.push('<span class="hb d">Division</span>');if(confR(y,tid))o.push('<span class="hb c">Conf. record</span>');if(confP(y,tid))o.push('<span class="hb p">Conference champion</span>');return o.join(' ')};
 let ALL=null;const loadP=async()=>ALL||(ALL=await LeagueData.players());
 const SK=[['pssYds','Passing yards'],['pssTD','Passing TD'],['rusYds','Rushing yards'],['rusTD','Rushing TD'],['rec','Receptions'],['recYds','Receiving yards'],['recTD','Receiving TD'],['defSk','Sacks'],['defInt','Interceptions'],['tck','Tackles'],['av','Approximate value'],['gp','Games']];
 const nmP=p=>((p.firstName||'')+' '+(p.lastName||'')).trim()||('Player '+p.pid);
 let tid=0,PL=[],plKey='av',plDir=-1,showAll=false;
 function mkPlayers(P,t){const out=[];for(const p of P){const r={pid:p.pid,p,name:nmP(p),g:0,gs:0,av:0,se:new Set(),ti:0,tot:{}};for(const x of (p.stats||[])){if(x.tid!==t||x.playoffs)continue;if(!(x.gp>0||x.av>0||x.gs>0))continue;r.se.add(x.season);r.g+=x.gp||0;r.gs+=x.gs||0;r.av+=x.av||0;for(const [k] of SK)if(k!=='tck'&&k!=='gp'&&k!=='av')r.tot[k]=(r.tot[k]||0)+(x[k]||0);r.tot.tck=(r.tot.tck||0)+(x.defTckSolo||0)+(x.defTckAst||0)||0}
   if(!r.se.size)continue;r.tot.gp=r.g;r.tot.av=r.av;r.first=Math.min(...r.se);r.last=Math.max(...r.se);r.ti=[...r.se].filter(y=>champ[y]===t).length;const rt=AU.ratingAt(p,r.last)||{};r.pos=rt.pos||'';r.aw=(p.awards||[]).filter(a=>AU.classify(a.type).group==='major').length;out.push(r)}return out}
 function drawPl(){const q=$('q').value.trim().toLowerCase(),key=plKey,L=PL.filter(r=>!q||r.name.toLowerCase().includes(q)).sort((a,b)=>plDir*((key==='name'?a.name.localeCompare(b.name):key==='first'?a.first-b.first:(key in a?a[key]:0)-(key in b?b[key]:0)))||b.av-a.av),shown=showAll||q?L:L.slice(0,100);
  const th=(k,l,n)=>`<th data-k="${k}" class="${n?'n':''}" style="cursor:pointer">${l}${k===plKey?(plDir<0?' ▼':' ▲'):''}</th>`;
  $('pl').innerHTML=`<table><tr>${th('name','Player')}<th>Pos</th>${th('first','Seasons')}${th('g','Games',1)}${th('gs','Starts',1)}${th('av','AV',1)}${th('ti','Titles with team',1)}${th('aw','Major awards',1)}</tr>`+shown.map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${esc(r.name)}</a>${r.p.hof?' ★':''}</td><td>${esc(r.pos)}</td><td>${r.first===r.last?r.first:r.first+'–'+r.last} <span class="mu">(${r.se.size})</span></td><td class="n">${r.g}</td><td class="n">${r.gs}</td><td class="n">${Math.round(r.av)}</td><td class="n">${r.ti?'<span class="gold">'+r.ti+'</span>':''}</td><td class="n">${r.aw||''}</td></tr>`).join('')+`</table><p class="mu">${L.length.toLocaleString('en-US')} players${!showAll&&!q&&L.length>100?' · first 100 shown · <a href="#" id="sa" style="text-decoration:underline">show all</a>':''}. A season counts when he has games, starts or AV for this team in the regular season.</p>`;
  $('pl').querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(plKey===k)plDir=-plDir;else{plKey=k;plDir=k==='name'||k==='first'?1:-1}drawPl()});const sa=$('sa');if(sa)sa.onclick=e=>{e.preventDefault();showAll=true;drawPl()}}
 function recs(t,T){const q=AU.palette(T.colors),face={};
  $('rec').innerHTML=SK.filter(([k])=>k!=='gp').map(([k,l])=>{const L=PL.filter(r=>(r.tot[k]||0)>0).sort((a,b)=>b.tot[k]-a.tot[k]).slice(0,10);if(!L.length)return'';const f=n=>k==='av'?Math.round(n):Math.round(n).toLocaleString('en-US');
   return `<details style="--k1:${q.k1};--k2:${q.k2}"><summary><span class="lab">${l}</span><div class="th-top"><span class="av" data-pid="${L[0].pid}"></span><div><b>${esc(L[0].name)}</b><small class="mu">${L[0].first}–${L[0].last}</small></div><span class="v">${f(L[0].tot[k])}</span></div></summary><ol>${L.map(r=>`<li><a href="player.html?pid=${r.pid}">${esc(r.name)}</a><span>${f(r.tot[k])}</span></li>`).join('')}</ol></details>`}).join('')||'<p class="mu">No player totals for this team.</p>';
  const m=Object.fromEntries(PL.map(r=>[r.pid,r.p]));Faces.lazy($('rec'),pid=>(m[pid]||{}).face,()=>T)}
 async function draw(){const T=TM[+$('t').value];tid=T.tid;history.replaceState(0,'','#'+tid);$('tn').innerHTML=Logo.html(T,60)+esc((T.region+' '+T.name).trim());
  if(T.colors){document.documentElement.style.setProperty('--c1',T.colors[0]);document.documentElement.style.setProperty('--c2',T.colors[1])}
  const f=H.franchises.find(x=>x.tid===tid),S=[...(T.seasons||[])].filter(x=>(x.won||0)+(x.lost||0)+(x.tied||0)>0).sort((a,b)=>b.season-a.season),yrs=S.map(x=>x.season);
  const tY=yrs.filter(y=>champ[y]===tid).sort((a,b)=>a-b),fY=yrs.filter(y=>lostFinal(y,tid)).sort((a,b)=>a-b),cpY=yrs.filter(y=>confP(y,tid)).sort((a,b)=>a-b),crY=yrs.filter(y=>confR(y,tid)).sort((a,b)=>a-b),dY=yrs.filter(y=>divW(y,tid)).sort((a,b)=>a-b);
  $('sub').textContent=f.seasons+' seasons · '+f.w+'-'+f.l+(f.t?'-'+f.t:'')+' · '+tY.length+' title'+(tY.length===1?'':'s')+' · '+f.po+' playoff trips';Hub.setTitle(T.abbrev||'');
  const cab=(k,tier,n,ys,gd)=>`<div class="${gd?'gd':''}"><span class="k">${AU.trophy(tier,20)} ${k}</span><b>${n}</b><em>${ys.length?ys.join(' · '):'–'}</em></div>`;
  $('cab').innerHTML=cab('Super Bowl titles','gold',tY.length,tY,1)+cab('Super Bowl losses','silver',fY.length,fY)+cab('Conference titles (playoffs)','gold',cpY.length,cpY)+cab('Conference titles (record)','silver',crY.length,crY)+cab('Division titles','bronze',dY.length,dY)+`<div><span class="k">${AU.trophy('blue',20)} Playoff trips</span><b>${f.po}</b><em>${f.w}-${f.l}${f.t?'-'+f.t:''} all-time</em></div>`;
  o.innerHTML='<table><tr><th>Season</th><th>Name</th><th class="n">W-L</th><th style="width:24%"></th><th>Result</th><th>Honours</th></tr>'+S.map(x=>{const g=(x.won||0)+(x.lost||0)+(x.tied||0),p=((x.won||0)+(x.tied||0)/2)/g,c=champ[x.season]===tid;return`<tr class="${c?'ch':''}"><td>${x.season}</td><td>${esc(((x.region||T.region)+' '+(x.name||T.name)).trim())}</td><td class="n">${x.won||0}-${x.lost||0}${x.tied?'-'+x.tied:''}</td><td><div class="bar"><i style="width:${p*100}%"></i></div></td><td>${c?'<span class="hb g">Super Bowl champions</span>':lostFinal(x.season,tid)?'<span class="hb s">Lost the Super Bowl</span>':x.playoffRoundsWon>=0?'Playoffs':''}</td><td>${hon(x.season,tid)}</td></tr>`}).join('')+'</table>';
  $('rec').innerHTML='<p class="mu">Reading players…</p>';$('pl').innerHTML='';
  const P=await loadP();if(tid!==TM[+$('t').value].tid)return;PL=mkPlayers(P,tid);recs(tid,T);showAll=false;drawPl()}
 $('t').onchange=draw;$('q').oninput=drawPl;await draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
