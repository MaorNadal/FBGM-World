<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team history · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.t{color:var(--c2);font-weight:700}.hb{display:inline-block;border-radius:99px;padding:0 8px;font-size:11px;font-weight:800;margin-right:3px;white-space:nowrap}.hb.d{background:#27d17f33;color:var(--ok)}.hb.c{background:#8f6bff33;color:#b9a2ff}.hb.p{background:#ffb81c33;color:var(--c2)}</style></head><body>
<main class="wrap"><div class="hero"><small>Team · History</small><h1 id="tn">History</h1><p id="sub">Loading…</p></div><div class="card"><select id="t"></select></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="history.js"></script><script src="transform.js"></script><script src="tiebreak.js"></script><script src="honors.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),H=FBGMHistory.history(teams,s.season);let HO={};try{const ga=((await HubDB.get('meta','gameAttributes'))||{}).v||{},A=FBGMTransform.attr,G=await HubDB.all('games'),ys=[...new Set(G.filter(g=>!g.allStar&&!g.playoffs).map(g=>g.season))].sort((a,b)=>a-b);HO=Object.fromEntries(FBGMHonors.all(G,teams,ys,y=>({confs:A(ga.confs,y)||[],divs:A(ga.divs,y)||[],tiebreakers:A(ga.tiebreakers,y)}),s.phase<4?s.season:null).map(h=>[h.season,h]))}catch(e){console.error(e)}
const champ=Object.fromEntries(H.seasons.filter(x=>x.champ).map(x=>[x.season,x.champ.tid]));
$('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');$('t').value=location.hash.slice(1)||s.userTid;
const hon=(y,tid)=>{const h=HO[y];if(!h)return'';const o=[];if(h.division.some(d=>d.tid===tid))o.push('<span class="hb d">Division</span>');if(h.conf.some(c=>c.best&&c.best.tid===tid))o.push('<span class="hb c">Conf. record</span>');if(h.champion&&h.conf.some(c=>c.playoff&&c.playoff.tid===tid))o.push('<span class="hb p">Conf. playoffs</span>');return o.join(' ')};
function draw(){const t=teams.find(x=>x.tid==$('t').value),f=H.franchises.find(x=>x.tid===t.tid);history.replaceState(0,'','#'+t.tid);$('tn').innerHTML=Logo.html(t,60)+(t.region+' '+t.name).trim();
 if(t.colors){document.documentElement.style.setProperty('--c1',t.colors[0]);document.documentElement.style.setProperty('--c2',t.colors[1])}
 $('sub').textContent=f.seasons+' seasons · '+f.w+'-'+f.l+(f.t?'-'+f.t:'')+' · '+f.titles+' titles · '+f.po+' playoff trips';Hub.setTitle(t.abbrev||'');
 const S=[...(t.seasons||[])].filter(x=>(x.won||0)+(x.lost||0)+(x.tied||0)>0).sort((a,b)=>b.season-a.season);
 o.innerHTML='<table><tr><th>Season</th><th>Name</th><th class="n">W-L</th><th style="width:28%"></th><th>Result</th><th>Honours</th></tr>'+S.map(x=>{const g=(x.won||0)+(x.lost||0)+(x.tied||0),p=((x.won||0)+(x.tied||0)/2)/g;return`<tr><td>${x.season}</td><td>${((x.region||t.region)+' '+(x.name||t.name)).trim()}</td><td class="n">${x.won||0}-${x.lost||0}${x.tied?'-'+x.tied:''}</td><td><div class="bar"><i style="width:${p*100}%"></i></div></td><td class="${champ[x.season]===t.tid?'t':''}">${champ[x.season]===t.tid?'Super Bowl champions':x.playoffRoundsWon>=0?'Playoffs':''}</td><td>${hon(x.season,t.tid)}</td></tr>`}).join('')+'</table>'}
$('t').onchange=draw;draw()})()</script></body></html>
