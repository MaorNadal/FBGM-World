<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Players · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}th{cursor:pointer;white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}.inj{color:var(--bad)}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Player search</h1><p id="sub">Loading…</p></div>
<div class="card f"><select id="g"><option value="-1">Free agents</option><option value="-2">Draft prospects</option><option value="-3">Retired</option><option value="t">Team…</option></select><select id="t" hidden></select><select id="p"><option value="">All positions</option></select><input id="q" type="text" placeholder="Search name"></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script><script src="faces.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));
$('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');$('t').value=s.userTid;
let rows=[],key='ovr',dir=-1;const C=[['name','Player'],['pos','Pos'],['age','Age'],['ovr','Ovr'],['pot','Pot'],['amount','Contract'],['exp','Exp'],['injury','Injury']],MAX=300;
function draw(){const q=$('q').value.toLowerCase(),p=$('p').value;let d=rows.filter(r=>(!p||r.pos===p)&&(!q||r.name.toLowerCase().includes(q)));
 d.sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'||typeof y==='string'?String(x).localeCompare(String(y)):(x==null)-(y==null)||x-y)*dir});const n=d.length;d=d.slice(0,MAX);
 $('sub').textContent=s.season+' · '+n+' players'+(n>MAX?' (top '+MAX+' shown, refine the search)':'');
 o.innerHTML='<table><tr>'+C.map(([k,l])=>`<th data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+d.map(r=>`<tr><td><span class="av" data-pid="${r.pid}"></span><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${r.pos}</td><td class="n">${r.age??''}</td><td class="n"><b>${r.ovr??''}</b></td><td class="n">${r.pot??''}</td><td class="n">${r.amount==null?'':(r.amount/1000).toFixed(2)+'M'}</td><td class="n">${r.exp??''}</td><td class="inj">${r.injury}</td></tr>`).join('')+'</table>';
 o.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(k==='name'||k==='pos'?1:-1);key=k;draw()});Faces.lazy(o,pid=>(rows.find(r=>r.pid==pid)||{}).face)}
async function load(){$('t').hidden=$('g').value!=='t';const tid=$('g').value==='t'?+$('t').value:+$('g').value;$('sub').textContent='Loading…';
 rows=FBGMRoster.roster(await HubDB.idx('players','tid',tid),tid,s.season);const ps=[...new Set(rows.map(r=>r.pos))].filter(Boolean).sort();$('p').innerHTML='<option value="">All positions</option>'+ps.map(x=>`<option>${x}</option>`).join('');draw()}
$('g').onchange=$('t').onchange=load;$('p').onchange=$('q').oninput=draw;load()})()</script></body></html>
