<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diagnostics · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg3);padding:12px;border-radius:10px;max-height:340px;overflow:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>Tools</small><h1>Diagnostics</h1><p>Checks that the pages understand your save. Structure only; send the report to Claude to fix any mismatch.</p></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="diag.js"></script>
<script>(async()=>{const o=document.getElementById('out'),s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const pl=await HubDB.idx('players','tid',s.userTid),player=pl.find(p=>(p.stats||[]).length>1&&(p.awards||[]).length)||pl.find(p=>(p.stats||[]).length)||pl[0],team=await HubDB.get('teams',s.userTid),
 box=(await HubDB.idx('box','season',s.season-1))[0]||(await HubDB.idx('box','season',s.season))[0],game=(await HubDB.idx('games','season',s.season-1))[0],ga=(await HubDB.get('meta','gameAttributes')||{}).v,mi=await HubDB.all('misc'),sched=(mi.find(r=>r.src==='schedule')||{}).v,pick=(mi.find(r=>r.src==='draftPicks')||{}).v;let event;try{event=(await HubDB.idx('events','season',s.season-1))[0]}catch(e){}
const S={player,team,box,game,ga,event,sched,pick},R=FBGMDiag.run(S),neg={};for(const t of [-1,-2,-3])neg[t]=(await HubDB.idx('players','tid',t)).length;
const AG=FBGMDiag.teamAge(await HubDB.scan('players',p=>p.tid>=0),await HubDB.all('teams'),s.season);
const rep=JSON.stringify({checks:R.map(r=>[r.page,r.what,r.ok?'OK':'MISSING '+r.missing.join(','),r.optional.length?'not in sample: '+r.optional.join(','):'']),negativeTeamIds:neg,summary:{season:s.season,phase:s.phase,userTid:s.userTid},teamAge:AG,samples:{player:FBGMDiag.trim(player),team:FBGMDiag.trim(team),box,game:FBGMDiag.trim(game),event:FBGMDiag.trim(event),schedule:sched,draftPick:pick,gameAttributesKeys:ga?Object.keys(ga):[]}},null,1);
o.innerHTML=`<div class="card"><h2>Team age check</h2>${AG.key?`<p class="mu">The save stores the team average age under <b>${AG.key}</b>. Mean difference per team (lower is better):</p><table>${AG.candidates.map((c,i)=>`<tr><td>${c.name}</td><td>${c.mae==null?'n/a':c.mae.toFixed(2)+' years'}</td><td class="ok">${i===0&&c.mae!=null?'BEST MATCH':''}</td></tr>`).join('')}</table>`:'<p class="bad">No average-age number found in the team seasons of the save.</p>'}<p class="${AG.missingBorn?'bad':'mu'}">Players without a birth year: ${AG.missingBorn}${AG.missingBorn?' (their ages cannot be shown)':''}.</p></div><div class="card"><h2>Field checks</h2><table><tr><th>Page</th><th>Assumption</th><th></th></tr>${R.map(r=>`<tr><td>${r.page}</td><td>${r.what}</td><td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'MISSING: '+r.missing.join(', ')}${r.optional.length?` <small class="mu">(not in sample: ${r.optional.join(', ')})</small>`:''}</td></tr>`).join('')}</table><p class="mu">Players without a team: free agents ${neg[-1]}, prospects ${neg[-2]}, retired ${neg[-3]}.</p></div><div class="card"><h2>Report</h2><button class="btn" id="c">Copy report</button> <span class="mu" id="m"></span><pre id="r"></pre></div>`;
document.getElementById('r').textContent=rep;document.getElementById('c').onclick=async()=>{try{await navigator.clipboard.writeText(rep);m.textContent='Copied.'}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('r'));getSelection().removeAllRanges();getSelection().addRange(r);m.textContent='Select and copy manually.'}}})()</script></body></html>
