<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diagnostics · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg3);padding:12px;border-radius:10px;max-height:340px;overflow:auto}.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.st{display:inline-block;min-width:60px;text-align:center;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:800}.st.ok{background:#27d17f33}.st.bad{background:#ff546833}.st.wn{background:#ffb81c33;color:var(--c2)}</style></head><body>
<main class="wrap"><div class="hero"><small>Tools</small><h1>Diagnostics</h1><p id="sub">Checking…</p></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="transform.js"></script><script src="diag.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sub=document.getElementById('sub'),esc=x=>String(x==null?'':x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),n=x=>Number(x).toLocaleString('en-US');
/* every step is isolated: one failing check never blanks the page, it is listed as an error */
const errs=[],R={};async function step(name,f){try{return R[name]=await f()}catch(e){errs.push(name+': '+(e&&e.message||e));console.error(name,e);return undefined}}
const show=()=>{if(errs.length)o.insertAdjacentHTML('afterbegin','<div class="card" style="border-left:4px solid var(--bad)"><h2>Steps that failed</h2>'+errs.map(e=>'<p class="bad">'+esc(e)+'</p>').join('')+'<p class="mu">The rest of the page still works. Send this list to Claude.</p></div>')};
const s=await step('summary',()=>HubDB.summary());
if(!s){o.innerHTML='<div class="card"><p>No league imported on this device yet, or the stored database could not be opened.'+(errs.length?'</p><p class="bad">'+esc(errs.join(' | ')):'')+'</p><a class="btn" href="import.html">Import league file</a></div>';sub.textContent='No league';return}
const stores=await step('stores',()=>HubDB.stores())||[],counts={};for(const k of stores)counts[k]=await step('count '+k,()=>HubDB.count(k));
const teams=await step('teams',()=>HubDB.all('teams'))||[],ga=await step('settings',async()=>((await HubDB.get('meta','gameAttributes'))||{}).v)||{};
const pl=await step('players of your team',()=>HubDB.idx('players','tid',s.userTid))||[],player=pl.find(p=>(p.stats||[]).length>1&&(p.awards||[]).length)||pl.find(p=>(p.stats||[]).length)||pl[0],team=teams.find(t=>t.tid===s.userTid)||teams[0];
const box=await step('box row',async()=>{const R=(await HubDB.idx('box','season',s.season-1)).slice(0,3000).concat((await HubDB.idx('box','season',s.season)).slice(0,3000));/* a defender's row has no yards stat; sample a row that has one, so the Leaders check is not a false alarm */return R.find(r=>r.pssYds!=null||r.rusYds!=null||r.recYds!=null)||R[0]});
const games=await step('games',()=>HubDB.all('games'))||[],game=games.find(g=>g.season===s.season-1&&!g.allStar)||games[0];
const mi=await step('misc',()=>HubDB.all('misc'))||[],sched=(mi.find(r=>r.src==='schedule')||{}).v,pick=(mi.find(r=>r.src==='draftPicks')||{}).v;
const event=await step('event',async()=>(await HubDB.idx('events','season',s.season-1))[0]);
const checks=await step('field checks',()=>FBGMDiag.run({player,team,box,game,ga,event,sched,pick}))||[];
const neg={};for(const t of [-1,-2,-3])neg[t]=(await step('team id '+t,()=>HubDB.idx('players','tid',t))||[]).length;
const age=await step('team age',async()=>FBGMDiag.teamAge(await HubDB.scan('players',p=>p.tid>=0),teams,s.season));
/* all-star games: ids from the all-star records against the games flagged on read (DR-1) */
const as=await step('all-star games',async()=>{const ids=[...await HubDB.allStarIds()],fl=games.filter(g=>g.allStar);const odd=fl.filter(g=>!ids.includes(g.gid)).length;const inPo=fl.filter(g=>g.playoffs).length;return{ids:ids.length,flagged:fl.length,viaTeamIds:odd,flaggedPlayoff:inPo,seasons:[...new Set(fl.map(g=>g.season))].length}});
/* games per season: regular season, playoffs, all-star, against the team count */
const per=await step('games per season',async()=>{const by={};for(const g of games){const y=by[g.season]=by[g.season]||{season:g.season,reg:0,po:0,as:0,t:new Set()};if(g.allStar)y.as++;else if(g.playoffs)y.po++;else{y.reg++;(g.teams||[]).forEach(t=>y.t.add(t.tid))}}return Object.values(by).sort((a,b)=>a.season-b.season).map(y=>({season:y.season,teams:y.t.size,reg:y.reg,po:y.po,as:y.as,exp:(+FBGMTransform.attr(ga.numGames,y.season)||19)*y.t.size/2}))})||[];
const types=await step('event types',async()=>{const m={};for(const e of (await HubDB.idx('events','season',s.season)).concat(await HubDB.idx('events','season',s.season-1)))m[e.type||'(none)']=(m[e.type||'(none)']||0)+1;return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,25)})||[];
const dep=team&&team.depth&&typeof team.depth==='object'?Object.entries(team.depth).map(([k,v])=>k+':'+(Array.isArray(v)?v.length:'?')).join(' '):'none';
const bad=checks.filter(r=>!r.ok).length,ok=checks.length-bad;
sub.textContent=s.season+' · '+ok+' of '+checks.length+' field checks OK'+(errs.length?' · '+errs.length+' step(s) failed':'');
const rep=JSON.stringify({summary:{league:s.leagueName,season:s.season,phase:s.phase,userTid:s.userTid,importedAt:new Date(s.importedAt).toISOString()},storeCounts:counts,checks:checks.map(r=>[r.page,r.what,r.ok?'OK':'MISSING '+r.missing.join(','),r.optional.length?'not in sample: '+r.optional.join(','):'']),negativeTeamIds:neg,allStar:as,depthChartOfYourTeam:dep,gamesPerSeason:per.map(y=>[y.season,y.teams,y.reg,y.exp,y.po,y.as]),eventTypes:types,failedSteps:errs,teamAge:age,samples:{player:FBGMDiag.trim(player),team:FBGMDiag.trim(team),box,game:FBGMDiag.trim(game),event:FBGMDiag.trim(event),schedule:sched,draftPick:pick,gameAttributesKeys:Object.keys(ga)}},null,1);
const row=(a,b,c)=>`<tr><td>${a}</td><td class="n">${b}</td><td>${c||''}</td></tr>`;
o.innerHTML=`<div class="grid"><div class="tile"><b>${ok}/${checks.length}</b><span>Field checks OK</span></div><div class="tile"><b>${Object.keys(counts).length}</b><span>Stores</span></div><div class="tile"><b>${as?as.flagged:'–'}</b><span>All-star games flagged</span></div><div class="tile"><b>${errs.length}</b><span>Steps failed</span></div></div>
<div class="card sc"><h2>Stored data</h2><table><tr><th>Store</th><th class="n">Records</th></tr>${Object.entries(counts).map(([k,v])=>row(k,v==null?'?':n(v))).join('')}</table><p class="mu">Free agents ${neg[-1]}, prospects ${neg[-2]}, retired ${neg[-3]} (players without a team). Depth chart of your team: ${esc(dep)}.</p></div>
<div class="card sc"><h2>All-star games (rule DR-1)</h2>${as?`<table>${row('Ids in the all-star records',as.ids)}${row('Games flagged all-star on read',as.flagged,as.flagged&&as.flagged===as.ids?'<span class="st ok">equal</span>':'<span class="st wn">differs</span>')}${row('Flagged only by negative team ids',as.viaTeamIds)}${row('Flagged and also marked playoff',as.flaggedPlayoff,as.flaggedPlayoff?'<span class="st wn">check</span>':'')}</table><p class="mu">All-star games are excluded from standings, team totals, schedules, Elo and brackets. If the two first rows differ, send this page's report to Claude.</p>`:'<p class="bad">Could not be checked.</p>'}</div>
<div class="card sc"><h2>Games per season</h2><table><tr><th>Season</th><th class="n">Teams</th><th class="n">Regular</th><th class="n">Expected</th><th class="n">Playoff</th><th class="n">All-star</th><th></th></tr>${per.map(y=>`<tr><td>${y.season}</td><td class="n">${y.teams}</td><td class="n">${y.reg}</td><td class="n">${y.exp}</td><td class="n">${y.po}</td><td class="n">${y.as}</td><td>${y.reg===y.exp?'<span class="st ok">ok</span>':y.season===s.season?'<span class="st wn">in progress</span>':'<span class="st bad">check</span>'}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Team age check</h2>${age&&age.key?`<p class="mu">The save stores the team average age under <b>${esc(age.key)}</b>. Mean difference per team (lower is better):</p><table>${age.candidates.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${c.mae==null?'n/a':c.mae.toFixed(2)+' years'}</td><td class="ok">${i===0&&c.mae!=null?'BEST MATCH':''}</td></tr>`).join('')}</table>`:'<p class="bad">No average-age number found in the team seasons of the save.</p>'}<p class="${age&&age.missingBorn?'bad':'mu'}">Players without a birth year: ${age?age.missingBorn:'?'}.</p></div>
<div class="card sc"><h2>Field checks</h2><table><tr><th>Page</th><th>Assumption</th><th></th></tr>${checks.map(r=>`<tr><td>${esc(r.page)}</td><td>${esc(r.what)}</td><td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'MISSING: '+esc(r.missing.join(', '))}${r.optional.length?` <small class="mu">(not in sample: ${esc(r.optional.join(', '))})</small>`:''}</td></tr>`).join('')}</table></div>
<div class="card sc"><h2>Event types (this and last season)</h2><table>${types.map(([k,v])=>row(esc(k),n(v))).join('')||'<tr><td>None</td></tr>'}</table></div>
<div class="card"><h2>Report</h2><button class="btn" id="c">Copy report</button> <button class="btn ghost" id="d">Download .json</button> <span class="mu" id="m"></span><pre id="r"></pre></div>`;
show();document.getElementById('r').textContent=rep;
document.getElementById('c').onclick=async()=>{const m=document.getElementById('m');try{await navigator.clipboard.writeText(rep);m.textContent='Copied.'}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('r'));getSelection().removeAllRanges();getSelection().addRange(r);m.textContent='Select and copy manually.'}};
document.getElementById('d').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rep],{type:'application/json'}));a.download='fbgm-hub-diagnostics.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}})().catch(e=>{document.getElementById('out').innerHTML='<div class="card" style="border-left:4px solid var(--bad)"><h2>Diagnostics crashed</h2><p class="bad">'+String(e&&e.message||e)+'</p></div>'})</script></body></html>
