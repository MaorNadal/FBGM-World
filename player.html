<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Player · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}svg{width:100%;height:auto;display:block}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:var(--bg3);border-radius:99px;padding:4px 12px}</style></head><body>
<main class="wrap"><div class="hero" style="min-height:150px"><style>#nm,#sub,#pos{padding-right:118px}</style><small id="pos">Player</small><h1 id="nm">Player</h1><p id="sub">Loading…</p><div class="fc" id="fc"></div></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="player.js"></script><script src="faces.js"></script><script src="world.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="careers.js"></script><script src="viz.js"></script>
<script>(async()=>{const o=document.getElementById('out'),$=i=>document.getElementById(i),pid=+new URLSearchParams(location.search).get('pid');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const p=await HubDB.get('players',pid);if(!p){o.innerHTML='<div class="card"><p>Player not found.</p><a class="btn ghost" href="players.html">Back to players</a></div>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,(t.region+' '+t.name).trim()])),nm=((p.firstName||'')+' '+(p.lastName||'')).trim(),ser=FBGMPlayer.series(p),last=ser[ser.length-1]||{};
const where=p.tid>=0?teams[p.tid]:({'-1':'Free agent','-2':'Draft prospect','-3':'Retired'}[p.tid]||'');
$('nm').textContent=nm;$('pos').textContent=(last.pos||'')+(p.jerseyNumber?' · #'+p.jerseyNumber:'');$('sub').textContent=where+(p.born&&p.born.year!=null?' · age '+(s.season-p.born.year):'')+(p.hof?' · Hall of Fame':'');Hub.setTitle(nm);Faces.draw($('fc'),p.face);
function chart(){if(ser.length<2)return'';const W=640,H=220,P=34,x0=ser[0].season,x1=ser[ser.length-1].season,xs=v=>P+(x1===x0?0:(v-x0)/(x1-x0))*(W-2*P),ys=v=>H-P-(v/100)*(H-2*P),path=k=>ser.map((r,i)=>(i?'L':'M')+xs(r.season).toFixed(1)+','+ys(r[k]).toFixed(1)).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating history">${[0,25,50,75,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${ys(v)}" y2="${ys(v)}" stroke="#223049"/><text x="4" y="${ys(v)+4}" fill="#8ea0b8" font-size="11">${v}</text>`).join('')}<path d="${path('pot')}" fill="none" stroke="#8ea0b8" stroke-dasharray="5 4" stroke-width="2"/><path d="${path('ovr')}" fill="none" stroke="var(--c2)" stroke-width="3"/>${ser.map(r=>`<circle cx="${xs(r.season)}" cy="${ys(r.ovr)}" r="3.5" fill="var(--c2)"><title>${r.season}: ovr ${r.ovr}, pot ${r.pot}</title></circle>`).join('')}<text x="${P}" y="${H-8}" fill="#8ea0b8" font-size="11">${x0}</text><text x="${W-P-28}" y="${H-8}" fill="#8ea0b8" font-size="11">${x1}</text></svg><p class="mu">Solid: overall · dashed: potential</p>`}
function radarChart(){const R=FBGMPlayer.radar(p);if(R.length<3)return'';const W=300,H=250,cx=150,cy=125,r=86,n=R.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r*v/100,cy+Math.sin(a)*r*v/100]};
 const ring=v=>R.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' '),poly=R.map((x,i)=>pt(i,Math.max(2,x.v)).map(y=>y.toFixed(1)).join(',')).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ratings profile" style="max-width:420px;margin:auto;display:block">${[25,50,75,100].map(v=>`<polygon points="${ring(v)}" fill="none" stroke="#223049"/>`).join('')}${R.map((x,i)=>{const[a,b]=pt(i,100),[lx,ly]=pt(i,122);return`<line x1="${cx}" y1="${cy}" x2="${a}" y2="${b}" stroke="#223049"/><text x="${lx}" y="${ly+4}" fill="#8ea0b8" font-size="10" text-anchor="middle">${x.label}</text>`}).join('')}<polygon points="${poly}" fill="var(--c2)" fill-opacity=".28" stroke="var(--c2)" stroke-width="2.5"/>${R.map((x,i)=>{const[a,b]=pt(i,Math.max(2,x.v));return`<circle cx="${a}" cy="${b}" r="4" fill="var(--c2)"><title>${x.label}: ${x.v}</title></circle>`}).join('')}</svg>`}
function table(po){const c=FBGMPlayer.career(p,po);if(!c.rows.length)return'';const th=c.cols.map(([,l])=>`<th class="n">${l}</th>`).join('');
 return`<div class="card sc"><h2>${po?'Playoff':'Regular season'} stats</h2><table><tr><th>Season</th><th>Team</th>${th}</tr>${c.rows.map(r=>`<tr><td>${r.season}</td><td>${(teams[r.tid]||'').split(' ').pop()}</td>${c.cols.map(([k])=>`<td class="n">${r[k]||0}</td>`).join('')}</tr>`).join('')}<tr><th>Career</th><th></th>${c.cols.map(([k])=>`<th class="n">${c.tot[k]}</th>`).join('')}</tr></table></div>`}
const aw=FBGMPlayer.awards(p),d=p.draft||{};
const addWatch=()=>{o.insertAdjacentHTML('afterbegin',`<div class="card"><button class="btn ghost" id="wb"></button><textarea id="nt" rows="2" placeholder="Your note on this player" style="width:100%;margin-top:10px;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:10px;font:inherit"></textarea></div>`);
 const b=$('wb'),t=$('nt');const sh=()=>b.textContent=World.isWatched(pid)?'★ On your watch list':'☆ Add to watch list';sh();t.value=World.note(pid);
 b.onclick=()=>{World.toggle(pid);sh()};t.onchange=()=>World.setNote(pid,t.value)};
o.innerHTML=`<div class="grid"><div class="tile"><b>${last.ovr??'—'}</b><span>Overall</span></div><div class="tile"><b>${last.pot??'—'}</b><span>Potential</span></div><div class="tile"><b>${p.contract?(p.contract.amount/1000).toFixed(2)+'M':'—'}</b><span>${p.contract?'Contract to '+p.contract.exp:'Contract'}</span></div><div class="tile"><b>${d.year?d.year+' R'+d.round+' #'+d.pick:'Undrafted'}</b><span>Draft</span></div></div>`+(radarChart()?`<div class="card"><h2>Ratings profile</h2>${radarChart()}</div>`:'')+(ser.length>1?`<div class="card"><h2>Rating history</h2>${chart()}</div>`:'')+table(false)+table(true)+(aw.length?`<div class="card"><h2>Awards</h2><div class="chips">${aw.map(([t,n])=>`<span>${t}${n>1?' ×'+n:''}</span>`).join('')}</div></div>`:'');addWatch();
{const tnm=t=>teams[t]||'';const st=document.querySelector('.grid');if(st)st.insertAdjacentHTML('afterend',`<div class="card"><h2>Career story</h2>${FBGMCareers.story(p,tnm,s.season).map(x=>'<p style="margin:6px 0">'+x.replace(/</g,'&lt;')+'</p>').join('')}<p class="mu" style="margin-bottom:0">Written from the stored records by templates.</p></div>`)}
(async()=>{try{const P=await LeagueData.players(),T=FBGMCareers.twins(P,FBGMMetrics.slim(p),{n:5});if(!T.twins.length)return;const byId=Object.fromEntries(P.map(q=>[q.pid,q])),nmq=q=>((q.firstName||'')+' '+(q.lastName||'')).trim(),pj=T.project,yr=s.season;
 o.insertAdjacentHTML('beforeend',`<div class="card sc"><h2>Player twins</h2><p class="mu" style="margin-top:0">Players at the same position whose ratings at the same ages were closest to his (age ${T.age}, rating ${T.ovr}), and what happened to them next.</p><table><tr><th>Twin</th><th class="n">Gap</th><th class="n">Same age</th><th class="n">+1</th><th class="n">+2</th><th class="n">+3</th><th class="n">Peak</th></tr>${T.twins.map(t=>`<tr><td><a href="player.html?pid=${t.p.pid}">${nmq(byId[t.p.pid]||t.p)}</a> <span class="mu">${t.p.born?t.p.born.year:''}</span></td><td class="n">${t.dist.toFixed(1)}</td><td class="n">${t.now}</td>${[1,2,3].map(d=>`<td class="n">${t.next[d]==null?'':t.next[d]}</td>`).join('')}<td class="n"><b>${t.peak}</b></td></tr>`).join('')}</table>${pj?`<p><b>Projection from the twins:</b> ${[1,2,3].filter(d=>pj[d]).map(d=>`${yr+d}: about ${Math.round(pj[d].ovr)} (${pj[d].delta>=0?'+':''}${pj[d].delta.toFixed(1)}, from ${pj[d].n} twins)`).join(' · ')}</p><p class="mu">An estimate from a handful of similar careers, not a prediction of the game's own development.</p>`:'<p class="mu">The twins are too young or too few to project.</p>'}</div>`)}catch(e){console.error(e)}})();

(async()=>{try{const st=(p.stats||[]).filter(x=>!x.playoffs&&(x.gp||0)>0).map(x=>x.season);if(!st.length)return;const y=Math.max(...st),pos=(ser.filter(r=>r.season<=y).pop()||{}).pos,M=FBGMMetrics,V=Viz;if(!pos)return;
 const KEYS={QB:['pssYds','pssTD','cmp','ypa','rtg','fp'],RB:['rusYds','rusTD','ypc','rec','recYds','fp'],WR:['rec','recYds','recTD','ypr','scrim','fp'],TE:['rec','recYds','recTD','ypr','scrim','av'],DL:['tck','sk','dint','av'],LB:['tck','sk','dint','av'],CB:['tck','dint','sk','av'],S:['tck','dint','sk','av'],OL:['av','ovr'],K:['ovr'],P:['ovr']}[pos]||['av','ovr'];
 const all=await LeagueData.players(),rows=M.playerRows(all,y,false,{pos}),pool=rows.filter(r=>r.gp>=4||r.pid===pid),me=pool.find(r=>r.pid===pid);if(!me||pool.length<5)return;
 const S=KEYS.map(k=>{const m=M.PLAYER_BY[k],q=M.standing(pool,k,pid,m.better);return q&&me.v[k]!=null?{k,m,q,v:me.v[k]}:null}).filter(Boolean);if(S.length<3&&S.length<KEYS.length)return;
 o.insertAdjacentHTML('beforeend',`<div class="card"><h2>${y} compared with ${pos}s (${pool.length} with 4+ games)</h2><div id="pr"></div><div id="pb"></div><p class="mu" style="text-align:center">Percentile among the ${pos}s of the season: the outer ring is the best in the league.</p></div>`);
 V.radar(document.getElementById('pr'),S.map(x=>x.m.label.replace(' percentage',' %').replace('Fantasy points (standard)','Fantasy pts').replace('Approximate value','AV').replace('Overall rating','Overall')),[{id:pid,label:nm,color:'#ffb81c',values:S.map(x=>x.q.pct),raw:S.map(x=>M.fmt(x.m,x.v))}],{title:'Percentiles'});
 document.getElementById('pb').innerHTML=S.map(x=>`<div class="vcr" style="grid-template-columns:1fr 90px auto 70px"><span>${x.m.label}</span><div class="vcbar"><u style="width:${Math.max(3,x.q.pct)}%;background:${x.q.pct>=67?'var(--ok)':x.q.pct>=34?'var(--c2)':'var(--bad)'}"></u></div><b>${M.fmt(x.m,x.v)}</b><em>${V.ord(x.q.rank)} of ${x.q.of}</em></div>`).join('')}catch(e){console.error(e)}})();
(async()=>{try{const B=(await HubDB.idx('box','pid',pid)).filter(r=>r.gid!=null);if(!B.length)return;const TT=await HubDB.all('teams');Logo.init(TT);const ab=Object.fromEntries(TT.map(t=>[t.tid,t.abbrev||t.tid]));
 const cols=FBGMPlayer.COLS.filter(c=>c[0]!=='gp'&&B.some(r=>r[c[0]])),seasons=[...new Set(B.map(r=>r.season))].sort((a,b)=>b-a),G={};
 const hi=cols.map(([k,l])=>{let b=null;for(const r of B){if(r.playoffs||!r[k])continue;if(!b||r[k]>b[k])b=r}return b?`<a class="chip" href="game.html?gid=${b.gid}">${l} <b>${b[k]}</b> <span class="mu">${b.season} vs ${ab[b.opp]??''}</span></a>`:''}).join('');
 o.insertAdjacentHTML('beforeend',(hi?`<div class="card"><h2>Career highs in a game</h2><div>${hi}</div></div>`:'')+`<div class="card sc" id="gl"><h2>Game log</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px"><select id="gy">${seasons.map(y=>`<option>${y}</option>`).join('')}</select><select id="gp"><option value="0">Regular season</option><option value="1">Playoffs</option></select></div><div id="glt"></div></div>`);
 async function gl(){const y=+$('gy').value,po=$('gp').value==='1';if(!G[y])G[y]=Object.fromEntries((await HubDB.idx('games','season',y)).map(g=>[g.gid,g]));
  const R=B.filter(r=>r.season===y&&!!r.playoffs===po&&!(G[y][r.gid]&&G[y][r.gid].allStar)).map(r=>({r,g:G[y][r.gid]||{}})).sort((a,b)=>(a.g.day||0)-(b.g.day||0)||a.r.gid-b.r.gid);
  const use=cols.filter(([k])=>R.some(x=>x.r[k]));
  $('glt').innerHTML=R.length?`<table><tr><th>Day</th><th>Opp</th><th>Result</th>${use.map(([,l])=>`<th class="n">${l}</th>`).join('')}</tr>${R.map(({r,g})=>{const i=(g.teams||[]).findIndex(t=>t.tid===r.tid),me=g.teams&&g.teams[i],op=g.teams&&g.teams[1-i],res=me&&op?(me.pts>op.pts?'W':me.pts<op.pts?'L':'T')+' '+me.pts+'-'+op.pts:'';return`<tr><td>${g.day??''}</td><td>${Logo.t(r.opp,18)} ${i===0?'vs':'@'} ${ab[r.opp]??''}</td><td class="${res[0]==='W'?'ok':res[0]==='L'?'bad':''}"><a href="game.html?gid=${r.gid}">${res||'box score'}</a></td>${use.map(([k])=>`<td class="n">${r[k]||0}</td>`).join('')}</tr>`}).join('')}<tr><th colspan="3">Total · ${R.length} games</th>${use.map(([k])=>`<th class="n">${R.reduce((a,x)=>a+(+x.r[k]||0),0)}</th>`).join('')}</tr></table>`:'<p class="mu">No games for this choice.</p>'}
 $('gy').onchange=$('gp').onchange=gl;gl()}catch(e){console.error(e)}})()
})()</script></body></html>
