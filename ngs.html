<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Next Gen Stats · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}th[data-k]{cursor:pointer;white-space:nowrap}tr.me{background:#ffffff12}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.cell{position:relative}.cell i{position:absolute;left:0;bottom:0;height:3px;background:var(--c2);opacity:.8}.gr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}.sm{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.sm h3{margin:0 0 4px;font-size:14px}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1 id="h1">Next Gen Stats</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="seg" id="tabs"><button data-v="e">Drive efficiency</button><button data-v="p">Percentile cards</button><button data-v="t">Trends</button></div>
<div class="ctl" style="margin-top:12px"><div id="wy"><label for="y">Season</label><select id="y"></select></div><div id="wt"><label for="tm">Team</label><select id="tm"></select></div></div>
<p class="mu" style="margin-bottom:0">Metrics built from the drive data stored in the save: how often a drive scores, how it starts, how long it lasts. Every number is computed from stored counters; ranks are among the teams of the season.</p></div>
<div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="world.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,M=FBGMMetrics,esc=V.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const nameN=World.get('ngsname','Next Gen Stats');$('h1').textContent=nameN;document.title=nameN+' · FBGM Hub';Hub.setTitle(nameN);
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 const ys=[...new Set(teams.flatMap(t=>(t.seasons||[]).map(x=>x.season)))].sort((a,b)=>b-a);$('y').innerHTML=ys.map(v=>`<option>${v}</option>`).join('');$('tm').innerHTML=teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');$('tm').value=s.userTid;
 let tab='e',key='ptd2',dir=-1;const DK=['drg','sc','tod','start','tpd','pld','yd','ptd2'];
 const h=new URLSearchParams(location.hash.slice(1));if(h.has('tab'))tab=h.get('tab');if(h.has('tm'))$('tm').value=h.get('tm');if(h.has('y'))$('y').value=h.get('y');
 const rows=async y=>M.teamRows(teams,y,false,await LeagueData.ctx(y,false,{roster:y===s.season}));
 async function draw(){const y=+$('y').value,tid=+$('tm').value;history.replaceState(0,'','#tab='+tab+'&y='+y+'&tm='+tid);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));$('wy').hidden=tab==='t';$('wt').hidden=tab==='e';
  try{const R=await rows(y);
  if(tab==='e'){const DM=DK.map(k=>M.TEAM_BY[k]);
   $('out').innerHTML='<div class="card"><h2>Yards per drive against points per drive</h2><div id="scp"></div><p class="mu">Teams that move the ball further and also score more per drive are on the right and up. Tap a logo for the card.</p></div><div class="card sc" id="tb"></div>';
   const pts=R.filter(r=>r.v.yd!=null&&r.v.ptd2!=null).map(r=>({id:r.id,x:r.v.yd,y:r.v.ptd2,label:r.name,color:(T[r.tid].colors||[])[0],row:r}));
   V.scatter($("scp"),{points:pts,xl:'Yards per drive',yl:'Points per drive',size:34,quad:{tr:'Efficient and productive',bl:'Stalling'},marker:(p,z)=>Logo.t(p.row.tid,z,y),crest:p=>Logo.crest(T[p.row.tid],40),title:'Drive efficiency',
    card:p=>{const r=p.row,t=T[r.tid],c=t.colors||[];return V.card({title:r.name,sub:y+' · drives',c1:c[0],c2:c[1],logo:Logo.t(r.tid,40,y),big:[{label:'Yards / drive',value:M.fmt(M.TEAM_BY.yd,r.v.yd),rank:M.standing(R,'yd',r.id).rank,of:R.length},{label:'Points / drive',value:M.fmt(M.TEAM_BY.ptd2,r.v.ptd2),rank:M.standing(R,'ptd2',r.id).rank,of:R.length}],rows:['sc','tod','start'].map(k=>{const m=M.TEAM_BY[k],q=M.standing(R,k,r.id,m.better);return{label:m.label,value:M.fmt(m,r.v[k]),rank:q&&q.rank,pct:q&&q.pct}}),href:'team.html#'+r.tid,hrefLabel:'Team page'})}});
   const L=[...R].filter(r=>r.v[key]!=null).sort((a,b)=>(a.v[key]-b.v[key])*(dir<0?-1:1)),rk=Object.fromEntries(DK.map(k=>[k,{}]));DK.forEach(k=>R.filter(r=>r.v[k]!=null).forEach(r=>rk[k][r.id]=M.standing(R,k,r.id,M.TEAM_BY[k].better)));
   $('tb').innerHTML='<table><tr><th>#</th><th>Team</th>'+DM.map(m=>`<th class="n" data-k="${m.k}" title="${esc(m.desc||m.label)}">${esc(m.label.replace(' (TD per drive)','').replace('Average ','').replace('Minutes per drive','Min / drive'))}${m.k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+L.map((r,i)=>`<tr class="${r.tid===s.userTid?'me':''}"><td class="mu">${i+1}</td><td>${Logo.t(r.tid,20,y)} <a href="team.html#${r.tid}">${esc(r.name)}</a></td>${DK.map(k=>{const q=rk[k][r.id],m=M.TEAM_BY[k];return`<td class="n cell">${M.fmt(m,r.v[k])}${q?`<i style="width:${q.pct.toFixed(0)}%"></i>`:''}</td>`}).join('')}</tr>`).join('')+'</table><p class="mu">The bar under each number is its percentile among the teams. Click a heading to sort.</p><p><button class="btn ghost" id="cv">Export CSV</button></p>';
   $('tb').querySelectorAll('th[data-k]').forEach(x=>x.onclick=()=>{const k=x.dataset.k;dir=k===key?-dir:(M.TEAM_BY[k].better==='low'?1:-1);key=k;draw()});
   $('cv').onclick=()=>V.csv('drive-efficiency-'+y+'.csv',['Team'].concat(DM.map(m=>m.label)),L.map(r=>[r.name].concat(DK.map(k=>r.v[k]==null?'':+r.v[k].toFixed(3)))))}
  else if(tab==='p'){const me=R.find(r=>r.id===tid);if(!me){$('out').innerHTML='<div class="card"><p class="mu">No data for this team in '+y+'.</p></div>';return}
   const G={};M.TEAM.forEach(m=>{if(M.NOW_ONLY.has(m.k)&&y!==s.season)return;(G[m.group]=G[m.group]||[]).push(m)});
   $('out').innerHTML=`<div class="card"><h2 style="display:flex;gap:10px;align-items:center">${Logo.t(tid,32,y)} <span style="color:var(--tx)">${esc(me.name)} · ${y}</span></h2><p class="mu">Percentile among ${R.length} teams: the longer and greener the bar, the better. For statistics where lower is better the scale is turned around.</p></div><div class="gr">`+Object.keys(G).map(g=>`<div class="card"><h2>${g}</h2>`+G[g].map(m=>{const q=M.standing(R,m.k,tid,m.better);return me.v[m.k]==null?'':`<div class="vcr" style="grid-template-columns:1fr 90px auto 34px"><span title="${esc(m.desc||'')}">${esc(m.label)}</span><div class="vcbar"><u style="width:${q?Math.max(3,q.pct):0}%;background:${q&&q.pct>=67?'var(--ok)':q&&q.pct>=34?'var(--c2)':'var(--bad)'}"></u></div><b>${M.fmt(m,me.v[m.k])}</b><em>${q?V.ord(q.rank):''}</em></div>`}).join('')+'</div>').join('')+'</div>'}
  else{const seasons=[...ys].reverse(),KEYS=['ptd2','yd','sc','tod','start','tpd'],all={};for(const sn of seasons){const RR=await rows(sn);for(const r of RR)for(const k of KEYS)if(r.v[k]!=null)(all[k]=all[k]||{})[r.id]=(all[k][r.id]||[]).concat([[sn,r.v[k]]])}
   $('out').innerHTML=`<div class="card"><h2 style="display:flex;gap:10px;align-items:center">${Logo.t(tid,32)} <span style="color:var(--tx)">${esc(nm(tid))} drive metrics by season</span></h2><p class="mu">Highlighted: this team. Grey: the other teams.</p></div><div class="sm">${KEYS.map(k=>`<div class="card"><h3>${esc(M.TEAM_BY[k].label)}</h3><div id="ln-${k}"></div></div>`).join('')}</div>`;
   KEYS.forEach(k=>{const m=M.TEAM_BY[k];V.lines($('ln-'+k),teams.map(t=>({id:t.tid,label:(t.region+' '+t.name).trim(),short:t.abbrev,c1:(t.colors||[])[0],pts:(all[k]||{})[t.tid]||[]})),{hl:tid,fmt:v=>M.fmt(Object.assign({},m,{d:Math.min(2,m.d)}),v),title:m.label})})}
  $('sub').textContent=tab==='t'?'Seasons '+ys[ys.length-1]+' to '+ys[0]:y+' · '+R.length+' teams';
  }catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the view.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}}
 const nm=t=>T[t]?(T[t].region+' '+T[t].name).trim():'';
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;draw()});$('y').onchange=$('tm').onchange=draw;draw()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not read the league.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
