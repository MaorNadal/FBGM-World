<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>League timeline · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>
.tl{position:relative;margin-left:14px;padding-left:22px;border-left:3px solid var(--c1)}.ev{position:relative;margin:0 0 14px;padding:12px 14px;background:var(--bg2);border:1px solid #1e2b40;border-radius:14px}.ev:before{content:"";position:absolute;left:-33px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--c2);border:3px solid var(--bg)}.ev.cur:before{background:#fff}
.ev h3{margin:0 0 6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.ev h3 b{font-size:26px;line-height:1}.ev .ch{display:flex;gap:10px;align-items:center;margin:6px 0}.ev .ch b{font-size:18px}.tg{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:2px 4px 2px 0}.tg.ex{background:#27d17f33;color:var(--ok)}.tg.rm{background:#ff546833;color:var(--bad)}.tg.rn{background:#ffb81c26;color:var(--c2)}.tg.tm{background:var(--bg3);color:var(--mu)}
.steps{display:flex;align-items:flex-end;gap:3px;height:90px;margin:6px 0 2px}.steps i{flex:1;background:linear-gradient(0deg,var(--c1),color-mix(in srgb,var(--c1) 50%,#fff));border-radius:4px 4px 0 0;position:relative;min-width:6px}.steps i:hover{background:var(--c2)}.steps i span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>League timeline</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Number of teams by season</h2><div class="steps" id="st"></div><p class="mu" id="sn"></p></div><div class="tl" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="rivals.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz,esc=V.esc;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Timeline');
try{const teams=await HubDB.all('teams');Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t])),nm=t=>T[t]?(T[t].region+' '+T[t].name).trim():'Team '+t,I=FBGMRivals.seasonsInfo(teams,await HubDB.all('games'),s.season);
 const mx=Math.max(...I.map(x=>x.teams));$('st').innerHTML=I.map(x=>`<i style="height:${x.teams/mx*100}%" title="${x.season}: ${x.teams} teams"><span>${x.teams}</span></i>`).join('');
 const ch=I.filter((x,i)=>i&&x.teams!==I[i-1].teams).map(x=>x.season+': '+I[I.indexOf(x)-1].teams+' → '+x.teams);$('sn').textContent=I.length+' seasons from '+I[0].season+' to '+I[I.length-1].season+(ch.length?' · size changes: '+ch.join(', '):'');
 $('sub').textContent=I.length+' seasons · '+I.filter(x=>x.champion).length+' champions · '+I.reduce((a,x)=>a+x.renamed.length,0)+' renames or relocations';
 $('out').innerHTML=I.slice().reverse().map(x=>{const c=x.champion;return `<div class="ev ${x.current?'cur':''}"><h3><b>${x.season}</b><span class="mu">${x.teams} teams${x.current?' · in progress':''}</span></h3>${c?`<div class="ch">${Logo.t(c.tid,40,x.season)}<div><small class="mu">CHAMPIONS</small><br><b>${esc(nm(c.tid))}</b> <a class="mu" href="game.html?gid=${c.gid}" style="text-decoration:underline">${c.score[0]}–${c.score[1]} over ${esc(nm(c.opp))}</a></div></div>`:x.current?'<p class="mu" style="margin:4px 0">Champion not decided yet.</p>':''}${x.best?`<p style="margin:4px 0" class="mu">Best record: ${Logo.t(x.best.tid,18,x.season)} ${esc(x.best.name)} ${x.best.w}-${x.best.l}${x.best.t?'-'+x.best.t:''}</p>`:''}<div>${x.added.length?`<span class="tg ex">${x.added.length} new team${x.added.length>1?'s':''}</span>`+x.added.map(t=>`<span class="tg tm">${esc(nm(t))}</span>`).join(''):''}${x.removed.length?`<span class="tg rm">${x.removed.length} left</span>`+x.removed.map(t=>`<span class="tg tm">${esc(nm(t))}</span>`).join(''):''}${x.renamed.map(r=>`<span class="tg rn">renamed</span><span class="tg tm">${esc(r.from)} → ${esc(r.to)}</span>`).join('')}</div></div>`}).join('')
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the timeline.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
