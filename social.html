<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Social · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Media</small><h1>Social feed</h1><p id="sub">Loading…</p></div><div class="card f"><select id="y"></select><select id="d"></select></div><div id="out"></div><p class="mu">Posts are written by templates from the real results of the day. No AI is used here yet; the model's upset call is the Elo model of Predictions.</p></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/elo.js"></script><script src="assets/js/social.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams'),nm=Object.fromEntries(teams.map(t=>[t.tid,(t.region+' '+t.name).trim()])),ab=Object.fromEntries(teams.map(t=>[t.tid,t.abbrev||t.tid])),col=Object.fromEntries(teams.map(t=>[t.tid,t.colors||['#1b3a6b','#ffb81c']])),M=FBGMModels.run(await HubDB.all('games'));
$('y').innerHTML=Object.keys(s.seasonGames||{}).sort((a,b)=>b-a).map(x=>`<option>${x}</option>`).join('');
function days(){const ds=[...new Set(M.games.filter(g=>g.season===+$('y').value).map(g=>g.day))].sort((a,b)=>b-a);$('d').innerHTML=ds.map(x=>`<option>${x}</option>`).join('')}
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),k={upset:'UPSET',blowout:'BLOWOUT',close:'CLOSE',streak:'STREAK',final:''};
function draw(){const P=FBGMSocial.feed(M.games,+$('y').value,+$('d').value,nm,ab);Hub.setTitle('Social');$('sub').textContent=$('y').value+' · day '+$('d').value+' · '+P.length+' posts';
 const mix=[...P].sort((a,b)=>(b.kind!=='final')-(a.kind!=='final')||a.gid-b.gid);
 o.innerHTML=mix.map(p=>{const c=p.who>=0?col[p.who]:['#243247','#8ea0b8'];return`<div class="card" style="display:flex;gap:12px"><div style="flex:none;width:44px;height:44px;border-radius:50%;color:${Hub.ink(c[0])};background:${c[0]};border:2px solid ${c[1]};display:grid;place-items:center;font-weight:800;font-size:12px">${esc(p.who>=0?ab[p.who]:'LW')}</div><div><b>${esc(p.who>=0?nm[p.who]:'League Wire')}</b> <span class="mu">${esc(p.handle)}</span>${k[p.kind]?` <small style="color:var(--c2);letter-spacing:.1em">${k[p.kind]}</small>`:''}<div>${esc(p.text)}</div></div></div>`}).join('')||'<div class="card"><p>No games on this day.</p></div>'}
$('y').onchange=()=>{days();draw()};$('d').onchange=draw;days();draw()})()</script></body></html>
