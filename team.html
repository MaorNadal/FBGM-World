<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team · FBGM Hub</title><link rel="stylesheet" href="assets/css/hub.css"><style>.sc{overflow-x:auto}th{cursor:pointer;white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}.inj{color:var(--bad)}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Team · Roster</small><h1 id="tn">Roster</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Team</h2><select id="ts"></select></div><div class="card sc" id="out"></div></main>
<script src="assets/js/nav.js"></script><script src="assets/js/db.js"></script><script src="assets/js/roster.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sel=document.getElementById('ts');const s=await HubDB.summary();
if(!s){o.innerHTML='<p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),nm=t=>(t.region+' '+t.name).trim();
sel.innerHTML=teams.map(t=>`<option value="${t.tid}">${nm(t)}</option>`).join('');sel.value=location.hash.slice(1)||s.userTid;
let rows=[],key='ovr',dir=-1;const C=[['name','Player'],['pos','Pos'],['age','Age'],['ovr','Ovr'],['pot','Pot'],['amount','Contract'],['exp','Exp'],['injury','Injury']];
function draw(){const d=[...rows].sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'||typeof y==='string'?String(x).localeCompare(String(y)):(x==null)-(y==null)||x-y)*dir});
 o.innerHTML='<table><tr>'+C.map(([k,l])=>`<th data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+d.map(r=>`<tr><td><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${r.pos}</td><td class="n">${r.age??''}</td><td class="n"><b>${r.ovr??''}</b></td><td class="n">${r.pot??''}</td><td class="n">${r.amount==null?'':(r.amount/1000).toFixed(2)+'M'}</td><td class="n">${r.exp??''}</td><td class="inj">${r.injury}</td></tr>`).join('')+'</table>';
 o.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(k==='name'||k==='pos'?1:-1);key=k;draw()})}
async function load(){const t=teams.find(x=>x.tid==sel.value);history.replaceState(0,'','#'+sel.value);document.getElementById('tn').textContent=nm(t);if(t.colors){document.documentElement.style.setProperty('--c1',t.colors[0]);document.documentElement.style.setProperty('--c2',t.colors[1])}
 rows=FBGMRoster.roster(await HubDB.idx('players','tid',+sel.value),+sel.value,s.season);document.getElementById('sub').textContent=s.season+' · '+rows.length+' players';Hub.setTitle(t.abbrev||'');draw()}
sel.onchange=load;load()})()</script></body></html>
