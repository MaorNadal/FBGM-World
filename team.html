<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Team · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}th{cursor:pointer;white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}.inj{color:var(--bad)}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Team · Roster</small><h1 id="tn">Roster</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Team</h2><select id="ts"></select></div><div class="card" id="viz"></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="roster.js"></script><script src="faces.js"></script>
<script>(async()=>{const o=document.getElementById('out'),sel=document.getElementById('ts');const s=await HubDB.summary();
if(!s){o.innerHTML='<p>No league imported yet.</p><a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),nm=t=>(t.region+' '+t.name).trim();
sel.innerHTML=teams.map(t=>`<option value="${t.tid}">${nm(t)}</option>`).join('');sel.value=location.hash.slice(1)||s.userTid;
let rows=[],key='ovr',dir=-1;const C=[['name','Player'],['pos','Pos'],['age','Age'],['ovr','Ovr'],['pot','Pot'],['amount','Contract'],['exp','Exp'],['injury','Injury']];
function draw(){const d=[...rows].sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'||typeof y==='string'?String(x).localeCompare(String(y)):(x==null)-(y==null)||x-y)*dir});
 o.innerHTML='<table><tr>'+C.map(([k,l])=>`<th data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+d.map(r=>`<tr><td><span class="av" data-pid="${r.pid}"></span><a href="player.html?pid=${r.pid}">${r.name}</a></td><td>${r.pos}</td><td class="n">${r.age??''}</td><td class="n"><b>${r.ovr??''}</b></td><td class="n">${r.pot??''}</td><td class="n">${r.amount==null?'':(r.amount/1000).toFixed(2)+'M'}</td><td class="n">${r.exp??''}</td><td class="inj">${r.injury}</td></tr>`).join('')+'</table>';
 o.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(k==='name'||k==='pos'?1:-1);key=k;draw()});Faces.lazy(o,pid=>(rows.find(r=>r.pid==pid)||{}).face)}
const GR={QB:'QB',RB:'Skill',WR:'Skill',TE:'Skill',OL:'Offensive line',DL:'Front seven',LB:'Front seven',CB:'Secondary',S:'Secondary',K:'Special teams',P:'Special teams'},GC={'QB':'#ffd35a','Skill':'#4fd1ff','Offensive line':'#9b8cff','Front seven':'#ff7a59','Secondary':'#5be3a0','Special teams':'#c7d0de'},GN={QB:1,Skill:5,'Offensive line':5,'Front seven':7,Secondary:4,'Special teams':2};
function viz(){const R=rows.filter(r=>r.age!=null&&r.ovr!=null);if(R.length<3){$v.innerHTML='<p class="mu">Not enough data for the charts (age and rating needed).</p>';return}
 const W=640,H=290,P=38,ax=Math.min(...R.map(r=>r.age))-1,bx=Math.max(...R.map(r=>r.age))+1,ay=Math.floor(Math.min(...R.map(r=>r.ovr))/10)*10-5,by=Math.min(100,Math.max(...R.map(r=>r.ovr))+5),X=v=>P+(v-ax)/(bx-ax)*(W-2*P),Y=v=>H-P-(v-ay)/(by-ay)*(H-2*P);
 const dots=R.map(r=>`<a href="player.html?pid=${r.pid}"><circle cx="${X(r.age).toFixed(1)}" cy="${Y(r.ovr).toFixed(1)}" r="${(4+Math.max(0,r.ovr-50)/9).toFixed(1)}" fill="${GC[GR[r.pos]]||'#aaa'}" fill-opacity=".8" stroke="#000" stroke-opacity=".4"><title>${r.name} · ${r.pos} · age ${r.age} · ${r.ovr}</title></circle></a>`).join('');
 const gx=[];for(let a=Math.ceil(ax);a<=bx;a+=2)gx.push(`<line x1="${X(a)}" x2="${X(a)}" y1="${P-10}" y2="${H-P}" stroke="#18263b"/><text x="${X(a)}" y="${H-P+16}" fill="#8ea0b8" font-size="11" text-anchor="middle">${a}</text>`);
 const gy=[];for(let v=Math.ceil(ay/10)*10;v<=by;v+=10)gy.push(`<line x1="${P}" x2="${W-P+10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#18263b"/><text x="${P-6}" y="${Y(v)+4}" fill="#8ea0b8" font-size="11" text-anchor="end">${v}</text>`);
 const G={};R.forEach(r=>{const g=GR[r.pos];if(g)(G[g]=G[g]||[]).push(r.ovr)});const bars=Object.keys(GN).filter(g=>G[g]).map(g=>{const L=G[g].sort((a,b)=>b-a).slice(0,GN[g]),m=L.reduce((a,b)=>a+b,0)/L.length;return`<div style="display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0"><span class="mu">${g}</span><div class="bar"><i style="width:${m}%;background:${GC[g]}"></i></div><b>${m.toFixed(0)}</b></div>`}).join('');
 $v.innerHTML=`<h2>Roster map: age and rating</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Players by age and rating">${gx.join('')}${gy.join('')}<text x="${W/2}" y="${H-4}" fill="#8ea0b8" font-size="11" text-anchor="middle">Age</text><text x="12" y="${P-16}" fill="#8ea0b8" font-size="11">Rating</text>${dots}</svg><p class="mu" style="margin-top:4px">${Object.keys(GC).map(g=>`<span style="color:${GC[g]}">●</span> ${g}`).join(' &nbsp; ')} · tap a dot to open the player</p><h2 style="margin-top:16px">Strength by unit (average of the top players)</h2>${bars}`}
const $v=document.getElementById('viz');
async function load(){const t=teams.find(x=>x.tid==sel.value);history.replaceState(0,'','#'+sel.value);document.getElementById('tn').innerHTML=Logo.html(t,60)+nm(t);if(t.colors){document.documentElement.style.setProperty('--c1',t.colors[0]);document.documentElement.style.setProperty('--c2',t.colors[1])}
 rows=FBGMRoster.roster(await HubDB.idx('players','tid',+sel.value),+sel.value,s.season);document.getElementById('sub').textContent=s.season+' · '+rows.length+' players';Hub.setTitle(t.abbrev||'');draw();viz()}
sel.onchange=load;load()})()</script></body></html>
