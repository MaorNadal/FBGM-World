<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Player search · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}th{cursor:pointer;white-space:nowrap}td{white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}.inj{color:var(--bad)}.pre{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pre button{min-height:36px;padding:0 14px;border-radius:99px;border:1px dashed #3a4d6b;background:none;color:var(--tx);font:600 13px var(--f);cursor:pointer}.pre button:hover{border-color:var(--c2);color:var(--c2)}.chips button{border:0;background:var(--bg3);color:var(--tx);border-radius:99px;padding:3px 10px;margin:2px;cursor:pointer;font:inherit}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Player search</h1><p id="sub">Loading…</p></div>
<div class="card"><h2>Filters</h2><div class="ctl"><div><label for="g">Who</label><select id="g"><option value="a">Active players</option><option value="t">One team…</option><option value="-1">Free agents</option><option value="-2">Draft prospects</option><option value="-3">Retired</option><option value="*">Everyone</option></select></div><div id="wt" hidden><label for="t">Team</label><select id="t"></select></div><div><label for="p">Position</label><select id="p"></select></div><div><label for="q">Name</label><input id="q" type="text" placeholder="Name, college or country"></div><div><label for="a1">Age from</label><input id="a1" type="number" min="15" max="50"></div><div><label for="a2">Age to</label><input id="a2" type="number" min="15" max="50"></div><div><label for="o1">Overall at least</label><input id="o1" type="number" min="0" max="100"></div><div><label for="p1">Potential at least</label><input id="p1" type="number" min="0" max="100"></div><div><label for="c2">Contract at most ($M)</label><input id="c2" type="number" min="0" step="0.5"></div><div><label for="e2">Contract ends by (year)</label><input id="e2" type="number"></div><div><label for="xc">Add a rating column</label><select id="xc"></select></div></div>
<div class="chips" id="chips"></div><div class="pre" id="pre"></div></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),V=Viz,esc=V.esc;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const RL={hgt:'Height',stre:'Strength',spd:'Speed',endu:'Endurance',thv:'Vision',thp:'Throw power',tha:'Accuracy',bsc:'Ball security',elu:'Elusiveness',rtr:'Routes',hnd:'Hands',rbk:'Run block',pbk:'Pass block',pcv:'Coverage',tck:'Tackling',prs:'Pass rush',rns:'Run stop',kpw:'Kick power',kac:'Kick accuracy',ppw:'Punt power',pac:'Punt accuracy'};
const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),TM=Object.fromEntries(teams.map(t=>[t.tid,t]));Logo.init(teams);
$('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${(t.region+' '+t.name).trim()}</option>`).join('');$('t').value=s.userTid;
$('xc').innerHTML='<option value="">Choose…</option>'+Object.keys(RL).map(k=>`<option value="${k}">${RL[k]}</option>`).join('');
let all=[],cols=[],key='ovr',dir=-1;const MAX=250;
const PRE=[['Young with potential',{a2:23,p1:70}],['Bargains',{c2:2,o1:65}],['Expiring stars',{e2:s.season,o1:70}],['Veterans still good',{a1:30,o1:70}],['Elite right now',{o1:80}]];
$('pre').innerHTML=PRE.map((p,i)=>`<button data-i="${i}">${p[0]}</button>`).join('');
try{const P=await LeagueData.players();all=P.map(p=>{const r=FBGMPlayerInfo.ratingAt(p,s.season)||{},pi=FBGMPlayerInfo.row(p,s.season);const x={pid:p.pid,tid:p.tid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos:pi.pos,age:pi.age,ovr:pi.ovr,pot:pi.pot,country:pi.country,iso:pi.iso,college:pi.college,amount:p.contract?p.contract.amount/1000:null,exp:p.contract?p.contract.exp:null,injury:p.injury&&p.injury.gamesRemaining>0?(p.injury.type||'Injured')+' ('+p.injury.gamesRemaining+')':'',face:p.face};for(const k in RL)if(r[k]!=null)x[k]=r[k];return x})}
catch(e){o.innerHTML='<div class="card err"><b>Players could not be read.</b><p class="mu">'+esc(e.message)+'</p></div>';return}
$('p').innerHTML='<option value="">All positions</option>'+[...new Set(all.map(r=>r.pos))].filter(Boolean).sort().map(v=>`<option>${v}</option>`).join('');
const num=id=>{const v=$(id).value;return v===''?null:+v},tn=t=>t>=0&&TM[t]?TM[t].abbrev:({'-1':'FA','-2':'Prospect','-3':'Retired'}[t]||'');
const C=()=>[['name','Player'],['pos','Pos'],['tid','Team'],['country','Country'],['college','College'],['age','Age'],['ovr','Ovr'],['pot','Pot'],['amount','Contract'],['exp','Exp']].concat(cols.map(k=>[k,RL[k]])).concat([['injury','Injury']]);
function filt(){const g=$('g').value,q=$('q').value.trim().toLowerCase(),pos=$('p').value,a1=num('a1'),a2=num('a2'),o1=num('o1'),p1=num('p1'),c2=num('c2'),e2=num('e2');
 return all.filter(r=>(g==='*'||(g==='a'?r.tid>=0:g==='t'?r.tid===+$('t').value:r.tid===+g))&&(!pos||r.pos===pos)&&(!q||(r.name+' '+(r.college||'')+' '+(r.country||'')).toLowerCase().includes(q))&&(a1==null||(r.age!=null&&r.age>=a1))&&(a2==null||(r.age!=null&&r.age<=a2))&&(o1==null||(r.ovr!=null&&r.ovr>=o1))&&(p1==null||(r.pot!=null&&r.pot>=p1))&&(c2==null||(r.amount!=null&&r.amount<=c2))&&(e2==null||(r.exp!=null&&r.exp<=e2)))}
function draw(){$('wt').hidden=$('g').value!=='t';const L=filt(),n=L.length;L.sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'||typeof y==='string'?String(x==null?'':x).localeCompare(String(y==null?'':y)):(x==null)-(y==null)||x-y)*dir});const d=L.slice(0,MAX);
 $('sub').textContent=s.season+' · '+n.toLocaleString('en-US')+' players match'+(n>MAX?' (top '+MAX+' shown, sorted by '+(C().find(c=>c[0]===key)||[0,key])[1]+')':'');Hub.setTitle('Search');
 $('chips').innerHTML=cols.map(k=>`<button data-x="${k}">${RL[k]} ✕</button>`).join('');
 const cs=C();o.innerHTML=d.length?'<table><tr><th>#</th>'+cs.map(([k,l])=>`<th data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+d.map((r,i)=>`<tr><td class="mu">${i+1}</td><td><span class="av" data-pid="${r.pid}"></span><a href="player.html?pid=${r.pid}">${esc(r.name)}</a></td><td>${r.pos}</td><td>${r.tid>=0?Logo.t(r.tid,18)+' ':''}${tn(r.tid)}</td><td>${FBGMPlayerInfo.flag({iso:r.iso,name:r.country},14)} ${esc(r.country||'')}</td><td>${esc(r.college||'')}</td><td class="n">${r.age??''}</td><td class="n"><b>${r.ovr??''}</b></td><td class="n">${r.pot??''}</td><td class="n">${r.amount==null?'':r.amount.toFixed(2)+'M'}</td><td class="n">${r.exp??''}</td>${cols.map(k=>`<td class="n">${r[k]??''}</td>`).join('')}<td class="inj">${esc(r.injury)}</td></tr>`).join('')+'</table><p><button class="btn ghost" id="cv">Export CSV</button></p>':'<p>Nobody matches. Loosen a filter.</p>';
 o.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(['name','pos','tid'].includes(k)?1:-1);key=k;draw()});
 const cv=$('cv');if(cv)cv.onclick=()=>V.csv('players-'+s.season+'.csv',cs.map(c=>c[1]),L.map(r=>cs.map(([k])=>k==='tid'?tn(r.tid):r[k])));
 Faces.lazy(o,pid=>(d.find(r=>r.pid==pid)||{}).face,pid=>TM[(d.find(r=>r.pid==pid)||{}).tid])}
['g','t','p','q','a1','a2','o1','p1','c2','e2'].forEach(i=>$(i).oninput=$(i).onchange=draw);
$('xc').onchange=()=>{const k=$('xc').value;if(k&&!cols.includes(k)){cols.push(k);key=k;dir=-1}$('xc').value='';draw()};
$('chips').onclick=e=>{const k=e.target.dataset.x;if(k){cols=cols.filter(c=>c!==k);if(key===k)key='ovr';draw()}};
$('pre').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;['a1','a2','o1','p1','c2','e2'].forEach(x=>$(x).value='');for(const k in PRE[+i][1])$(k).value=PRE[+i][1][k];draw()};
draw()})()</script></body></html>
