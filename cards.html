<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cards · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style><style>.pk{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:12px}.fl{perspective:800px;aspect-ratio:300/420}.in{position:relative;width:100%;height:100%;transition:transform .8s var(--d,0s);transform-style:preserve-3d}.fl.go .in{transform:rotateY(180deg)}.in>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden}.bk{display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),#000);border:3px solid var(--c2);font-weight:800;letter-spacing:.2em;font-size:22px}.ft{transform:rotateY(180deg)}.ft svg{width:100%;height:100%}#one svg{width:100%;height:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Player cards</h1><p id="sub">Loading…</p></div><div class="card"><h2>Make a card</h2><input id="q" type="text" placeholder="Type a player name"><select id="r" hidden style="margin-top:10px"></select><div id="one" style="margin-top:12px;max-width:300px"></div><p><button class="btn" id="sv" hidden>Save as image</button> <button class="btn ghost" id="al" hidden>Add to album</button> <span class="mu" id="m"></span></p></div><div class="card"><h2>Open a pack</h2><select id="pool"><option value="all">Pool: every active player</option><option value="mine">Pool: your team</option></select><p><button class="btn" id="pk">Open a pack of 5</button> <a class="btn ghost" href="album.html">Album</a></p><div id="pack" class="pk"></div></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="player.js"></script><script src="world.js"></script><script src="cards.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i);const s=await HubDB.summary();
if(!s){$('one').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=Object.fromEntries((await HubDB.all('teams')).map(t=>[t.tid,t]));Hub.setTitle('Cards');$('sub').textContent='Your own collectible cards from the league data';
const mk=p=>FBGMCards.cardData(p,teams[p.tid],FBGMPlayer);let cur=null,cache={},t;
const nm=p=>((p.firstName||'')+' '+(p.lastName||'')).trim();
$('q').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const q=$('q').value.trim().toLowerCase();if(q.length<2)return;const r=await HubDB.scan('players',p=>nm(p).toLowerCase().includes(q),25);r.forEach(p=>cache[p.pid]=p);$('r').hidden=false;$('r').innerHTML='<option value="">Pick…</option>'+r.map(p=>`<option value="${p.pid}">${nm(p)}</option>`).join('')},350)};
$('r').onchange=()=>{const p=cache[$('r').value];if(!p)return;cur=mk(p);$('one').innerHTML=FBGMCards.svg(cur);$('sv').hidden=$('al').hidden=false;$('m').textContent=''};
$('sv').onclick=async()=>{try{const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(FBGMCards.svg(cur));await img.decode();const c=document.createElement('canvas');c.width=600;c.height=840;c.getContext('2d').drawImage(img,0,0,600,840);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=cur.name.replace(/\W+/g,'-')+'.png';a.click()}catch(e){$('m').textContent='Could not save the image on this browser.'}};
$('al').onclick=()=>{$('m').textContent=World.addAlbum([cur.pid])?'Added to album.':'Already in your album.'};
$('pk').onclick=async()=>{$('pk').disabled=true;$('pack').innerHTML='<p class="mu">Shuffling…</p>';const all=await HubDB.scan('players',p=>p.tid>=0&&(p.ratings||[]).length&&($('pool').value==='all'||p.tid===s.userTid));
 const P=FBGMCards.pack(all.map(mk),5,Math.random);World.addAlbum(P.map(c=>c.pid));$('pack').innerHTML=P.map((c,i)=>`<div class="fl" style="--d:${i*.5}s"><div class="in"><div class="bk">FBGM</div><div class="ft">${FBGMCards.svg(c)}</div></div></div>`).join('');
 requestAnimationFrame(()=>document.querySelectorAll('.fl').forEach(e=>e.classList.add('go')));$('pk').disabled=false;$('pk').textContent='Open another pack'}})()</script></body></html>
