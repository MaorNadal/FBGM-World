<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Player bios · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}th{cursor:pointer;white-space:nowrap}td{white-space:nowrap}td.n{text-align:right;font-variant-numeric:tabular-nums}.pg{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0}</style></head><body>
<main class="wrap"><div class="hero"><small>Stats</small><h1>Player bios</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="ctl"><div><label for="g">Who</label><select id="g"><option value="a">Active players</option><option value="t">One team…</option><option value="-1">Free agents</option><option value="-2">Draft prospects</option><option value="-3">Retired</option><option value="*">Everyone</option></select></div><div id="wt" hidden><label for="t">Team</label><select id="t"></select></div><div><label for="p">Position</label><select id="p"></select></div><div><label for="c">Country</label><select id="c"></select></div><div><label for="q">Name or college</label><input id="q" type="text" placeholder="Part of a name or college"></div></div><p class="mu" style="margin-bottom:0">Birthplace, country with flag, college, height, weight, age, draft and contract, as stored for each player. Flags are images from the internet; without a connection the country code is shown instead.</p></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),V=Viz,esc=V.esc,PI=FBGMPlayerInfo;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Bios');
try{const teams=(await LeagueData.teams()).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),TM=Object.fromEntries(teams.map(t=>[t.tid,t]));Logo.init(teams);
 $('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${esc((t.region+' '+t.name).trim())}</option>`).join('');$('t').value=s.userTid;
 o.innerHTML='<p class="mu">Reading all players…</p>';const P=await LeagueData.players();
 const all=P.map(p=>{const x=PI.row(p,s.season),d=p.draft||{};return{pid:p.pid,tid:p.tid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos:x.pos,age:x.age,ovr:x.ovr,loc:x.loc,country:x.country,iso:x.iso,college:x.college,hgt:x.hgt,height:x.height,weight:x.weight,draftYear:d.year!=null?d.year:null,draft:d.year==null?'Undrafted':(d.year+' · round '+(d.round||'?')+(d.pick?', pick '+d.pick:'')+(d.tid!=null&&TM[d.tid]?' · '+TM[d.tid].abbrev:'')),amount:p.contract?p.contract.amount/1000:null,exp:p.contract?p.contract.exp:null,face:p.face}});
 const cs=[...new Set(all.map(r=>r.country).filter(Boolean))].sort();$('c').innerHTML='<option value="">All countries</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');
 $('p').innerHTML='<option value="">All positions</option>'+[...new Set(all.map(r=>r.pos))].filter(Boolean).sort().map(v=>`<option>${v}</option>`).join('');
 const tn=t=>t>=0&&TM[t]?TM[t].abbrev:({'-1':'FA','-2':'Prospect','-3':'Retired'}[t]||'');let key='ovr',dir=-1,page=0;const PS=100;
 const COLS=[['name','Player'],['pos','Pos'],['tid','Team'],['country','Country'],['loc','Birthplace'],['college','College'],['age','Age'],['hgt','Height'],['weight','Weight'],['draftYear','Draft'],['amount','Contract'],['ovr','Ovr']];
 function draw(){const g=$('g').value,q=$('q').value.trim().toLowerCase(),pos=$('p').value,c=$('c').value;$('wt').hidden=g!=='t';
  let L=all.filter(r=>(g==='*'||(g==='a'?r.tid>=0:g==='t'?r.tid===+$('t').value:r.tid===+g))&&(!pos||r.pos===pos)&&(!c||r.country===c)&&(!q||(r.name+' '+r.college+' '+r.loc).toLowerCase().includes(q)));
  L.sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'||typeof y==='string'?String(x==null?'':x).localeCompare(String(y==null?'':y)):(x==null)-(y==null)||x-y)*dir});
  const n=L.length,mx=Math.max(0,Math.ceil(n/PS)-1);if(page>mx)page=mx;const d=L.slice(page*PS,page*PS+PS);
  $('sub').textContent=s.season+' · '+n.toLocaleString('en-US')+' players · '+L.filter(r=>r.country).length.toLocaleString('en-US')+' with a birthplace · '+L.filter(r=>r.college).length.toLocaleString('en-US')+' with a college';Hub.setTitle('Bios');
  o.innerHTML=d.length?'<table><tr>'+COLS.map(([k,l])=>`<th data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+d.map(r=>`<tr><td><span class="av" data-pid="${r.pid}"></span><a href="player.html?pid=${r.pid}">${esc(r.name)}</a></td><td>${r.pos}</td><td>${r.tid>=0?Logo.t(r.tid,18)+' ':''}${tn(r.tid)}</td><td>${PI.flag({iso:r.iso,name:r.country},14)} ${esc(r.country)}</td><td>${esc(r.loc)}</td><td>${esc(r.college)}</td><td class="n">${r.age??''}</td><td class="n">${r.height}</td><td class="n">${r.weight==null?'':r.weight+' lb'}</td><td>${esc(r.draft)}</td><td class="n">${r.amount==null?'':r.amount.toFixed(2)+'M'+(r.exp?' to '+r.exp:'')}</td><td class="n"><b>${r.ovr??''}</b></td></tr>`).join('')+'</table>'+(mx?`<div class="pg"><button class="btn ghost" id="pv" ${page?'':'disabled'}>‹</button><span class="mu">Page ${page+1} of ${mx+1}</span><button class="btn ghost" id="nx" ${page<mx?'':'disabled'}>›</button></div>`:'')+'<p><button class="btn ghost" id="cv">Export CSV (all '+n+' rows)</button></p>':'<p>Nobody matches.</p>';
  o.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(['name','pos','tid','country','loc','college'].includes(k)?1:-1);key=k;page=0;draw()});
  if($('pv'))$('pv').onclick=()=>{page--;draw()};if($('nx'))$('nx').onclick=()=>{page++;draw()};
  const cv=$('cv');if(cv)cv.onclick=()=>V.csv('player-bios-'+s.season+'.csv',['Player','Pos','Team','Country','Birthplace','College','Age','Height','Weight (lb)','Draft','Contract ($M)','Contract ends','Overall'],L.map(r=>[r.name,r.pos,tn(r.tid),r.country,r.loc,r.college,r.age,r.height,r.weight,r.draft,r.amount,r.exp,r.ovr]));
  Faces.lazy(o,pid=>(d.find(r=>r.pid==pid)||{}).face,pid=>TM[(d.find(r=>r.pid==pid)||{}).tid])}
 ['g','t','p','c'].forEach(i=>$(i).onchange=()=>{page=0;draw()});$('q').oninput=()=>{page=0;draw()};draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
