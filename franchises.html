<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Franchises · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}th[data-k]{cursor:pointer;white-space:nowrap}tr.me{background:#ffffff12}.nm small{display:block;color:var(--mu);font-size:11px;white-space:normal;max-width:240px}.ti{color:var(--c2);font-weight:800}#at{display:flex;flex-wrap:wrap;gap:8px}#at button{border:1px solid #2a3a52;background:var(--bg3);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;cursor:pointer;min-height:36px}#at button.on{background:var(--c1);border-color:var(--c1)}td.aw{color:var(--tx)}td.aw.z{color:var(--mu)}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>Franchise history</h1><p id="sub">Loading…</p></div>
<div class="card" id="kp"></div><div class="card" id="ka"><h2>Personal awards by franchise</h2><div class="chips" id="at" style="margin-bottom:10px"></div><div id="ab"><p class="mu">Reading the players…</p></div></div><div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="rivals.js"></script><script src="share.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="awardteams.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),V=Viz;const s=await HubDB.summary();
if(!s){$('out').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Franchises');
try{const teams=await HubDB.all('teams');Logo.init(teams);const F=FBGMRivals.franchises(teams,await HubDB.all('games'),s.season);let key='titles',dir=-1,AW={},CATS=FBGMAwardTeams.CATS.filter(c=>c.k!=='asmvp'),SH={mvp:'MVP',fmvp:'Finals MVP',opoy:'OPOY',dpoy:'DPOY',roy:'ROY',all1:'1st All-League',allL:'All-League',allR:'All-Rookie',allS:'All-Star'};
 const C=[['name','Franchise'],['seasons','Seasons'],['rec','Record'],['pct','Win %'],['po','Playoffs'],['finals','Finals'],['titles','Titles'],['best','Best records'],['bestPct','Best season']];const CC=()=>C.concat(CATS.map(c=>[c.k,SH[c.k]]));
 const val=(r,k)=>k==='rec'?r.w:(AW[r.tid]&&k in SH)?(AW[r.tid][k]||0):(k in SH?0:r[k]);
 function draw(){const L=[...F].sort((a,b)=>{const x=val(a,key),y=val(b,key);return(typeof x==='string'?x.localeCompare(y):x-y)*dir||b.titles-a.titles||b.w-a.w});
  $('sub').textContent=F.length+' franchises · '+F.reduce((a,r)=>a+r.titles,0)+' champions crowned (the current season is counted when it is over)';
  $('out').innerHTML='<table><tr><th>#</th>'+CC().map(([k,l])=>`<th data-k="${k}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr>'+L.map((r,i)=>`<tr class="${r.tid===s.userTid?'me':''}"><td class="mu">${i+1}</td><td class="nm">${Logo.t(r.tid,26)} <a href="teamhist.html#${r.tid}">${V.esc(r.name)}</a>${r.names.length>1?'<small>earlier: '+V.esc(r.names.filter(n=>n!==r.name).join(', '))+'</small>':''}</td><td class="n">${r.seasons}<small class="mu"> ${r.first}–${r.last}</small></td><td class="n">${r.w}-${r.l}${r.t?'-'+r.t:''}</td><td class="n">${(r.pct*100).toFixed(1)}%</td><td class="n">${r.po}</td><td class="n">${r.finals}</td><td class="n ti" title="${r.titleYears.join(', ')}">${r.titles||''}</td><td class="n">${r.best||''}</td><td class="n">${r.bestYear?(r.bestPct*100).toFixed(0)+'% <span class="mu">'+r.bestYear+'</span>':''}</td>${CATS.map(c=>{const n=(AW[r.tid]||{})[c.k]||0;return `<td class="n aw${n?'':' z'}">${n||'·'}</td>`}).join('')}</tr>`).join('')+'</table><p><button class="btn ghost" id="cv">Export CSV</button></p>';Share.addButtons($('out'),'Franchise history');
  $('out').querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=k===key?-dir:(k==='name'?1:-1);key=k;draw()});
  $('cv').onclick=()=>V.csv('franchises.csv',['Franchise','Seasons','W','L','T','Win %','Playoffs','Finals','Titles','Best-record seasons','Best season %','Best season'].concat(CATS.map(c=>c.label)),L.map(r=>[r.name,r.seasons,r.w,r.l,r.t,(r.pct*100).toFixed(1),r.po,r.finals,r.titles,r.best,(r.bestPct*100).toFixed(1),r.bestYear].concat(CATS.map(c=>(AW[r.tid]||{})[c.k]||0))))}
 const top=[...F].sort((a,b)=>b.titles-a.titles||b.finals-a.finals).filter(r=>r.titles).slice(0,10).map(r=>({id:r.tid,label:r.name,value:r.titles,c1:(teams.find(t=>t.tid===r.tid).colors||[])[0],logo:Logo.t(r.tid,24),href:'teamhist.html#'+r.tid}));
 $('kp').innerHTML='<h2>Most championships</h2><div id="kb"></div>';V.bars($('kb'),top,{fmt:v=>v+(v===1?' title':' titles'),top:10,mine:s.userTid});draw();
 (async()=>{try{const A=FBGMAwardTeams.aggregate(await LeagueData.players());AW=A.by;draw();let ck=CATS[0].k;const TM=Object.fromEntries(teams.map(t=>[t.tid,t])),nm=t=>((t.region||'')+' '+(t.name||'')).trim();
  const show=()=>{$('at').innerHTML=CATS.map(c=>`<button class="${c.k===ck?'on':''}" data-k="${c.k}">${V.esc(c.label)} · ${A.total[c.k]||0}</button>`).join('');$('at').querySelectorAll('button').forEach(b=>b.onclick=()=>{ck=b.dataset.k;show()});
   const L=Object.keys(A.by).map(t=>({t:+t,n:A.by[t][ck]||0})).filter(x=>x.n&&TM[x.t]).sort((a,b)=>b.n-a.n).slice(0,10).map(x=>({id:x.t,label:nm(TM[x.t]),value:x.n,c1:(TM[x.t].colors||[])[0],logo:Logo.t(x.t,24),href:'teamhist.html#'+x.t}));
   const lab=CATS.find(c=>c.k===ck).label;$('ab').innerHTML=L.length?'<div id="abb"></div><p class="mu" style="margin-bottom:0">An award counts for the team the player played most games for that season.</p>':'<p class="mu">No '+V.esc(lab)+' in this save.</p>';if(L.length)V.bars($('abb'),L,{fmt:v=>v+(v===1?' award':' awards'),top:10,mine:s.userTid})};show()}catch(e){$('ab').innerHTML='<p class="mu">Could not read the awards: '+V.esc(e.message)+'</p>';console.error(e)}})()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the table.</b><p class="mu">'+V.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
