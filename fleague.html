<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fantasy league · FBGM Hub</title><link rel="stylesheet" href="hub.css"><link rel="stylesheet" href="awardui.css"><style>
.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}
select,input[type=text],input[type=search]{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}
.fl-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.fl-tabs button,.fl-pos button{min-height:38px;padding:0 14px;border:1px solid #2a3a52;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.fl-tabs button.on,.fl-pos button.on{background:var(--c2);color:#000;border-color:var(--c2)}.fl-pos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fl-two{display:grid;gap:12px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}@media(max-width:900px){.fl-two{grid-template-columns:1fr}}

.fl-m{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--bg3);border-radius:14px;padding:10px 12px;margin-bottom:8px}.fl-m .t{min-width:0;overflow:hidden;text-overflow:ellipsis}.fl-m .t small{display:block;color:var(--mu)}.fl-m .r{text-align:right}.fl-m .sc2{font:800 22px/1 system-ui;text-align:center;white-space:nowrap}.fl-m .w{color:#f4c542}.fl-m.me{outline:2px solid var(--c2)}
.fl-l{font-size:12px;color:var(--mu);margin:2px 0}.fl-l span{display:inline-block;min-width:34px;font-weight:700;color:var(--tx)}
.fl-pl{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #1e2b40;min-width:0}.fl-pl span.s{width:42px;color:var(--mu);font-size:11px;font-weight:800}.fl-pl span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl-pl b{font-variant-numeric:tabular-nums}
.fl-ch{background:linear-gradient(120deg,#f4c54233,var(--bg2));border:2px solid #f4c542;border-radius:16px;padding:16px;text-align:center}.fl-ch b{font-size:26px;color:#f4c542}
.fl-brd{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));font-size:12px}.fl-brd div{background:var(--bg3);border-radius:8px;padding:4px 6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl-brd div.me{outline:1px solid var(--c2)}
</style></head><body>
<main class="wrap"><div class="hero"><small>Stats · Fantasy</small><h1>Fantasy league</h1><p id="sub">Loading…</p></div>
<div class="card" id="top"></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="world.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="faces.js"></script><script src="viz.js"></script><script src="pinfo.js"></script><script src="coaches.js"></script><script src="coachcar.js"></script><script src="coachhist.js"></script><script src="fleague.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),FL=FBGMFantasyLeague,PI=FBGMPlayerInfo,esc=Viz.esc,f1=x=>(Math.round(x*10)/10).toFixed(1);const s=await HubDB.summary();
if(!s){$('top').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Fantasy league');
try{const teams=await LeagueData.teams();Logo.init(teams);const TM=Object.fromEntries(teams.map(t=>[t.tid,t])),ga=await LeagueData.attrs();
 const store=()=>World.get('fleagues',{}),save=L=>{const o=store();o[L.id]=L;World.set('fleagues',o)};
 let P=null,CUR=null,DATA=null,view='d',wk=1;
 const players=async()=>P||(P=await LeagueData.players());
 const seasons=await (async()=>{const G=await LeagueData.games();return[...new Set(G.filter(g=>!g.allStar&&!g.playoffs).map(g=>g.season))].sort((a,b)=>b-a)})();
 const sc=()=>FL.SCORING[CUR.scoring]||FL.SCORING.half;
 /* ---------- data of one season: the pool, projections, weekly points ---------- */
 async function build(L){const y=L.season,SC=FL.SCORING[L.scoring]||FL.SCORING.half,AP=await players(),G=(await HubDB.idx('games','season',y)).filter(g=>!g.allStar&&!g.playoffs),days=[...new Set(G.map(g=>g.day))].sort((a,b)=>a-b),wkOf={};days.forEach((d,i)=>wkOf[d]=i+1);const gw={};G.forEach(g=>gw[g.gid]=wkOf[g.day]);
  const rowSum=(p,yy)=>{const r={};for(const x of p.stats||[]){if(x.season!==yy||x.playoffs)continue;for(const k in x)if(typeof x[k]==='number')r[k]=(r[k]||0)+x[k]}return r};
  const posAt=p=>{const R=(p.ratings||[]).filter(r=>r.season<=y);return(R[R.length-1]||(p.ratings||[])[0]||{}).pos};
  const dstPrev={};try{const Gp=(await HubDB.idx('games','season',y-1)).filter(g=>!g.allStar&&!g.playoffs);const a={};for(const g of Gp)g.teams.forEach((t,i)=>{const e=a[t.tid]=a[t.tid]||{p:0,n:0};e.p+=FL.dst(t,g.teams[1-i].pts);e.n++});for(const k in a)dstPrev[k]=a[k].p/a[k].n}catch(e){}
  const pool=[],byId={};
  for(const p of AP){const pos=posAt(p);if(!['QB','RB','WR','TE','K'].includes(pos))continue;const cur=rowSum(p,y);if(!(cur.gp>0))continue;const a=rowSum(p,y-1),b=rowSum(p,y-2),pa=a.gp>0?FL.points(a,SC)/a.gp:null,pb=b.gp>0?FL.points(b,SC)/b.gp:null,r=(p.ratings||[]).filter(q=>q.season<=y).slice(-1)[0]||{},ovr=r.ovr||50;
   let ppg=pa!=null&&pb!=null?pa*.65+pb*.35:pa!=null?pa:pb!=null?pb*.9:null;const base={QB:.32,RB:.22,WR:.2,TE:.14,K:.1}[pos]*Math.max(0,ovr-38);if(ppg==null)ppg=base*.8;else ppg=ppg*.9+base*.1;
   const o={id:p.pid,name:((p.firstName||'')+' '+(p.lastName||'')).trim(),pos,tid:null,ovr,age:p.born?y-p.born.year:null,ppg,proj:ppg*15,last:pa,face:p.face};byId[o.id]=o;pool.push(o)}
  for(const t of teams){const o={id:'D'+t.tid,name:t.region+' D/ST',pos:'DST',tid:t.tid,ovr:null,age:null,ppg:dstPrev[t.tid]!=null?dstPrev[t.tid]:7,proj:(dstPrev[t.tid]!=null?dstPrev[t.tid]:7)*15,last:dstPrev[t.tid]};byId[o.id]=o;pool.push(o)}
  /* weekly points */
  const wp={},pl=new Set(),add=(id,w,v)=>{(wp[id]=wp[id]||{})[w]=(wp[id][w]||0)+v;pl.add(id+'|'+w)};
  const B=await HubDB.idx('box','season',y);for(const r of B){if(r.playoffs)continue;const w=gw[r.gid];if(!w||!byId[r.pid])continue;add(r.pid,w,FL.points(r,SC))}
  for(const g of G){const w=gw[g.gid];g.teams.forEach((t,i)=>{if(byId['D'+t.tid])add('D'+t.tid,w,FL.dst(t,g.teams[1-i].pts))});}
  /* the team of each player that season: the team of his stat row with most games */
  for(const p of AP){const o=byId[p.pid];if(!o)continue;let best=null;for(const x of p.stats||[])if(x.season===y&&!x.playoffs&&(!best||(x.gp||0)>(best.gp||0)))best=x;o.tid=best?best.tid:null}
  pool.sort((a,b)=>b.proj-a.proj);const done=y!==s.season||s.phase>=3,W=days.length,planned=done?W:(+(ga.numGames&&ga.numGames.length?ga.numGames[ga.numGames.length-1].value:ga.numGames)||17)+1;
  return{y,pool,byId,wp,pl,W,planned,reg:Math.max(4,planned-2),done}}
 /* ---------- league state ---------- */
 const mgrsOf=async(season,n,seed)=>{const AP=await players(),R=FL.rng(seed+'|mg'),hof=AP.filter(p=>p.hof).map(p=>({p,av:(p.stats||[]).reduce((a,x)=>a+(+x.av||0),0)})).sort((a,b)=>b.av-a.av),strats=Object.keys(FL.STRAT),out=[];
  const strOf=pos=>pos==='QB'?'qb':pos==='RB'?'rb':(pos==='WR'||pos==='TE')?'wr':['DL','LB','CB','S'].includes(pos)?'vets':'bpa';
  for(const x of hof){if(out.length>=n-1)break;const r=(x.p.ratings||[]).slice(-1)[0]||{};out.push({name:((x.p.firstName||'')+' '+(x.p.lastName||'')).trim(),strat:strOf(r.pos),risk:0.2+R()*0.5,pid:x.p.pid,bio:'Hall of Fame '+(r.pos||'player')})}
  /* coach legends: the best head coaches of the lineages of the save (wins and titles over at least five seasons), each with the persona of his style */
  try{const AL=FBGMCoachHist.all(teams,{},{currentSeason:s.season,inProgress:s.phase<3,currentCoach:()=>null,po:{}}),SM={'Offensive guru':'qb','Defensive mind':'vets','Developer of talent':'upside','Analytics-minded':'bpa','Innovator':'contrarian','Disciplinarian':'rb','Old school':'rb','Players’ coach':'wr'},have=new Set(out.map(x=>x.name));
   for(const t of FBGMCoachHist.board(AL)){if(out.length>=n-1)break;if(t.seasons<5||have.has(t.coach.name))continue;have.add(t.coach.name);out.push({name:t.coach.name,strat:SM[t.coach.style]||'bpa',risk:0.2+R()*0.5,coach:1,bio:'coach legend, '+t.w+'–'+t.l+(t.titles?', '+t.titles+' title'+(t.titles===1?'':'s'):'')})}}catch(e){console.error(e)}
  let k=0;while(out.length<n-1){const c=FBGMCarousel.newCoach(seed+'|g'+(k++));out.push({name:c.name,strat:strats[Math.floor(R()*strats.length)],risk:0.2+R()*0.5,gen:1,bio:'generated manager'})}
  return out};
 async function create(f){const id=f.season+'-'+Date.now().toString(36),seed=id,n=+f.n,owner=f.slot==='r'?Math.floor(FL.rng(seed)()*n):Math.min(n,+f.slot)-1,list=await mgrsOf(f.season,n,seed),mgrs=[];let j=0;
  for(let i=0;i<n;i++)mgrs.push(i===owner?{name:f.me||'You',strat:'bpa',risk:0,you:1}:list[j++]);
  const L={id,name:f.name||'My league',season:+f.season,n,scoring:f.scoring,owner,seed,rounds:FL.ROUNDS,picks:[],mgrs,created:Date.now()};
  const D=await build(L);if(D.pool.length<n*FL.ROUNDS+8)throw new Error('Only '+D.pool.length+' players with stats in '+f.season+': too few for '+n+' managers of '+FL.ROUNDS+' players. Choose fewer managers or another season.');L.picks=FL.advance(L,L.mgrs,D.pool,D.byId);save(L);return L}
 const order=()=>FL.snake(CUR.n,CUR.rounds),rosters=()=>FL.rosters(CUR),drafted=()=>CUR.picks.length>=CUR.n*CUR.rounds;
 /* ---------- views ---------- */
 function head(){const o=store(),ks=Object.keys(o).sort().reverse();$('top').innerHTML=`<div style="display:grid;gap:10px;grid-template-columns:minmax(0,1fr) auto"><select id="lg" aria-label="League">${ks.map(k=>`<option value="${k}">${esc(o[k].name)} · ${o[k].season}</option>`).join('')}<option value="+">+ New league…</option></select><button class="btn ghost" id="rs" ${CUR?'':'hidden'}>Delete this league</button></div>`;
  if(CUR)$('lg').value=CUR.id;else $('lg').value=ks.length?'+':'+';$('lg').onchange=async()=>{const v=$('lg').value;if(v==='+'){CUR=null;DATA=null;setup();return}CUR=store()[v];DATA=null;view=drafted()?'m':'d';await show()};
  $('rs').onclick=()=>{if(!confirm('Delete "'+CUR.name+'"? The draft and the results of this league are removed.'))return;const o=store();delete o[CUR.id];World.set('fleagues',o);CUR=null;DATA=null;init()}}
 function setup(){head();$('sub').textContent='Create a league: a real draft with the players of your save, nine AI managers named after the legends of your league, and the real games of the season you choose as the weeks.';
  $('out').innerHTML=`<div class="card"><h2 style="margin-top:0">New fantasy league</h2><div class="ctl"><div><label for="nm">League name</label><input type="text" id="nm" value="Legends league"></div><div><label for="me">Your manager name</label><input type="text" id="me" value="You"></div><div><label for="se">Season to play</label><select id="se">${seasons.map(y=>`<option>${y}</option>`).join('')}</select></div><div><label for="nn">Managers</label><select id="nn">${[8,9,10,11,12,13,14].map(x=>`<option ${x===10?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="sg">Scoring</label><select id="sg">${Object.keys(FL.SCORING).map(k=>`<option value="${k}" ${k==='half'?'selected':''}>${FL.SCORING[k].label}</option>`).join('')}</select></div><div><label for="sl">Your draft slot</label><select id="sl"><option value="r">Random</option>${Array.from({length:14},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></div></div>
  <p class="mu">Rules (settings of this first version): roster QB, 2 RB, 2 WR, TE, FLEX (RB, WR or TE), D/ST, K and 7 bench players; snake draft of 16 rounds; head-to-head weeks from the real game days of the season, round-robin; the top 4 play two playoff weeks. Scoring: 0.04 per passing yard, 4 per passing TD, −2 per interception, 0.1 per rushing or receiving yard, 6 per TD, −2 per fumble lost, reception 0 / 0.5 / 1; kicker XP 1, FG 3/4/5, miss −1; D/ST sacks 1, interceptions 2, fumble recoveries 2, safeties 2, TDs 6, points allowed 10 down to −4. <b>Not in this version:</b> waivers, trades, auction draft and setting the lineup by hand (lineups are automatic: the best projected players who played that week). A past season replays the real stats; the draft projections use only earlier seasons.</p><p><button class="btn" id="go">Create the league and open the draft</button></p></div>`;
  $('go').onclick=async()=>{$('go').disabled=true;$('go').textContent='Building the draft pool…';try{CUR=await create({name:$('nm').value,me:$('me').value,season:$('se').value,n:$('nn').value,scoring:$('sg').value,slot:$('sl').value});DATA=null;view=drafted()?'m':'d';head();await show()}catch(e){$('out').innerHTML='<div class="card err"><b>Could not create the league.</b><p class="mu">'+esc(e.message)+'</p></div>';console.error(e)}}}
 const mname=i=>CUR.mgrs[i]?CUR.mgrs[i].name:'?';
 const tabs=()=>`<div class="fl-tabs" id="ft">${[['d','Draft'],['m','Matchups'],['s','Standings and playoffs'],['t','My team'],['f','Free agents'],['x','Trades']].map(([k,l])=>`<button data-k="${k}" class="${view===k?'on':''}">${l}</button>`).join('')}</div>`;
 async function show(){head();if(!DATA){$('out').innerHTML='<div class="card"><p class="mu">Reading the season…</p></div>';DATA=await build(CUR)}
  $('sub').textContent=esc0(CUR.name)+' · '+CUR.season+' · '+CUR.n+' managers · '+FL.SCORING[CUR.scoring].label+(drafted()?' · draft complete':' · draft in progress');
  if(drafted())runAI();
  const dv=view==='d'?draftView():view==='m'?matchView():view==='s'?standView():view==='t'?teamView():view==='f'?faView():trView();$('out').innerHTML=tabs()+dv;
  $('ft').onclick=e=>{const k=e.target.dataset.k;if(!k)return;view=k;show()};wire();Faces.lazy($('out'),pid=>(DATA.byId[pid]||{}).face,pid=>TM[(DATA.byId[pid]||{}).tid])}
 const esc0=x=>String(x).replace(/[<>&]/g,'');
 /* draft */
 let filt='ALL',q='';
 function chatCard(recent){if(!recent.length||!DATA)return'';const L=FL.chat(recent.slice(0,8),DATA.pool,CUR.mgrs,CUR.id);
  return '<div class="card"><h2 style="margin-top:0">Draft room</h2>'+L.map(x=>'<div class="fl-l" style="display:block;margin:4px 0"><small class="mu">#'+x.n+' · '+esc(x.by)+':</small> '+esc(x.text)+'</div>').join('')+'<p class="mu" style="margin:6px 0 0">Templates, not AI; a steal or a reach is judged against the projected ranking of the pool.</p></div>'}
 function draftView(){const o=order(),k=CUR.picks.length,R=rosters(),done=drafted(),on=done?-1:o[k],mine=on===CUR.owner,rd=Math.floor(k/CUR.n)+1,taken=new Set(CUR.picks);
  const av=DATA.pool.filter(p=>!taken.has(p.id)&&(filt==='ALL'||p.pos===filt)&&(!q||p.name.toLowerCase().includes(q))).slice(0,60);
  const my=R[CUR.owner].map(id=>DATA.byId[id]).filter(Boolean),recent=CUR.picks.slice(-12).map((id,i,a)=>{const idx=CUR.picks.length-a.length+i;return{p:DATA.byId[id],m:o[idx],n:idx+1}}).reverse();
  return `<div class="card fl-clock">${done?'<b>The draft is complete.</b> Open Matchups to play the season.':`<small class="mu">Round ${rd}, pick ${k+1} of ${o.length}</small><br><b>${mine?'You are on the clock':esc(mname(on))+' is on the clock'}</b>`}${!done&&mine?`<p style="margin:8px 0 0"><button class="btn ghost" id="ap">Auto-pick the best available</button> <button class="btn ghost" id="ad">Auto-draft the rest</button></p>`:''}</div>
  <div class="fl-two"><div class="card sc"><h2 style="margin-top:0">Available players</h2><div class="fl-pos" id="fp">${['ALL','QB','RB','WR','TE','K','DST'].map(x=>`<button data-p="${x}" class="${filt===x?'on':''}">${x}</button>`).join('')}</div><input type="search" id="fq" placeholder="Search a player" value="${esc(q)}" aria-label="Search a player" style="margin-bottom:8px"><table><tr><th></th><th>Player</th><th>Pos</th><th>Team</th><th class="n">Age</th><th class="n">Ovr</th><th class="n">Last PPG</th><th class="n">Proj.</th><th></th></tr>${av.map((p,i)=>`<tr><td class="n mu">${i+1}</td><td>${p.pos==='DST'?'':'<span class="av" data-pid="'+p.id+'"></span>'}${p.pos==='DST'?'':'<a href="player.html?pid='+p.id+'">'}${esc(p.name)}${p.pos==='DST'?'':'</a>'}</td><td>${p.pos}</td><td>${p.tid!=null&&TM[p.tid]?Logo.t(p.tid,16,CUR.season)+' '+esc(TM[p.tid].abbrev):''}</td><td class="n">${p.age??''}</td><td class="n">${p.ovr??''}</td><td class="n">${p.last!=null?f1(p.last):'–'}</td><td class="n"><b>${Math.round(p.proj)}</b></td><td>${mine?`<button class="btn" data-d="${esc(String(p.id))}" style="min-height:34px;padding:0 12px">Draft</button>`:''}</td></tr>`).join('')}</table></div>
  <div><div class="card"><h2 style="margin-top:0">Your roster · ${my.length}/${CUR.rounds}</h2>${['QB','RB','WR','TE','K','DST'].map(pos=>{const L=my.filter(p=>p.pos===pos);return `<div class="fl-l"><span>${pos}</span>${L.map(p=>esc(p.name)).join(', ')||'–'}</div>`}).join('')}</div><div class="card"><h2 style="margin-top:0">Latest picks</h2>${recent.map(r=>`<div class="fl-pl"><span class="s">#${r.n}</span><span class="nm"><b>${esc(r.p?r.p.name:'')}</b> <small class="mu">${r.p?r.p.pos:''}</small></span><small class="mu">${esc(mname(r.m))}</small></div>`).join('')||'<p class="mu">No picks yet.</p>'}</div>${chatCard(recent)}<div class="card"><h2 style="margin-top:0">The managers</h2>${CUR.mgrs.map((m,i)=>`<div class="fl-l"><span>${i+1}.</span>${esc(m.name)} <small>${m.you?'you':esc(FL.STRAT[m.strat]?FL.STRAT[m.strat].label:'')+' · '+esc(m.bio||'')}</small></div>`).join('')}</div></div></div>`}
 const pickNow=id=>{CUR.picks=CUR.picks.concat([id]);CUR.picks=FL.advance(CUR,CUR.mgrs,DATA.pool,DATA.byId);save(CUR);if(drafted())view='m';show()};
 function wire(){if(view==='d'){document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>pickNow(isNaN(+b.dataset.d)?b.dataset.d:+b.dataset.d));const ap=$('ap');if(ap)ap.onclick=()=>{const taken=new Set(CUR.picks),c=FL.aiPick({strat:'bpa',risk:0},rosters()[CUR.owner],DATA.pool,taken,Math.floor(CUR.picks.length/CUR.n)+1,CUR.rounds,()=>.5,DATA.byId);if(c)pickNow(c.id)};
   const ad=$('ad');if(ad)ad.onclick=()=>{let g=0;while(!drafted()&&g++<400){const taken=new Set(CUR.picks),c=FL.aiPick({strat:'bpa',risk:0},rosters()[CUR.owner],DATA.pool,taken,Math.floor(CUR.picks.length/CUR.n)+1,CUR.rounds,()=>.5,DATA.byId);if(!c)break;CUR.picks=CUR.picks.concat([c.id]);CUR.picks=FL.advance(CUR,CUR.mgrs,DATA.pool,DATA.byId)}save(CUR);view='m';show()};
   $('fp').onclick=e=>{const k=e.target.dataset.p;if(!k)return;filt=k;show()};$('fq').oninput=e=>{q=e.target.value.toLowerCase();clearTimeout(window.__fq);window.__fq=setTimeout(()=>{show().then(()=>{const i=$('fq');i.focus();i.setSelectionRange(i.value.length,i.value.length)})},250)}}
  if(view==='m'){const w=$('wk');if(w)w.onchange=()=>{wk=+w.value;show()};
   document.querySelectorAll('[data-el]').forEach(b=>b.onclick=()=>{const w=+b.dataset.el,R=rosterAt(CUR.owner,w).map(id=>DATA.byId[id]).filter(Boolean),cur=lineupOf(CUR.owner,w).L;

  return `<div class="card"><h2 style="margin-top:0">Trade with an AI manager</h2><p class="mu">Choose a manager, a week from which the trade counts, and tick the players each side gives. The manager accepts when what he receives is worth more to him than what he gives up (our projection of the season) and his roster can still field a lineup; a cautious manager asks for a bigger margin.</p><div class="ctl"><div><label for="tt">Manager</label><select id="tt">${opp.map(i=>`<option value="${i}" ${i===tm2?'selected':''}>${esc(mname(i))}</option>`).join('')}</select></div><div><label for="tw">From week</label><select id="tw">${Array.from({length:maxW},(_,i)=>`<option value="${i+1}" ${i+1===tw?'selected':''}>Week ${i+1}</option>`).join('')}</select></div></div><div class="fl-two" style="margin-top:10px"><div><b>You give</b>${li(my,'g')}</div><div><b>${esc(mname(tm2))} gives</b>${li(th,'r')}</div></div><p><button class="btn" id="pt">Propose the trade</button></p><div id="tr"></div></div>`+(tr.length?`<div class="card"><h2 style="margin-top:0">Accepted trades</h2>${tr.map(x=>`<div class="fl-pl"><span class="s">Wk ${x.w}</span><span class="nm">${esc(mname(x.a))} gave ${x.ga.map(i=>esc((DATA.byId[i]||{}).name||'')).join(', ')} for ${x.gb.map(i=>esc((DATA.byId[i]||{}).name||'')).join(', ')} (${esc(mname(x.b))})</span><button class="btn ghost" data-undo="${x.seq}" style="min-height:30px;padding:0 10px">Undo</button></div>`).join('')}</div>`:'')}
 async function init(){const o=store(),ks=Object.keys(o).sort().reverse();if(!ks.length){setup();return}CUR=o[ks[0]];DATA=null;view=drafted()?'m':'d';await show()}
 await init()
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
