<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Predictions · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.pb{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg3);min-width:120px}.pb i{background:var(--c2)}.pb b{background:var(--c1)}svg{width:100%;height:auto}</style></head><body>
<main class="wrap"><div class="hero"><small>Models</small><h1>Predictions</h1><p id="sub">Loading…</p></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="elo.js"></script>
<script>(async()=>{const o=document.getElementById('out');const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
const teams=await HubDB.all('teams');Logo.init(teams);const nm=Object.fromEntries(teams.map(t=>[t.tid,(t.region+' '+t.name).trim()])),M=FBGMModels.run(await HubDB.all('games')),rem=(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v);
const pr=(h,a)=>FBGMModels.P(M.rating[h]??1500,M.rating[a]??1500,M.opts.H),bt=FBGMModels.backtest(M.games),bc=FBGMModels.backtest(M.games.filter(g=>g.season===s.season)),pc=v=>(v*100).toFixed(1)+'%';
document.getElementById('sub').textContent='Own Elo model · '+M.games.length.toLocaleString('en-US')+' games learned';Hub.setTitle('Predictions');
const row=m=>{const p=pr(m.homeTid,m.awayTid);return`<tr><td>${m.day??''}</td><td>${Logo.t(m.awayTid,20)} ${nm[m.awayTid]} <span class="mu">@</span> ${Logo.t(m.homeTid,20)} ${nm[m.homeTid]}</td><td style="width:36%"><div class="pb"><b style="width:${(1-p)*100}%"></b><i style="width:${p*100}%"></i></div></td><td class="n">${pc(1-p)} / ${pc(p)}</td></tr>`};
const day=Math.min(...rem.map(m=>m.day).filter(x=>x!=null)),mine=rem.filter(m=>m.homeTid===s.userTid||m.awayTid===s.userTid).slice(0,5);
const R=Object.entries(M.rating).sort((a,b)=>b[1]-a[1]);
o.innerHTML=`<div class="card"><h2>How good is it? (checked on games it had not seen)</h2><table><tr><th></th><th class="n">Games</th><th class="n">Winner right</th><th class="n">Brier (0.25 = coin)</th></tr><tr><td>${s.season}</td><td class="n">${bc.n}</td><td class="n"><b>${pc(bc.acc)}</b></td><td class="n">${bc.brier.toFixed(3)}</td></tr><tr><td>All seasons</td><td class="n">${bt.n}</td><td class="n"><b>${pc(bt.acc)}</b></td><td class="n">${bt.brier.toFixed(3)}</td></tr></table><p class="mu">Each game is predicted before the model learns from it. Home edge ${M.opts.H} Elo points, one third carry-over to the next season. This is not the game's own win probability.</p></div>`+
(isFinite(day)?`<div class="card sc"><h2>Next games (day ${day})</h2><table>${rem.filter(m=>m.day===day).map(row).join('')}</table></div><div class="card sc"><h2>Your next games</h2><table>${mine.map(row).join('')}</table></div>`:'<div class="card"><p>No remaining games stored.</p></div>')+
`<div class="card sc"><h2>Ratings</h2><table><tr><th>#</th><th>Team</th><th class="n">Elo</th></tr>${R.map(([t,r],i)=>`<tr class="${+t===s.userTid?'me':''}"><td>${i+1}</td><td>${nm[t]||t}</td><td class="n">${r.toFixed(0)}</td></tr>`).join('')}</table></div>`})()</script></body></html>
