<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Notes · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>select,input,textarea{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:8px 10px;font:inherit}textarea{min-height:110px;resize:vertical}.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.nl{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}.nt{background:var(--bg3);border-radius:14px;border-top:3px solid var(--c2);padding:12px;min-width:0}.nt h3{margin:0 0 4px;font-size:16px;display:flex;gap:6px;align-items:center}.nt p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.nt .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c2);font-weight:800}.nt .ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.nt .ac button{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid #2a3a52;background:transparent;color:var(--tx);font:inherit;cursor:pointer}.nt.pin{border-top-color:#f4c542;box-shadow:0 0 0 1px #f4c54255}.ch{display:inline-block;border-radius:99px;background:#ffffff14;padding:0 8px;font-size:11px;margin-left:4px}</style></head><body>
<main class="wrap"><div class="hero"><small>Tools</small><h1>Notes</h1><p id="sub">Loading…</p></div>
<div class="card"><h2 style="margin-top:0" id="ft">New note</h2><p class="mu" style="margin-top:0">The game does not export its own notes, so these are yours: kept on this device with your other world data (backup and cloud sync carry them). Notes you write on a player's page appear here too.</p>
<div class="f"><div><label for="nt1">Title</label><input id="nt1" placeholder="Optional"></div><div><label for="ng">Tag</label><input id="ng" placeholder="Optional, one word, e.g. trade"></div><div><label for="nm">About a team</label><select id="nm"><option value="">No team</option></select></div><div><label for="np">About a player (name)</label><input id="np" list="pl" placeholder="Start typing a name"><datalist id="pl"></datalist></div></div>
<label for="nx" style="margin-top:10px;display:block">Note</label><textarea id="nx"></textarea><p><button class="btn" id="sv">Save note</button> <button class="btn ghost" id="cn" hidden>Cancel edit</button> <span class="mu" id="sm"></span></p></div>
<div class="card"><div class="f"><div><label for="q">Search</label><input type="search" id="q" placeholder="Search titles, text and tags"></div><div><label for="k">Show</label><select id="k"><option value="">All notes</option><option value="free">Free notes</option><option value="team">Team notes</option><option value="player">Player notes</option></select></div></div>
<p style="margin-bottom:0"><button class="btn ghost" id="ex">Download all notes (.txt)</button></p></div>
<div class="nl" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="world.js"></script><script src="notes.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),N=FBGMNotes,E=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const s=await HubDB.summary();
if(!s){o.innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Notes');
try{const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name));Logo.init(teams);const TM=Object.fromEntries(teams.map(t=>[t.tid,t])),tn=t=>TM[t]?((TM[t].region||'')+' '+(TM[t].name||'')).trim():'Team '+t;
 $('nm').innerHTML+=teams.map(t=>`<option value="${t.tid}">${E(tn(t.tid))}</option>`).join('');
 const PN={};/* names of players that have a note, and a name list for the picker (active players, kept short) */
 const pids=new Set(Object.keys(World.get('notes',{})).map(Number));for(const n of World.get('fnotes',[]))if(n.pid!=null)pids.add(n.pid);
 for(const id of pids){const p=await HubDB.get('players',id);if(p)PN[id]=((p.firstName||'')+' '+(p.lastName||'')).trim()}
 const names={player:pid=>PN[pid],team:tn};let ALL=null,edit=null;
 const picker=async()=>{if(ALL)return;ALL=[];await HubDB.scanMap('players',p=>p.tid>=0?{pid:p.pid,n:((p.firstName||'')+' '+(p.lastName||'')).trim()}:null).then(L=>{ALL=L.filter(Boolean)});$('pl').innerHTML=ALL.slice(0,3000).map(x=>`<option value="${E(x.n)}"></option>`).join('')};
 $('np').onfocus=picker;
 const fn=()=>World.get('fnotes',[]),save=a=>World.set('fnotes',a);
 function list(){return N.search(N.merge(World.get('notes',{}),fn(),names),$('q').value).filter(n=>!$('k').value||n.kind===$('k').value)}
 function draw(){const L=list(),all=N.merge(World.get('notes',{}),fn(),names).length;$('sub').textContent=all+' note'+(all===1?'':'s')+(L.length!==all?' · '+L.length+' shown':'');
  o.innerHTML=L.length?L.map(n=>`<div class="nt${n.pinned?' pin':''}"><span class="k">${n.kind}${n.pinned?' · pinned':''}${n.ts?' · '+new Date(n.ts).toISOString().slice(0,10):''}</span><h3>${n.tid!=null&&TM[n.tid]?Logo.t(n.tid,22):''}${n.kind==='player'&&n.pid!=null?`<a href="player.html?pid=${n.pid}">${E(n.title)}</a>`:E(n.title)}${n.tag?'<span class="ch">#'+E(n.tag)+'</span>':''}</h3><p>${E(n.text)}</p><div class="ac">${n.editable?`<button data-a="e" data-i="${n.fid}">Edit</button><button data-a="p" data-i="${n.fid}">${n.pinned?'Unpin':'Pin'}</button><button data-a="d" data-i="${n.fid}">Delete</button>`:`<a class="btn ghost" style="min-height:34px;padding:0 12px" href="player.html?pid=${n.pid}">Edit on the player page</a>`}</div></div>`).join(''):'<div class="card"><p class="mu">No notes yet. Write the first one above.</p></div>'}
 o.onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=+b.dataset.i,a=fn(),n=a.find(x=>x.id===id);if(!n)return;
  if(b.dataset.a==='p'){n.pinned=!n.pinned;save(a);draw()}else if(b.dataset.a==='d'){if(confirm('Delete this note?')){save(a.filter(x=>x.id!==id));draw()}}else{edit=id;$('ft').textContent='Edit note';$('nt1').value=n.title||'';$('ng').value=n.tag||'';$('nm').value=n.tid!=null?n.tid:'';$('np').value=n.pid!=null?(PN[n.pid]||''):'';$('nx').value=n.text||'';$('cn').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}};
 const reset=()=>{edit=null;$('ft').textContent='New note';['nt1','ng','np','nx'].forEach(i=>$(i).value='');$('nm').value='';$('cn').hidden=true};
 $('cn').onclick=reset;
 $('sv').onclick=async()=>{const text=$('nx').value.trim(),title=$('nt1').value.trim();if(!text&&!title){$('sm').textContent='Write something first.';return}
  let pid=null;const nm=$('np').value.trim();if(nm){await picker();const hit=ALL.find(x=>x.n.toLowerCase()===nm.toLowerCase());if(!hit){$('sm').textContent='No active player has exactly that name; pick one from the list or clear the box.';return}pid=hit.pid;PN[pid]=hit.n}
  const a=fn(),rec={title,text,tag:$('ng').value.trim().replace(/^#/,'').split(/\s+/)[0]||'',tid:$('nm').value===''?null:+$('nm').value,pid:null,ts:Date.now()};if(rec.tid==null&&pid!=null)rec.pid=pid;if(rec.tid==null)delete rec.tid;if(rec.pid==null)delete rec.pid;
  if(edit!=null){const n=a.find(x=>x.id===edit);if(n){const keep={id:n.id,pinned:n.pinned};for(const k of Object.keys(n))delete n[k];Object.assign(n,rec,keep)}}else{rec.id=N.nextId(a);a.push(rec)}
  save(a);reset();$('sm').textContent='Saved.';draw()};
 $('q').oninput=draw;$('k').onchange=draw;
 $('ex').onclick=()=>{const t=N.toText(list());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t||'No notes.'],{type:'text/plain'}));a.download='fbgm-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
 draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+E(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
