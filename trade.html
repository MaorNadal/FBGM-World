<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trade and trading block · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td{white-space:nowrap}.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.side{background:var(--bg3);border-radius:14px;padding:12px;border-top:3px solid var(--c2)}.side h3{margin:0 0 6px;font-size:16px}.as{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1e2b40}.as small{color:var(--mu)}pre{background:var(--bg3);border-radius:10px;padding:10px;overflow:auto;max-height:280px;font-size:12px}.tg{display:inline-block;border-radius:99px;padding:0 9px;font-size:11px;font-weight:800;background:#8f6bff33;color:#b9a2ff;margin-left:6px}.tcs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.tcs select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}.tcl{max-height:340px;overflow:auto;margin-top:8px}.tcl label{display:flex;gap:8px;align-items:center;padding:5px 2px;border-bottom:1px solid #1e2b40;cursor:pointer}.tcl label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tcl small{color:var(--mu)}.tcl b{font-variant-numeric:tabular-nums;color:var(--c2)}.tcv{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg3);border-left:4px solid var(--c2)}.tcb{display:flex;height:18px;border-radius:9px;overflow:hidden;background:#ffffff14;margin:8px 0}.tcb i{display:block;height:100%}</style></head><body>
<main class="wrap"><div class="hero"><small>Players</small><h1>Trade and trading block</h1><p id="sub">Loading…</p></div>
<div class="card"><p class="mu" style="margin:0">Read-only view of what the save holds: the trade open in the game and your saved trading block. Proposals are generated by the game when you ask, so they are not stored and cannot be shown. Nothing here can change the save.</p></div>
<div class="card" id="tcalc"></div><div id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="metrics.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script><script src="tradecalc.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),esc=Viz.esc,fm=n=>Math.round(n).toLocaleString('en-US');const s=await HubDB.summary();
if(!s){$('out').innerHTML='<div class="card"><a class="btn" href="import.html">Import league file</a></div>';return}
Hub.setTitle('Trade');
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));
 const M=(await HubDB.all('misc')),take=n=>M.filter(r=>r.src===n).map(r=>r.v),picks={};take('draftPicks').forEach(d=>picks[d.dpid]=d);
 const asArr=v=>Array.isArray(v)?v:v==null?[]:[v],ids=new Set();
 const sides=v=>{if(!v||typeof v!=='object')return[];if(Array.isArray(v.teams))return v.teams;if(v.pids||v.dpids)return[v];return[]};
 const TR=take('trade'),SB=take('savedTradingBlock');
 [...TR,...SB].flatMap(v=>[].concat(v).flatMap(sides)).forEach(x=>asArr(x.pids).forEach(p=>ids.add(p)));
 const P={};if(ids.size)(await HubDB.scan('players',p=>ids.has(p.pid))).forEach(p=>P[p.pid]=FBGMMetrics.slim(p));
 const ov=p=>{const r=p&&p.ratings&&p.ratings[p.ratings.length-1];return r?r.pos+' '+r.ovr:''};
 const asset=pid=>{const p=P[pid];return p?`<div class="as"><span><a href="player.html?pid=${pid}">${esc(((p.firstName||'')+' '+(p.lastName||'')).trim())}</a> <small>${esc(ov(p))}</small></span><small>${p.contract?fm(p.contract.amount)+' to '+p.contract.exp:''}</small></div>`:`<div class="as"><span>Player ${pid}</span></div>`};
 const pick=id=>{const d=picks[id];return d?`<div class="as"><span>${d.season} round ${d.round}${d.pick?', pick '+d.pick:''} <small>${d.originalTid!=null&&d.originalTid!==d.tid?'originally '+esc((T[d.originalTid]||{}).abbrev||''):''}</small></span><small>${esc((T[d.tid]||{}).abbrev||'')}</small></div>`:`<div class="as"><span>Pick ${id}</span></div>`};
 const block=(title,items)=>{if(!items.length)return`<div class="card"><h2>${title}</h2><p class="mu">Nothing stored in the save for this.</p></div>`;
  return`<div class="card"><h2>${title}</h2>`+items.map(v=>{const S=sides(v);if(!S.length)return`<p class="mu">The record has a shape this page does not know yet. Raw content:</p><pre>${esc(JSON.stringify(v,null,1).slice(0,3000))}</pre>`;
   return`<div class="cols">${S.map(x=>{const t=T[x.tid];return`<div class="side"><h3>${t?Logo.t(x.tid,24)+' '+esc((t.region+' '+t.name).trim()):'Your trading block'}</h3>${asArr(x.pids).map(asset).join('')}${asArr(x.dpids).map(pick).join('')}${!asArr(x.pids).length&&!asArr(x.dpids).length?'<p class="mu">No assets.</p>':''}${asArr(x.pidsExcluded).length||asArr(x.dpidsExcluded).length?'<p class="mu">Excluded: '+asArr(x.pidsExcluded).length+' players, '+asArr(x.dpidsExcluded).length+' picks</p>':''}</div>`}).join('')}</div>`}).join('')+'</div>'};
 $('sub').textContent=(TR.length?'An open trade is stored':'No open trade')+' · '+(SB.length?'a saved trading block is stored':'no saved trading block');
 $('out').innerHTML=block('Trade open in the game',TR)+block('Saved trading block',SB)

 /* TC-2: trade calculator (own model, see tradecalc.js) */
 {const TC=FBGMTradeCalc,ga=await LeagueData.attrs(),season=s.season,RK={},seas=teams.map(t=>(t.seasons||[]).find(x=>x.season===season)||{});
  const pctOf=t=>{const z=(t.seasons||[]).find(x=>x.season===season)||{},g=(z.won||0)+(z.lost||0)+(z.tied||0);return g?((z.won||0)+(z.tied||0)/2)/g:0.5};
  teams.slice().sort((a,b)=>pctOf(b)-pctOf(a)).forEach((t,i)=>RK[t.tid]=i+1);
  const sorted=teams.slice().sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),opt=sorted.map(t=>`<option value="${t.tid}">${esc((t.region+' '+t.name).trim())}</option>`).join(''),R={};
  const roster=async tid=>R[tid]||(R[tid]=(await HubDB.idx('players','tid',tid)).sort((a,b)=>TC.playerValue(b,season)-TC.playerValue(a,season)));
  const upcoming=tid=>Object.values(picks).filter(d=>d.tid===tid&&(d.season==null||+d.season>=season)).sort((a,b)=>(a.season-b.season)||(a.round-b.round));
  const pos=p=>{const r=(p.ratings||[]).slice(-1)[0]||{};return(r.pos||'')+' '+(r.ovr??'')};
  const a0=T[s.userTid]?s.userTid:teams[0].tid,b0=(teams.find(t=>t.tid!==a0)||teams[0]).tid;
  $('tcalc').innerHTML=`<h2 style="margin-top:0">Trade calculator</h2><p class="mu" style="margin-top:0">Tick what each side gives away. The totals use our own value model, not the game's trade AI: stars count far more than depth, young players with potential get a small bonus, a pick is worth the player expected at its place (taken from the team's record before the order is known). Nothing is saved and nothing touches the game.</p><div class="tcs"><div><label class="mu" for="ta">Side A</label><select id="ta">${opt}</select><div class="tcl" id="la"></div></div><div><label class="mu" for="tb">Side B</label><select id="tb">${opt}</select><div class="tcl" id="lb"></div></div></div><div class="tcv" id="tv"></div>`;
  $('ta').value=a0;$('tb').value=b0;const sel={a:new Set(),b:new Set()};
  async function side(k){const tid=+$(k==='a'?'ta':'tb').value,L=await roster(tid),pk=upcoming(tid),box=$(k==='a'?'la':'lb');
   box.innerHTML=L.slice(0,30).map(p=>`<label><input type="checkbox" data-p="${p.pid}"><span>${esc(((p.firstName||'')+' '+(p.lastName||'')).trim())} <small>${esc(pos(p))}${p.born?' · age '+(season-p.born.year):''}${p.contract?' · $'+(p.contract.amount/1000).toFixed(1)+'M to '+p.contract.exp:''}</small></span><b>${Math.round(TC.playerValue(p,season))}</b></label>`).join('')+pk.map(d=>`<label><input type="checkbox" data-d="${d.dpid}"><span>${d.season||''} round ${d.round}${d.originalTid!=null&&d.originalTid!==d.tid?' <small>from '+esc((T[d.originalTid]||{}).abbrev||'')+'</small>':''}</span><b>pick</b></label>`).join('');
   box.onchange=()=>summary()}
  async function summary(){const g=k=>{const box=$(k==='a'?'la':'lb'),tid=+$(k==='a'?'ta':'tb').value;return{tid,players:[...box.querySelectorAll('[data-p]:checked')].map(i=>(R[tid]||[]).find(p=>p.pid===+i.dataset.p)).filter(Boolean),picks:[...box.querySelectorAll('[data-d]:checked')].map(i=>picks[+i.dataset.d]).filter(Boolean)}},A=g('a'),B=g('b');
   const E=TC.evaluate(A,B,{season,nTeams:teams.length,rank:RK}),pa=Math.round(E.share*100),m=x=>(x>=0?'+':'−')+'$'+(Math.abs(x)/1000).toFixed(1)+'M';
   $('tv').innerHTML=`<b style="font-size:18px">${E.verdict.charAt(0).toUpperCase()+E.verdict.slice(1)}</b><div class="tcb"><i style="width:${pa}%;background:var(--c1)"></i><i style="width:${100-pa}%;background:var(--c2)"></i></div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>Side A receives <b>${Math.round(E.gotA)}</b> points · salary ${m(E.salaryA)}</span><span>Side B receives <b>${Math.round(E.gotB)}</b> points · salary ${m(E.salaryB)}</span></div>${ga.salaryCap?`<p class="mu" style="margin:6px 0 0">Salary cap ${(+(Array.isArray(ga.salaryCap)?ga.salaryCap[ga.salaryCap.length-1].value:ga.salaryCap)/1000).toFixed(0)}M: check that the team taking on salary stays under it.</p>`:''}`}
  $('ta').onchange=async()=>{await side('a');summary()};$('tb').onchange=async()=>{await side('b');summary()};await side('a');await side('b');await summary()}
}catch(e){$('out').innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
