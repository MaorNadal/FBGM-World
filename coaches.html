<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Coaches · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}.ch{display:inline-flex;gap:3px}.ch i{display:inline-block;width:18px;height:18px;border-radius:5px;font-style:normal;font-size:10px;font-weight:800;line-height:18px;text-align:center;background:#ffffff1a}.ch i.W{background:#27d17f55;color:#27d17f}.ch i.L{background:#ff546855;color:#ff8a98}.ch i.T{background:#ffb81c44;color:#ffb81c}.mm{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.mm>div{background:var(--bg3);border-radius:12px;padding:10px}.mm b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}.mm .bar{margin:6px 0}.mm p{margin:4px 0 0;font-size:13px}.nowb{border-left:4px solid var(--c2)}.lg2{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.me{background:#ffffff12}.mt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.mt button{min-height:40px;padding:0 16px;border:1px solid #2a3a52;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.mt button.on{background:var(--c2);color:#000;border-color:var(--c2)}.rt{display:inline-block;min-width:30px;text-align:center;border-radius:8px;padding:0 6px;font-weight:800;background:#ffffff1a}.rt.hi{background:#27d17f44;color:#27d17f}.rt.lo{background:#ff546844;color:#ff8a98}.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}select{min-height:44px;width:100%;background:var(--bg3);color:var(--tx);border:1px solid #2a3a52;border-radius:10px;padding:0 10px;font:inherit}</style></head><body>

<script>(async()=>{const $=i=>document.getElementById(i);const s=await HubDB.summary();
if(!s){$('tb').innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
const teams=(await HubDB.all('teams')).sort((a,b)=>(a.region+a.name).localeCompare(b.region+b.name)),games=await HubDB.all('games'),y=s.season;
const pre=FBGMModels.run(games.filter(g=>g.season<y)).rating,M=FBGMModels.run(games),Pw=Object.fromEntries(FBGMPower.power(games,teams,y).map(e=>[e.tid,e])),act=Object.fromEntries(FBGMModels.pulse(M.games,y).active.map(a=>[a.tid,a]));
const RKpf=(()=>{const L=Object.values(Pw).filter(e=>e.g>0).sort((a,b)=>b.pf/b.g-a.pf/a.g),R={};L.forEach((e,i)=>R[e.tid]=i+1);return R})(),RKpa=(()=>{const L=Object.values(Pw).filter(e=>e.g>0).sort((a,b)=>a.pa/a.g-b.pa/b.g),R={};L.forEach((e,i)=>R[e.tid]=i+1);return R})();const E=Object.values(Pw),lg=E.reduce((a,e)=>a+e.pf,0)/Math.max(1,E.reduce((a,e)=>a+e.g,0)),nm=Object.fromEntries(teams.map(t=>[t.tid,(t.region+' '+t.name).trim()]));
const mood=t=>{const x=((t.seasons||[]).find(z=>z.season===y)||{}).ownerMood;return x&&typeof x==='object'?Object.values(x).filter(v=>typeof v==='number').reduce((a,b)=>a+b,0):null};
const moodN=teams.filter(t=>mood(t)!=null).length;

const coach=(tid,role)=>{const o=World.get('coaches',{});const c=o[tid]&&o[tid][role];return c===undefined?Object.assign(FBGMCoaches.gen('t'+tid,role),{since:'start'}):c};
const sec=(t,role)=>{const e=Pw[t.tid]||{g:0,pct:0,mpg:0,pf:0,pa:0},ts=(t.seasons||[]).find(z=>z.season===y)||{},ex=1/(1+Math.pow(10,-(((pre[t.tid]??1500)-1500)*2/3)/400));
 return FBGMCoaches.security({role,g:e.g,pct:e.pct,exp:ex,mpg:e.mpg,po:ts.playoffRoundsWon,lossStreak:(act[t.tid]||{}).l||0,mood:mood(t),ppg:e.g?e.pf/e.g:lg,papg:e.g?e.pa/e.g:lg,lgppg:lg})};
const gaA=((await HubDB.get('meta','gameAttributes'))||{}).v||{},AT=FBGMTransform.attr,numG=+AT(gaA.numGames,y)||null,CLV=FBGMCoachLive,LV=CLV.all(M.games,teams,y),prog=CLV.progress(LV,numG),RKo=CLV.rank(LV,e=>e.over,true),RKp=CLV.rank(LV,e=>e.pct,true);
const remG=(await HubDB.all('misc')).filter(r=>r.src==='schedule').map(r=>r.v);
let PJ={};try{if(remG.length&&s.phase<3){const rr=AT(gaA.numGamesPlayoffSeries,y),by=+AT(gaA.numPlayoffByes,y)||0,nP=Array.isArray(rr)?Math.pow(2,rr.length)-by:14,wide=AT(gaA.playoffsByConf,y)!==true,TT=teams.map(t=>{const x=(t.seasons||[]).find(z=>z.season===y)||{};return{tid:t.tid,w:x.won||0,l:x.lost||0,t:x.tied||0,cid:wide?0:(x.cid??t.cid),did:x.did??t.did}}),cn=wide?1:([...new Set(TT.map(t=>t.cid))].length||1);PJ=Object.fromEntries(FBGMModels.simulate(TT,remG,(h,a)=>FBGMModels.P(M.rating[h]??1500,M.rating[a]??1500,M.opts.H),1500,Math.random,Math.round(nP/cn)).map(z=>[z.tid,z]))}}catch(e){console.error(e)}
const ys=[...new Set(games.filter(g=>!g.allStar&&!g.playoffs).map(g=>g.season))].sort((a,b)=>a-b);const PO={};games.filter(g=>g.playoffs&&!g.allStar&&g.teams).forEach(g=>{const e=PO[g.season]=PO[g.season]||new Set();g.teams.forEach(t=>e.add(t.tid))});let HO={},CAR={};
try{HO=Object.fromEntries(FBGMHonors.all(games,teams,ys,q=>({confs:AT(gaA.confs,q)||[],divs:AT(gaA.divs,q)||[],tiebreakers:AT(gaA.tiebreakers,q)}),s.phase<4?y:null).map(h=>[h.season,h]));CAR=FBGMCoachHist.all(teams,HO,{currentSeason:y,inProgress:s.phase<3,currentCoach:tid=>coach(tid,'HC'),po:PO})}catch(e){console.error(e)}
const chips=f=>'<span class="ch">'+(f||[]).map(k=>'<i class="'+k+'">'+k+'</i>').join('')+'</span>',tmood=t=>((t.seasons||[]).find(z=>z.season===y)||{}).hype;
Hub.setTitle('Coaches');$('sub').textContent=y+' · '+teams.length+' teams · owner mood found for '+moodN+' of '+teams.length+' teams';
const meter=x=>`<div class="bar" style="min-width:80px"><i style="width:${x.score}%;background:${x.score<30?'var(--bad)':x.score<50?'#ff9f43':'var(--ok)'}"></i></div><small class="mu">${x.score} · ${x.label}</small>`;
function table(){const R=teams.map(t=>({t,c:coach(t.tid,'HC'),h:sec(t,'HC'),o:sec(t,'OC'),d:sec(t,'DC')})).sort((a,b)=>a.h.score-b.h.score);
 $('tb').innerHTML='<table><tr><th>Team</th><th>Head coach</th><th style="width:22%">Job security</th><th>OC</th><th>DC</th></tr>'+R.map(r=>`<tr class="${r.t.tid===s.userTid?'me':''}"><td><a href="#${r.t.tid}">${nm[r.t.tid]}</a></td><td>${r.c.vacant?'<span class="bad">Vacant</span>':r.c.name+'<br><small class="mu">'+r.c.style+(ct=>ct&&ct.ends!=null?' · contract through '+ct.ends:'')(FBGMCarousel.contractOf(r.c,y))+'</small>'}</td><td>${meter(r.h)}</td><td>${meter(r.o)}</td><td>${meter(r.d)}</td></tr>`).join('')+'</table>'}
$('nw').innerHTML='<b>Right now in the league.</b> '+CLV.phaseNote(s.phase,prog)+' Every coach is measured against what is happening in the whole league at this moment: wins against the pre-game chances of the Elo model, the form of the last five games, the standing among all teams and, while games remain, the projected finish.';
function live(){const R=teams.map(t=>{const e=LV[t.tid],h=sec(t,'HC'),mo=CLV.mood(e,h.score,tmood(t));return{t,e,h,mo,c:coach(t.tid,'HC'),pj:PJ[t.tid]}}).sort((a,b)=>a.h.score-b.h.score);
 $('lv').innerHTML='<h2 style="margin-top:0">Coaches on the clock</h2><table><tr><th>Team</th><th>Head coach</th><th class="n">Record</th><th class="n">Expected</th><th class="n">Over / under</th><th>Last 5</th><th>Owner</th><th>Fans</th><th>Media heat</th>'+(Object.keys(PJ).length?'<th class="n">Proj. wins</th><th class="n">Playoffs</th>':'')+'</tr>'+R.map(r=>`<tr class="${r.t.tid===s.userTid?'me':''}"><td class="lg2">${Logo.t(r.t.tid,18)} <a href="#${r.t.tid}">${nm[r.t.tid]}</a></td><td>${r.c.vacant?'<span class="bad">Vacant</span>':r.c.name}</td><td class="n">${r.e.w}–${r.e.l}${r.e.t?'–'+r.e.t:''}</td><td class="n">${r.e.expW.toFixed(1)}</td><td class="n ${r.e.over>=0.5?'ok':r.e.over<=-0.5?'bad':''}">${r.e.g?(r.e.over>=0?'+':'−')+Math.abs(r.e.over).toFixed(1):'–'} <small class="mu">#${RKo[r.t.tid]||'–'}</small></td><td>${chips(r.e.last5)}</td><td>${r.mo.owner.score}</td><td>${r.mo.fans.score}</td><td>${r.mo.media.score}</td>${r.pj?`<td class="n">${r.pj.ew.toFixed(1)}</td><td class="n">${(r.pj.top*100).toFixed(0)}%</td>`:''}</tr>`).join('')+'</table><p class="mu">Owner = the job-security meter. Fans and media heat are template moods from the record, the form, the streak and the stored hype of the team; they are story, not data of the game. Over / under: wins so far minus the sum of the chances the model gave before each game; the number after it is the rank in the league.</p>'}
function liveCards(tid,t){const e=LV[tid],h=sec(t,'HC'),mo=CLV.mood(e,h.score,tmood(t)),T=CAR[tid]||[],cur=T[T.length-1],pj=PJ[tid],c=coach(tid,'HC');
 const mm=(k,x)=>`<div><b>${k}</b><div class="bar"><i style="width:${x.score}%"></i></div><small class="mu">${x.score}</small><p>${x.text}</p></div>`;
 const rem=remG.filter(m=>m.homeTid===tid||m.awayTid===tid);
 const lc=`<div class="card nowb"><h2>${c.vacant?'The head coach position is vacant':c.name+' right now'}</h2><p>${CLV.headline(e,RKo[tid],teams.length)}</p><p class="lg2">Last five ${chips(e.last5)} ${e.streak.n>1?'· current streak '+e.streak.type+e.streak.n:''} · points ${e.ppg.toFixed(1)} for, ${e.papg.toFixed(1)} against · standing ${RKp[tid]?'#'+RKp[tid]+' of '+teams.length+' by win percentage':'–'}</p>${rem.length?`<p>${rem.length} games to play${pj?` · projected finish ${pj.ew.toFixed(1)} wins · ${(pj.top*100).toFixed(0)}% to make the playoffs`:''}.</p>`:''}<div class="mm">${mm('Owner confidence',mo.owner)}${mm('Fan support',mo.fans)}${mm('Media heat',mo.media)}</div></div>`;
 const rowT=x=>`<tr class="${x===cur?'me':''}"><td>${x.coach.name}${x.coach.current?' <span class="chip">current</span>':''}${x.coach.style?'<br><small class="mu">'+x.coach.style+'</small>':''}</td><td class="n">${x.from}–${x.to!=null?x.to:'now'}</td><td class="n">${x.seasons}</td><td class="n">${x.w}–${x.l}${x.t?'–'+x.t:''}</td><td class="n">${(x.pct*100).toFixed(1)}%</td><td class="n">${x.po}</td><td class="n">${x.div}</td><td class="n">${x.titles?'🏆'.repeat(Math.min(x.titles,5))+' '+x.titles:x.finals?'final ×'+x.finals:''}</td><td>${x.ended==='fired'?(x.byOwner?'fired by you':'fired'):x.ended==='retired'?'retired':'<span class="mu">still coaching</span>'}</td></tr>`;
 const hist=T.filter(x=>x.rows.length).length?`<div class="card sc"><h2>Head coaches of ${nm[tid]}</h2><table><tr><th>Coach</th><th class="n">Years</th><th class="n">Seasons</th><th class="n">Record</th><th class="n">Win %</th><th class="n">Playoffs</th><th class="n">Division</th><th class="n">Super Bowl</th><th>Ended</th></tr>${T.filter(x=>x.rows.length).slice().reverse().map(rowT).join('')}</table><p class="mu">Names and tenures are narrative: the save stores no coaches, so every franchise's lineage follows a rule applied to its real results (see Coach legends). The current tenure includes the season in progress.</p></div>`:'';
 return lc+hist}
$('t').innerHTML=teams.map(t=>`<option value="${t.tid}">${nm[t.tid]}</option>`).join('');$('t').value=location.hash.slice(1)||s.userTid;
function detail(){const tid=+$('t').value,t=teams.find(x=>x.tid===tid),mine=tid===s.userTid||MANAGE,e=Pw[tid]||{},log=World.get('coachlog',[]);
 const rows=['HC','OC','DC'].map(r=>{const c=coach(tid,r),k=sec(t,r);return`<div class="card"><h2>${FBGMCoaches.ROLES[r]}</h2>${c.vacant?'<p class="bad">Vacant</p>':`<p><b>${c.name}</b>${c.interim?' <span class="chip">interim</span>':''} · ${c.style} · age ${c.age} · since ${c.since}</p><p class="mu" style="margin:0">Reputation ${FBGMCarousel.repOf(c)} · retires around ${FBGMCarousel.retireAgeOf(c)}${c.exp!=null&&r==='HC'?' · '+c.exp+' year'+(c.exp===1?'':'s')+' as head coach':''}${FBGMCarousel.clashOf(c)?' · abrasive, a clash with the owner can cost him the job':''}${c.unit!=null&&r!=='HC'?' · unit ranked in the top '+Math.max(1,Math.round((1-c.unit)*teams.length))+' of '+teams.length:''}${FBGMCarousel.teamTrait(tid).patience<0.4?' · an impatient owner':FBGMCarousel.teamTrait(tid).patience>0.75?' · a patient owner':''}</p><p class="mu">Game plan ${c.plan} · Motivation ${c.motivation} · Development ${c.development}</p>`}${meter(k)}${mine&&!c.vacant?`<p><button class="btn ghost" data-f="${r}">Fire</button></p>`:''}${mine&&c.vacant&&r==='HC'?'<p><a href="#mk" style="text-decoration:underline">Choose a head coach in the coaching market above</a> (coaches without a job and former players).</p>':''}${mine&&c.vacant&&r!=='HC'?`<h2>Candidates</h2>${FBGMCoaches.pool(tid+':'+r+':'+log.length,r,5).map((x,i)=>`<p><b>${x.name}</b> · ${x.style} · age ${x.age}<br><span class="mu">Plan ${x.plan} · Motivation ${x.motivation} · Development ${x.development}</span> <button class="btn" data-h="${r}:${i}" style="min-height:36px;padding:0 14px">Hire</button></p>`).join('')}`:''}</div>`}).join('');
 const ex=1/(1+Math.pow(10,-(((pre[tid]??1500)-1500)*2/3)/400));
 $('dt').innerHTML=liveCards(tid,t)+rows+`<div class="card"><h2>What the head-coach meter uses</h2><table><tr><td>Win rate</td><td class="n">${((e.pct||0)*100).toFixed(0)}%</td><td class="mu">expected from preseason strength ${(ex*100).toFixed(0)}%</td></tr><tr><td>Points margin per game</td><td class="n">${(e.mpg||0).toFixed(1)}</td><td></td></tr><tr><td>Current losing streak</td><td class="n">${(act[tid]||{}).l||0}</td><td class="mu">counts from 4</td></tr><tr><td>Playoffs this season</td><td class="n">${((t.seasons||[]).find(z=>z.season===y)||{}).playoffRoundsWon>=0?'yes':'not yet'}</td><td></td></tr><tr><td>Owner mood</td><td class="n">${mood(t)==null?'n/a':mood(t)}</td><td class="mu">used when the save has it</td></tr></table><p class="mu">Offensive coordinator: ${e.g?(e.pf/e.g).toFixed(1):'–'} points per game (league ${lg.toFixed(1)}, rank ${RKpf[tid]||'–'}). Defensive coordinator: ${e.g?(e.pa/e.g).toFixed(1):'–'} points allowed per game (rank ${RKpa[tid]||'–'}). Coordinators: offence is judged on points scored per game, defence on points allowed, against the league average: security = 55 + weight x 3 x (difference), limited to plus or minus 30. Early in the season the meter stays near 55 and gains weight over the first ten games.</p></div>`+(log.some(l=>l.type!=='carousel')?`<div class="card"><h2>Recent moves in the league</h2>${log.filter(l=>l.type!=='carousel').slice(-12).reverse().map(l=>`<p>${l.season}: ${nm[l.tid]||''} · ${l.type==='hired'?'hired':'fired'} ${l.name} (${FBGMCoaches.ROLES[l.role]})</p>`).join('')}</div>`:'');
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const r=b.dataset.f,c=coach(tid,r),o=World.get('coaches',{});(o[tid]=o[tid]||{})[r]={vacant:true};World.set('coaches',o);World.set('coachlog',log.concat([{season:y,tid,role:r,name:c.name,type:'fired'}]));if(r==='HC')setPool(getPool().concat([Object.assign({},c,{from:'fired '+y+' by '+(teams.find(x=>x.tid===tid)||{}).abbrev,since:null})]));table();live();detail();market()});
 document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const [r,i]=b.dataset.h.split(':'),c=FBGMCoaches.pool(tid+':'+r+':'+log.length,r,5)[+i],o=World.get('coaches',{});(o[tid]=o[tid]||{})[r]=Object.assign(c,{since:y});World.set('coaches',o);World.set('coachlog',log.concat([{season:y,tid,role:r,name:c.name,type:'hired'}]));table();live();detail()})}

/* CM-1: coaching market (coaches without a job, former players) and the carousel; all stored in the world data */
let MANAGE=false,MT='a',PREV=null,PLY=null;const getPool=()=>World.get('coachpool',null)||Array.from({length:10},(_,i)=>Object.assign({},FBGMCarousel.newCoach('free0:'+i),{from:'unknown'})),setPool=L=>World.set('coachpool',L),applied=()=>World.get('coachlog',[]).filter(l=>l.season===y&&l.type==='carousel').length;
const usedPid=()=>new Set(Object.values(World.get('coaches',{})).flatMap(o=>Object.values(o||{})).map(c=>c&&c.pid).filter(x=>x!=null));
async function former(){if(!PLY){const P=await LeagueData.players();PLY=FBGMCarousel.playerPool(P,y,60)}const u=usedPid();return PLY.filter(c=>!u.has(c.pid))}
const rt=v=>`<span class="rt ${v>=75?'hi':v<=50?'lo':''}">${Math.round(v)}</span>`,esc2=x=>String(x==null?'':x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const seats=()=>teams.filter(t=>MANAGE||t.tid===s.userTid).map(t=>{const c=coach(t.tid,'HC');return{t,c}});
function hire(c,tid,fromPool,idx,role){role=role||c.role||'HC';const o=World.get('coaches',{}),old=coach(tid,role),log=World.get('coachlog',[]),add=[];let pool=getPool();

 if(fromPool)pool.splice(idx,1);(o[tid]=o[tid]||{})[role]=Object.assign({},c,{role,since:y});add.push({season:y,tid,role,name:c.name,type:'hired'});
 World.set('coaches',o);setPool(pool);World.set('coachlog',log.concat(add));table();live();detail();market()}
async function market(){const L=MT==='a'?getPool():await former(),S=seats(),pt=$('ht')?$('ht').value:null,pr=$('hr')?$('hr').value:'';
 const opts=S.map(x=>`<option value="${x.t.tid}">${esc2(nm[x.t.tid])}</option>`).join('');
 const hl=location.hash.slice(1);
 $('mk').innerHTML=`<h2 style="margin-top:0">Coaching market</h2><p class="mu" style="margin-top:0">Head coaches without a job (fired coaches and unknown names) and former players of the save, rated from their real careers. Hiring puts the coach on the team; replacing a coach sends him to the market. Story only: coaches do not change the simulation.</p>
 <label style="cursor:pointer"><input type="checkbox" id="mg" ${MANAGE?'checked':''}> Manage any team (otherwise only your own team)</label>
