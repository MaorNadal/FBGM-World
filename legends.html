<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Legends · FBGM Hub</title><link rel="stylesheet" href="hub.css"><style>.sc{overflow-x:auto}td{white-space:nowrap}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{min-height:40px;padding:0 16px;border:1px solid #2a3a52;border-radius:99px;background:var(--bg3);color:var(--tx);font:700 13px var(--f);cursor:pointer}.tabs button.on{background:var(--c2);color:#000;border-color:var(--c2)}.lg{display:inline-block;border-radius:99px;padding:0 9px;font-size:11px;font-weight:800;background:#ffb81c33;color:var(--c2);margin-left:4px}.fire{color:var(--bad)}.ret{color:var(--mu)}.cr{display:grid;grid-template-columns:minmax(130px,200px) 1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1e2b40}.cr small{color:var(--mu);display:block}@media(max-width:640px){.cr{grid-template-columns:1fr}}</style></head><body>
<main class="wrap"><div class="hero"><small>Records and history</small><h1>Legends</h1><p id="sub">Loading…</p></div>
<div class="card"><div class="tabs" id="tb"><button data-k="c" class="on">Coach legends</button><button data-k="r">Coaching carousel</button><button data-k="p">Player legends</button></div><div class="ctl" id="yc" style="margin-top:10px" hidden><div><label for="y">Season</label><select id="y"></select></div></div><p class="mu" id="nt" style="margin-bottom:0"></p></div>
<div class="card sc" id="out"></div></main>
<script src="nav.js"></script><script src="cloud.js"></script><script src="logos.js"></script><script src="db.js"></script><script src="world.js"></script><script src="transform.js"></script><script src="metrics.js"></script><script src="coaches.js"></script><script src="tiebreak.js"></script><script src="honors.js"></script><script src="coachcar.js"></script><script src="coachhist.js"></script><script src="leaguedata.js"></script><script src="viz.js"></script>
<script>(async()=>{const $=i=>document.getElementById(i),o=$('out'),esc=Viz.esc,AT=FBGMTransform.attr;const s=await HubDB.summary();
if(!s){o.innerHTML='<a class="btn" href="import.html">Import league file</a>';return}
Hub.setTitle('Legends');
try{const teams=await LeagueData.teams();Logo.init(teams);const T=Object.fromEntries(teams.map(t=>[t.tid,t]));o.innerHTML='<p class="mu">Reading the history…</p>';
 const G=await LeagueData.games(),ga=await LeagueData.attrs(),ys=[...new Set(G.filter(g=>!g.allStar&&!g.playoffs).map(g=>g.season))].sort((a,b)=>a-b),y=s.season;
 const HO=Object.fromEntries(FBGMHonors.all(G,teams,ys,q=>({confs:AT(ga.confs,q)||[],divs:AT(ga.divs,q)||[],tiebreakers:AT(ga.tiebreakers,q)}),s.phase<4?y:null).map(h=>[h.season,h]));
 const W=World.get('coaches',{}),cc=tid=>{const c=W[tid]&&W[tid].HC;return c===undefined?FBGMCoaches.gen('t'+tid,'HC'):c};
 const PO={};G.filter(g=>g.playoffs&&!g.allStar&&g.teams).forEach(g=>{const e=PO[g.season]=PO[g.season]||new Set();g.teams.forEach(t=>e.add(t.tid))});const CAR=FBGMCoachHist.all(teams,HO,{currentSeason:y,inProgress:s.phase<3,currentCoach:cc,po:PO}),B=FBGMCoachHist.board(CAR);
 const nm=t=>T[t]?((T[t].region||'')+' '+(T[t].name||'')).trim():'?',ab=t=>T[t]?T[t].abbrev:'?',rec=x=>x.w+'–'+x.l+(x.t?'–'+x.t:'');
 $('sub').textContent=B.length+' head-coach tenures · '+B.filter(x=>x.legend).length+' legends · '+B.reduce((a,x)=>a+x.titles,0)+' Super Bowl titles won by coaches';
 $('y').innerHTML=ys.slice().reverse().map(q=>`<option>${q}</option>`).join('');
 let P=null,tab='c';
 async function draw(){$('yc').hidden=tab!=='r';
  if(tab==='c'){$('nt').textContent='Great coaches of the past and present, ranked by wins, titles, finals, division titles and playoff trips. The save stores no coaches: names and tenures are generated narrative that follows the real results of each franchise (a coach is dismissed after poor seasons or retires). A legend has at least one Super Bowl title, or 80 wins at 60 percent or better.';
   o.innerHTML='<table><tr><th class="n">#</th><th>Coach</th><th>Team</th><th class="n">Years</th><th class="n">Seasons</th><th class="n">Record</th><th class="n">Win %</th><th class="n">Playoffs</th><th class="n">Division</th><th class="n">Finals</th><th class="n">Titles</th><th>Ended</th></tr>'+B.slice(0,60).map((x,i)=>`<tr><td class="n">${i+1}</td><td><b>${esc(x.coach.name)}</b>${x.legend?'<span class="lg">legend</span>':''}${x.coach.current?' <span class="chip">current</span>':''}<br><small class="mu">${esc(x.coach.style||'')}</small></td><td>${Logo.t(x.tid,18)} <a href="coaches.html#${x.tid}">${esc(ab(x.tid))}</a></td><td class="n">${x.from}–${x.to!=null?x.to:'now'}</td><td class="n">${x.seasons}</td><td class="n">${rec(x)}</td><td class="n">${(x.pct*100).toFixed(1)}%</td><td class="n">${x.po}</td><td class="n">${x.div}</td><td class="n">${x.finals}</td><td class="n"><b>${x.titles?'🏆 '+x.titles:''}</b></td><td class="${x.ended==='fired'?'fire':'ret'}">${x.ended||'coaching'}</td></tr>`).join('')+'</table><p><button class="btn ghost" id="cv">Export CSV</button></p>';
   $('cv').onclick=()=>Viz.csv('coach-legends.csv',['Coach','Team','From','To','Seasons','Wins','Losses','Ties','Win %','Playoffs','Division titles','Finals','Titles','Ended'],B.map(x=>[x.coach.name,nm(x.tid),x.from,x.to,x.seasons,x.w,x.l,x.t,(x.pct*100).toFixed(1),x.po,x.div,x.finals,x.titles,x.ended||'']))}
  else if(tab==='r'){const q=+$('y').value,L=FBGMCoachHist.carousel(CAR,q);$('nt').textContent='Coaches who left a franchise at the end of the season and who replaced them (generated narrative that follows the results).';
   o.innerHTML=L.length?'<div>'+L.map(c=>`<div class="cr"><div>${Logo.t(c.tid,22,q)} <b>${esc(nm(c.tid))}</b></div><div><span class="${c.out.ended==='fired'?'fire':'ret'}">${c.out.ended==='fired'?'Fired':'Retired'}</span>: ${esc(c.out.coach.name)}<small>${c.out.seasons} season${c.out.seasons===1?'':'s'} · ${rec(c.out)} · ${(c.out.pct*100).toFixed(0)}%${c.out.titles?' · '+c.out.titles+' title'+(c.out.titles===1?'':'s'):''}</small></div><div>${c.in?'Hired: '+esc(c.in.coach.name)+'<small>'+esc(c.in.coach.style||'')+' · age '+c.in.coach.age+'</small>':'<span class="mu">Position vacant</span>'}</div></div>`).join('')+'</div>':'<p class="mu">No coaching changes at the end of '+q+'.</p>'}
  else{$('nt').textContent='Hall of Fame players of the save (the Hall of Fame flag) with their peak rating, seasons, honours and championships.';if(!P){o.innerHTML='<p class="mu">Reading players…</p>';P=(await LeagueData.players()).filter(p=>p.hof)}
   const ch=Object.fromEntries(Object.values(HO).filter(h=>h.champion).map(h=>[h.season,h.champion.tid]));
   const L=P.map(p=>{const r=p.ratings||[],pk=Math.max(0,...r.map(x=>x.ovr||0)),seas=[...new Set((p.stats||[]).filter(x=>!x.playoffs&&x.gp>0).map(x=>x.season))].sort(),rings=seas.filter(sn=>(p.stats||[]).some(x=>x.season===sn&&!x.playoffs&&x.tid===ch[sn])).length,mv=(p.awards||[]).filter(a=>/most valuable|\bmvp\b/i.test(a.type||'')&&!/final|super/i.test(a.type||'')).length,pos=(r.slice(-1)[0]||{}).pos||'';return{p,pk,seas,rings,mv,pos,aw:(p.awards||[]).length}}).sort((a,b)=>b.rings-a.rings||b.pk-a.pk);
   o.innerHTML=L.length?'<table><tr><th>Player</th><th>Pos</th><th class="n">Peak</th><th class="n">Seasons</th><th class="n">Years</th><th class="n">Rings</th><th class="n">MVPs</th><th class="n">Awards</th></tr>'+L.slice(0,80).map(e=>`<tr><td><a href="player.html?pid=${e.p.pid}">${esc(((e.p.firstName||'')+' '+(e.p.lastName||'')).trim())}</a> ★</td><td>${esc(e.pos)}</td><td class="n"><b>${e.pk}</b></td><td class="n">${e.seas.length}</td><td class="n">${e.seas.length?e.seas[0]+'–'+e.seas[e.seas.length-1]:''}</td><td class="n">${e.rings?'🏆 '+e.rings:''}</td><td class="n">${e.mv||''}</td><td class="n">${e.aw}</td></tr>`).join('')+'</table><p class="mu">Rings: seasons in which he played for the Super Bowl champion of that season.</p>':'<p class="mu">No player has the Hall of Fame flag in this save.</p>'}}
 $('tb').onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;$('tb').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw()};$('y').onchange=draw;draw()
}catch(e){o.innerHTML='<div class="card err"><b>Could not build the page.</b><p class="mu">'+Viz.esc(e.message)+'</p></div>';console.error(e)}})()</script></body></html>
